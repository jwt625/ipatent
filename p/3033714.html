<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Patents</title>
<script>
// Type style before first paint: ?type=, else the saved choice, else the default (DevLog-005).
(function () {
  var ok = ['plate', 'copperplate', 'specification'], q = (/[?&]type=(\w+)/.exec(location.search) || [])[1], s = null;
  try { s = localStorage.getItem('ipatent-type'); } catch (e) { }
  document.documentElement.dataset.type = ok.indexOf(q) >= 0 ? q : ok.indexOf(s) >= 0 ? s : 'copperplate';
})();
</script>
<style>
/* Fonts (OFL, fonts/OFL-*.txt). ../fonts/ is the fonts folder relative to the page, set by pipeline/build.py.
   Browsers download only the faces a page uses. */
@font-face { font-family: "Playfair Display"; src: url("../fonts/PlayfairDisplay.woff2") format("woff2"); font-weight: 400 900; font-style: normal; font-display: swap; }
@font-face { font-family: "Playfair Display"; src: url("../fonts/PlayfairDisplay-Italic.woff2") format("woff2"); font-weight: 400 900; font-style: italic; font-display: swap; }
@font-face { font-family: "Source Serif 4"; src: url("../fonts/SourceSerif4.woff2") format("woff2"); font-weight: 400 600; font-style: normal; font-display: swap; size-adjust: 96%; }
@font-face { font-family: "Source Serif 4"; src: url("../fonts/SourceSerif4-Italic.woff2") format("woff2"); font-weight: 400 600; font-style: italic; font-display: swap; size-adjust: 96%; }
@font-face { font-family: "Pinyon Script"; src: url("../fonts/PinyonScript.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "IM Fell English"; src: url("../fonts/IMFellEnglish.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "IM Fell English"; src: url("../fonts/IMFellEnglish-Italic.woff2") format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
@font-face { font-family: "Mrs Saint Delafield"; src: url("../fonts/MrsSaintDelafield.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "Old Standard TT"; src: url("../fonts/OldStandardTT.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "Old Standard TT"; src: url("../fonts/OldStandardTT-Italic.woff2") format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
@font-face { font-family: "Old Standard TT"; src: url("../fonts/OldStandardTT-Bold.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }

/* Type styles, html[data-type] (set before paint in template.html):
   plate          Playfair Display heads, Source Serif 4 text; figure labels as printed (FIG. 1)
   copperplate    Pinyon Script brand, group names and figure labels (Fig. 1), IM Fell English titles and heads, Source Serif 4 text
   specification  Mrs Saint Delafield brand and group names, Old Standard TT for the rest, italic figure labels */
:root, :root[data-type="plate"] {
  --f-text: "Source Serif 4", Georgia, serif; --f-num: "Source Serif 4", Georgia, serif; --fs-text: 14px; --fs-read: 15px;
  --f-disp: "Playfair Display", Georgia, serif; --disp-style: italic; --dk: 1;
  --f-title: "Playfair Display", Georgia, serif; --title-ls: .02em; --tk: 1;
  --f-script: "Playfair Display", Georgia, serif; --script-style: italic; --sk: 1; --script-pt: 0px;
  --f-fig: "Playfair Display", Georgia, serif; --fig-style: italic; --fk: 1;
}
:root[data-type="copperplate"] {
  --f-text: "Source Serif 4", Georgia, serif; --f-num: "Source Serif 4", Georgia, serif; --fs-text: 14px; --fs-read: 15px;
  --f-disp: "IM Fell English", Georgia, serif; --disp-style: italic; --dk: 1.08;
  --f-title: "IM Fell English", Georgia, serif; --title-ls: .035em; --tk: 1.06;
  --f-script: "Pinyon Script", "IM Fell English", Georgia, cursive; --script-style: normal; --sk: 1.38; --script-pt: 4px;
  --f-fig: "Pinyon Script", "IM Fell English", Georgia, cursive; --fig-style: normal; --fk: 1.38;
}
:root[data-type="specification"] {
  --f-text: "Old Standard TT", Georgia, serif; --f-num: "Old Standard TT", Georgia, serif; --fs-text: 14.5px; --fs-read: 16px;
  --f-disp: "Old Standard TT", Georgia, serif; --disp-style: italic; --dk: 1.05;
  --f-title: "Old Standard TT", Georgia, serif; --title-ls: .06em; --tk: .94;
  --f-script: "Mrs Saint Delafield", "Old Standard TT", Georgia, cursive; --script-style: normal; --sk: 1.6; --script-pt: 6px;
  --f-fig: "Old Standard TT", Georgia, serif; --fig-style: italic; --fk: 1;
}
:root[data-type="specification"] body { font-synthesis: small-caps; } /* Old Standard TT has no small-caps glyphs */

/* Palette: warm neutrals of the Plate style (dark #0d0d0d / ink #f2f1ec), light theme on #f1f0ec paper.
   Type roles (set per style below): --f-text body and UI, --f-disp display heads, --f-title patent titles (printed in caps),
   --f-script brand, group names and figure labels, --f-num numerals and citations. */
:root {
  --surface-0: #f1f0ec; --surface-1: #fcfcfb; --surface-2: #e9e8e2; --border: rgba(11, 11, 11, .14); --grid: #e1e0d9;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #6f6d68; --rule: #5f5e59;
  --series-1: #2a78d6; --series-2: #b85f08; --context: #b9b7ae; --amber: #b85f08;
  --ink: #2b2b29; --hi: #2a78d6; --hi-fill: rgba(42, 120, 214, .14); --mark: rgba(237, 161, 0, .30);
  --amber-fill: rgba(184, 95, 8, .10); --amber-tag: rgba(184, 95, 8, .16);
  --scan-filter: none;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface-0: #0d0d0d; --surface-1: #1a1a19; --surface-2: #232321; --border: rgba(255, 255, 255, .12); --grid: #2c2c2a;
    --text-primary: #f2f1ec; --text-secondary: #c3c2b7; --text-muted: #a8a69d; --rule: #a8a69d;
    --series-1: #4c9bf0; --series-2: #f7962c; --context: #6b6a63; --amber: #f7962c;
    --ink: #d6d5cc; --hi: #4c9bf0; --hi-fill: rgba(76, 155, 240, .20); --mark: rgba(201, 133, 0, .42);
    --amber-fill: rgba(247, 150, 44, .08); --amber-tag: rgba(247, 150, 44, .18);
    --scan-filter: invert(1) brightness(.86);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --surface-0: #0d0d0d; --surface-1: #1a1a19; --surface-2: #232321; --border: rgba(255, 255, 255, .12); --grid: #2c2c2a;
  --text-primary: #f2f1ec; --text-secondary: #c3c2b7; --text-muted: #a8a69d; --rule: #a8a69d;
  --series-1: #4c9bf0; --series-2: #f7962c; --context: #6b6a63; --amber: #f7962c;
  --ink: #d6d5cc; --hi: #4c9bf0; --hi-fill: rgba(76, 155, 240, .20); --mark: rgba(201, 133, 0, .42);
  --amber-fill: rgba(247, 150, 44, .08); --amber-tag: rgba(247, 150, 44, .18);
  --scan-filter: invert(1) brightness(.86);
  color-scheme: dark;
}
* { box-sizing: border-box; }
button, input, select { border-radius: 0; }
html, body { margin: 0; height: 100%; background: var(--surface-0); color: var(--text-primary);
  font: var(--fs-text, 14px)/1.45 var(--f-text); font-optical-sizing: auto; font-synthesis: none; }
body { overflow: hidden; }
::selection { background: var(--hi-fill); }
a { color: var(--series-1); text-decoration: none; }
button, input, select { font: inherit; color: var(--text-primary); }
button { background: transparent; border: 1px solid var(--border); padding: 2px 9px; cursor: pointer; white-space: nowrap; }
button:hover { background: var(--surface-2); }
button.on { background: var(--hi-fill); border-color: var(--hi); color: var(--text-primary); }
button:disabled { opacity: .4; cursor: default; }
input::placeholder { color: var(--text-muted); font-style: italic; }
.mono, .num { font-family: var(--f-num); font-variant-numeric: lining-nums tabular-nums; }
.lbl { font-family: var(--f-text); font-size: 13px; font-weight: 600; font-variant-caps: all-small-caps; letter-spacing: .07em; color: var(--text-muted); }
.spacer { flex: 1; }
.grp { display: inline-flex; }
.grp button + button { border-left: 0; }
/* scotch rule over major heads: 2px over 1px, neutral */
.ghead, .about h3, .tsec { position: relative; border-top: 2px solid var(--rule); }
.ghead::before, .about h3::before, .tsec::before { content: ''; position: absolute; left: 0; right: 0; top: 2px; border-top: 1px solid var(--rule); }
.tsec, .tsec::before { border-top-color: var(--context); }

#app { display: grid; grid-template-rows: 44px minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); height: 100vh; }
#bar { display: flex; align-items: center; gap: 14px; padding: 0 12px; background: var(--surface-0); border-bottom: 1px solid var(--border); min-width: 0; }
#home { color: var(--text-primary); white-space: nowrap; flex-shrink: 0; font: var(--script-style, normal) 400 calc(21px * var(--sk, 1))/1 var(--f-script); letter-spacing: var(--script-ls, 0); padding-top: var(--script-pt, 0); }
#crumb { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); }
#crumb .num { color: var(--text-primary); margin-right: 10px; }
#crumb .tt { font-family: var(--f-title); letter-spacing: var(--title-ls, .02em); font-size: calc(14px * var(--tk, 1)); }
#tabs { display: flex; height: 100%; padding: 7px 0; gap: 2px; }
#tabs a { display: flex; align-items: center; padding: 0 11px; color: var(--text-secondary); font: var(--disp-style, italic) 400 16px var(--f-disp); }
#tabs a:hover { color: var(--text-primary); background: var(--surface-2); }
#tabs a.on { color: var(--text-primary); background: var(--hi-fill); }
#themeBtn { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 28px; padding: 0; border-color: transparent; color: var(--text-secondary); }
#themeBtn:hover { color: var(--text-primary); border-color: var(--border); }
#themeBtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; }
#typeSw button { width: 30px; height: 28px; padding: 0; border-color: transparent; color: var(--text-secondary); font-size: 17px; line-height: 1; }
#typeSw button:hover { color: var(--text-primary); border-color: var(--border); }
#typeSw button.on { color: var(--text-primary); background: var(--hi-fill); border-color: transparent; }
#typeSw [data-t="plate"] { font: italic 400 17px "Playfair Display", Georgia, serif; }
#typeSw [data-t="copperplate"] { font: 400 22px "Pinyon Script", Georgia, cursive; }
#typeSw [data-t="specification"] { font: 400 24px "Mrs Saint Delafield", Georgia, cursive; }
#main { min-height: 0; overflow: hidden; }
#foot { display: flex; align-items: center; gap: 6px; height: 20px; padding: 0 10px; font-size: 11px; color: var(--text-muted); background: var(--surface-0); border-top: 1px solid var(--border); white-space: nowrap; overflow: hidden; }
#foot .sep { color: var(--context); }

/* gallery */
.gallery { height: 100%; overflow-y: auto; padding: 0 24px 24px; }
.gbar { position: sticky; top: 0; z-index: 3; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; max-width: 1240px; margin: 0 auto; padding: 12px 0 8px; background: var(--surface-0); }
.gbar input { flex: 0 1 420px; min-width: 0; height: 30px; padding: 3px 8px; background: var(--surface-1); border: 1px solid var(--border); }
.gbar select { height: 30px; background: var(--surface-1); border: 1px solid var(--border); padding: 2px 4px; }
.gbar button { height: 30px; }
.gfacets { display: grid; gap: 6px; max-width: 1240px; margin: 0 auto 8px; }
.frow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.frow > .lbl { width: 72px; flex: none; }
.fchip { padding: 1px 8px; font-size: 13px; color: var(--text-secondary); background: var(--surface-1); border-color: transparent; }
.fchip:hover { color: var(--text-primary); }
.fchip .num { color: var(--text-muted); margin-left: 5px; font-size: 12px; }
.fchip.on { background: var(--hi-fill); border-color: transparent; color: var(--hi); }
.fchip.on .num { color: var(--hi); }
.gnone { max-width: 1240px; margin: 24px auto; }
.unk { color: var(--context); }
.gtable .st { white-space: nowrap; }
.pl { color: var(--text-muted); }
/* booktabs: heavy top rule, rule under the head, thin grid rules, no verticals */
.gtable { max-width: 1240px; margin: 16px auto 0; overflow-x: auto; border-top: 2px solid var(--rule); border-bottom: 1px solid var(--rule); }
.gtable table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.gtable th { position: sticky; top: 0; background: var(--surface-0); text-align: left; font-size: 13px; font-weight: 600; font-variant-caps: all-small-caps; letter-spacing: .07em; color: var(--text-muted); padding: 6px 8px; box-shadow: inset 0 -1px 0 var(--rule); cursor: pointer; white-space: nowrap; user-select: none; }
.gtable th.on { color: var(--text-primary); }
.gtable .rz { position: absolute; top: 0; right: 0; bottom: 0; width: 7px; cursor: col-resize; touch-action: none; }
.gtable .rz:hover, .gtable .rz:active { border-right: 2px solid var(--hi); }
.gtable table.sized { table-layout: fixed; }
.gtable table.sized th, .gtable table.sized td { box-sizing: border-box; overflow: hidden; text-overflow: ellipsis; }
.gtable th.r, .gtable td.r { text-align: right; font-family: var(--f-num); font-variant-numeric: lining-nums tabular-nums; }
.gtable td { padding: 4px 8px; border-bottom: 1px solid var(--grid); color: var(--text-secondary); vertical-align: top; }
.gtable td.tt { color: var(--text-primary); min-width: 220px; font-family: var(--f-title); letter-spacing: var(--title-ls, .02em); font-size: calc(13px * var(--tk, 1)); }
.gtable td.num { white-space: nowrap; }
.gtable tbody tr { cursor: pointer; }
.gtable tbody tr:hover td { background: var(--hi-fill); }
#tip .tthumb { display: block; width: 220px; filter: var(--scan-filter); margin-bottom: 4px; }
#tip .tmeta { margin-bottom: 2px; }
#tip .pl { margin-left: 4px; }
.ghead { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 14px; margin-bottom: -6px; padding-top: 12px; color: var(--text-primary);
  font: var(--script-style, normal) 400 calc(30px * var(--sk, 1))/1.15 var(--f-script); letter-spacing: var(--script-ls, 0); }
.ghead .gcnt { margin-left: auto; font: 600 13px var(--f-text); font-style: normal; font-variant-caps: all-small-caps; letter-spacing: .07em; color: var(--text-muted); }
.cards + .cards { margin-top: 40px; }
.gout { padding-bottom: 24px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 520px)); justify-content: center; gap: 24px; max-width: 1240px; margin: 0 auto; }
.card { display: grid; grid-template-rows: 360px auto; background: var(--surface-1); border: 1px solid var(--border); cursor: pointer; color: inherit; }
.card:hover { border-color: var(--text-muted); }
.card .thumb { overflow: hidden; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: center; padding: 12px; background: var(--surface-0); }
.card .thumb svg, .card .thumb img { width: 100%; height: 100%; }
.card .meta { padding: 12px 14px 14px; display: grid; gap: 5px; }
.card .meta > .row:first-child { color: var(--text-muted); font-size: 13px; }
.card .t { font: 400 calc(18px * var(--tk, 1))/1.25 var(--f-title); letter-spacing: var(--title-ls, .02em); }
.card .row { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--text-secondary); font-size: 14px; }
.card .t + .row { font-style: italic; color: var(--text-primary); }
.card .counts { color: var(--text-muted); font-size: 13px; font-family: var(--f-num); font-variant-numeric: lining-nums; }

/* figures tab */
.figs { display: grid; grid-template-columns: 200px minmax(0, 1fr) 360px; height: 100%; }
.flist { overflow-y: auto; border-right: 1px solid var(--border); background: var(--surface-1); }
.fitem { display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: center; padding: 6px 10px; cursor: pointer; border-bottom: 1px solid var(--grid); }
.fitem:hover { background: var(--surface-2); }
.fitem.on { background: var(--hi-fill); }
.fitem img { width: 56px; height: 56px; object-fit: contain; background: #fff; filter: var(--scan-filter); }
.fitem .fl { font: var(--fig-style, normal) 400 calc(17px * var(--fk, 1))/1.1 var(--f-fig); }
.fitem .fs { font-size: 12px; font-style: italic; color: var(--text-muted); }
.center { display: grid; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 6px 10px; border-bottom: 1px solid var(--border); background: var(--surface-1); }
.tools .lbl { margin-right: -6px; }
.tools input[type=range] { width: 160px; accent-color: var(--hi); }
.stepv { min-width: 9ch; color: var(--text-secondary); }
.plotp { position: absolute; top: 8px; right: 8px; z-index: 5; width: min(340px, calc(100% - 16px)); max-height: calc(100% - 16px); overflow: auto;
  display: grid; gap: 7px; padding: 9px 10px 10px; background: var(--surface-1); border: 1px solid var(--rule); }
.plotp[hidden] { display: none; }
.plotp .prw { display: flex; align-items: center; gap: 6px; }
.plotp .prw > .lbl { width: 76px; flex: none; }
.plotp .prw > .lbl + .lbl, .plotp .u + .lbl { width: auto; margin-left: 10px; }
.plotp select, .plotp input { height: 26px; padding: 1px 4px; background: var(--surface-0); border: 1px solid var(--border); min-width: 0; }
.plotp input { width: 62px; }
.plotp .u { color: var(--text-muted); font-size: 13px; }
.plotp .ppv { display: flex; justify-content: center; align-items: center; height: 300px; background: var(--surface-2); }
.plotp .ppv img { max-width: 100%; max-height: 100%; background: #fff; box-shadow: 0 0 0 1px var(--border); }
.plotp .pst { font-size: 12px; color: var(--text-secondary); }
.side { border-left: 1px solid var(--border); background: var(--surface-1); display: grid; grid-template-rows: minmax(0, 1.3fr) minmax(0, 1fr); min-height: 0; }
.info { overflow-y: auto; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.info h2 { margin: 0 0 10px; font: 500 20px/1.2 var(--f-disp); display: flex; align-items: baseline; gap: 10px; }
.info h2 .num { color: var(--hi); font-family: var(--f-num); }
.info h2.fh { font: var(--fig-style, normal) 400 calc(26px * var(--fk, 1))/1.1 var(--f-fig); }
.info .alt { color: var(--text-muted); font-size: 13px; font-style: italic; margin: -6px 0 8px; }
.quote { margin: 0 0 12px; color: var(--text-primary); font-style: italic; }
.cite { font-family: var(--f-num); font-variant-numeric: lining-nums tabular-nums; font-style: normal; font-size: 12px; color: var(--text-muted); cursor: pointer; white-space: nowrap; }
.cite:hover { color: var(--hi); }
.note { margin: 0 0 12px; padding: 7px 10px 8px; background: var(--amber-fill); color: var(--text-secondary); font-size: 14px; }
.note .lbl { display: inline-block; margin: 0 6px 2px 0; padding: 0 6px 1px; color: var(--amber); background: var(--amber-tag); }
.sub { margin: 14px 0 4px; }
.mlist { display: grid; gap: 6px; }
.mitem { font-size: 14px; cursor: pointer; padding: 2px 0; }
.mitem:hover { color: var(--hi); }
.mitem b { color: var(--hi); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
.chip { padding: 0 7px; font-size: 13px; cursor: pointer; background: var(--surface-2); color: var(--text-secondary); }
.chip:hover, .chip.on { background: var(--hi-fill); color: var(--hi); }
.plist { overflow-y: auto; }
.plist .head { position: sticky; top: 0; background: var(--surface-1); padding: 6px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.prow { display: grid; grid-template-columns: 48px 1fr; gap: 10px; padding: 3px 14px; cursor: pointer; font-size: 14px; }
.prow:hover { background: var(--surface-2); }
.prow.on { background: var(--hi-fill); }
.prow .num { color: var(--text-muted); text-align: right; }
.prow.on .num { color: var(--hi); }

/* figure view */
.fv { position: relative; overflow: hidden; min-height: 0; background: var(--surface-0); touch-action: none; }
.fv svg.stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
.fv.panning svg.stage { cursor: grabbing; }
.fv .scan { filter: var(--scan-filter); }
.fv .tr-s { stroke: var(--ink); fill: none; stroke-linecap: round; stroke-linejoin: round; }
.fv .tr-fill-solid { fill: var(--ink); }
.fv .tr-fill-light { fill: var(--ink); fill-opacity: .08; }
.fv .tr-arrow { fill: var(--ink); }
.fv .tr-hatchline { stroke: var(--ink); stroke-width: 2; }
.fv .tr-fill-paper { fill: var(--surface-0); }
.fv .tr-ink-paper.tr-s, .fv .tr-el.on .tr-ink-paper.tr-s { stroke: var(--surface-0); }
.fv .tr-t.tr-ink-paper, .fv .tr-el.on .tr-t.tr-ink-paper { fill: var(--surface-0); }
.fv .tr-t { fill: var(--ink); font-family: Helvetica, Arial, ui-sans-serif, sans-serif; }
.fv .tr-it { font-style: italic; }
.fv .tr-b { font-weight: 700; }
.fv .tr-k-label .tr-t { fill: var(--text-secondary); }
.fv .tr-el { transition: opacity .12s; }
.fv.m-trace .scan { display: none; }
.fv.m-scan .tr-el { opacity: 0; }
.fv.m-overlay .scan { opacity: .55; }
.fv.m-overlay .tr-s, .fv.m-overlay .tr-arrow { stroke: var(--hi); }
.fv.m-overlay .tr-t, .fv.m-overlay .tr-fill-solid, .fv.m-overlay .tr-arrow { fill: var(--hi); }
.fv.sel .tr-el { opacity: .3; }
.fv.m-scan.sel .tr-el { opacity: 0; }
.fv .tr-el.on { opacity: 1 !important; }
.fv .tr-el.on .tr-s { stroke: var(--hi); }
.fv .tr-el.on .tr-t, .fv .tr-el.on .tr-fill-solid, .fv .tr-el.on .tr-arrow { fill: var(--hi); }
.fv .tr-el.on.tr-k-block .tr-s:not(polyline):not(.tr-fill-solid) { fill: var(--hi-fill); }
.fv .tr-el.fut { opacity: .08; }
.fv .tr-el.now .tr-s { stroke: var(--series-2); }
.fv .tr-el.now .tr-t, .fv .tr-el.now .tr-fill-solid { fill: var(--series-2); }
.fv .hit * { fill: transparent; stroke: transparent; }
.fv .hit [data-ref] { cursor: pointer; }
.fv .fvTag { position: absolute; left: 10px; top: 6px; color: var(--text-muted); font: var(--fig-style, normal) 400 calc(16px * var(--fk, 1)) var(--f-fig); pointer-events: none; }
.fv .fvZoom { position: absolute; right: 8px; bottom: 6px; color: var(--text-muted); font: 12px var(--f-num); pointer-events: none; }
.fv .fvFull { position: absolute; right: 8px; top: 6px; }

/* text + claims tab */
.textv { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 44%); height: 100%; }
.tcol { overflow-y: auto; border-right: 1px solid var(--border); }
.tbar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 6px 16px; background: var(--surface-1); border-bottom: 1px solid var(--border); }
.tbar input { width: 260px; padding: 3px 8px; background: var(--surface-0); border: 1px solid var(--border); }
.tbar select { background: var(--surface-0); border: 1px solid var(--border); padding: 2px 4px; max-width: 280px; }
.tbody { max-width: 820px; padding: 8px 16px 64px; font-size: var(--fs-read, 15px); line-height: 1.55; }
.tsec { margin: 30px 0 12px 58px; padding-top: 10px; font: var(--disp-style, italic) 400 calc(19px * var(--dk, 1))/1.2 var(--f-disp); letter-spacing: .01em; color: var(--text-primary); }
.para { display: grid; grid-template-columns: 48px 1fr; gap: 10px; margin: 0 0 10px; }
.para .cite { text-align: right; padding-top: 4px; }
.para.flash { background: var(--mark); }
.para p { margin: 0; }
.para table { border-collapse: collapse; font-size: 13px; border-top: 2px solid var(--rule); border-bottom: 1px solid var(--rule); }
.para td { border-bottom: 1px solid var(--grid); padding: 2px 8px; font-family: var(--f-num); font-variant-numeric: lining-nums tabular-nums; }
a.rf { color: var(--hi); font-family: var(--f-num); font-variant-numeric: lining-nums; font-weight: 600; }
a.rf:hover { background: var(--hi-fill); }
a.rf.on { background: var(--hi-fill); }
a.fg { color: var(--series-1); font-style: italic; }
a.fg:hover { background: var(--hi-fill); }
mark { background: var(--mark); color: inherit; }
.claim { margin: 0 0 14px; }
.claim.dep { margin-left: 24px; }
.claim > .lbl .num { margin-right: 4px; font-size: 15px; color: var(--text-primary); font-variant-caps: normal; }
.claim p { margin: 0; white-space: pre-line; }
.pane { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
.pane .tools { gap: 8px; }
.pane .fv { height: 100%; }

/* about */
.about { height: 100%; overflow-y: auto; padding: 16px 24px 64px; }
.about .wrap { max-width: 900px; }
.about h3 { margin: 30px 0 10px; padding-top: 10px; font: var(--disp-style, italic) 400 calc(21px * var(--dk, 1))/1.2 var(--f-disp); color: var(--text-primary); }
.about table { border-collapse: collapse; width: 100%; font-size: 14px; border-bottom: 1px solid var(--rule); }
.about td, .about th { text-align: left; padding: 3px 10px 3px 0; border-bottom: 1px solid var(--grid); vertical-align: top; }
.about th { font-weight: 600; color: var(--text-muted); width: 150px; font-size: 13px; font-variant-caps: all-small-caps; letter-spacing: .07em; }
.about dl { display: grid; grid-template-columns: 180px 1fr; gap: 6px 14px; margin: 0; font-size: 14px; }
.about dt { font-weight: 600; }
.about dd { margin: 0; color: var(--text-secondary); }
.sources { color: var(--text-muted); font-size: 13px; font-style: italic; margin-top: 24px; }

#tip { position: fixed; pointer-events: none; z-index: 30; display: none; max-width: 340px; padding: 5px 8px;
  background: var(--surface-1); border: 1px solid var(--rule); font-size: 13px; }
#tip .num { color: var(--hi); margin-right: 6px; }
#modal { position: fixed; inset: 24px; z-index: 40; background: var(--surface-1); border: 1px solid var(--rule); display: grid; grid-template-rows: 38px 1fr; }
#modal[hidden] { display: none; }
#modalBar { display: flex; align-items: center; gap: 10px; padding: 0 10px; border-bottom: 1px solid var(--border); }
#modalBody { position: relative; min-height: 0; }
#modalBody .fv { position: absolute; inset: 0; }
.fv .colmark { fill: var(--mark); stroke: none; }

@media (max-width: 1000px) {
  .figs { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) minmax(0, 40vh); }
  .fitem .fl { white-space: nowrap; }
  #bar { overflow-x: auto; }
  #tabs, #themeBtn { flex-shrink: 0; }
  #crumb { flex-shrink: 1; }
  .flist { display: flex; overflow-x: auto; overflow-y: hidden; border-right: 0; border-bottom: 1px solid var(--border); }
  .fitem { grid-template-columns: 40px auto; border-bottom: 0; border-right: 1px solid var(--grid); }
  .fitem img { width: 40px; height: 40px; }
  .side { border-left: 0; border-top: 1px solid var(--border); grid-template-rows: auto; overflow-y: auto; }
  .info { overflow: visible; }
  .plist { overflow: visible; }
  .textv { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 36vh; }
  .para { grid-template-columns: 40px minmax(0, 1fr); gap: 6px; }
  .tsec { margin-left: 46px; }
  .tbody { padding: 8px 10px 48px; }
  .tcol { border-right: 0; border-bottom: 1px solid var(--border); }
  .tbar input { width: auto; flex: 1 1 0; min-width: 0; }
  .tbar select { flex: 1 1 0; min-width: 0; }
  .tbar { padding: 6px 10px; gap: 6px; }
  #bar { gap: 8px; padding: 0 8px; }
  #home { font-size: calc(15px * var(--sk, 1)); }
  #typeSw button { width: 26px; }
  #crumb .tt { display: none; }
  #tabs a { padding: 0 7px; font-size: 15px; }
  .cards { grid-template-columns: minmax(0, 1fr); }
  .card { grid-template-rows: 280px auto; }
  .gallery { padding: 0 16px 16px; }
  .gbar input { flex: 1 1 100%; }
  .frow > .lbl { width: 100%; }
  .ghead { font-size: calc(24px * var(--sk, 1)); }
}

window.PATENTS = [{"pn":"3033714","number":"3,033,714","doc":null,"date_label":null,"cite_scheme":null,"scan_source":null,"title":"DIODE TYPE SEMICONDUCTOR DEVICE","inventors":["Reona Ezaki","Yuriko Kurose"],"assignee":"Sony Corporation, Tokyo, Japan, a corporation of Japan","filed":"1958-05-08","issued":"1962-05-08","appl_no":"733,994","int_cl":null,"us_cl":"148—33","refs_patents":[{"no":"2,505,633","date":"Apr. 25, 1950","name":"Whaley","cl":""},{"no":"2,524,035","date":"Oct. 3, 1950","name":"Bardeen et al.","cl":""},{"no":"2,567,970","date":"Sept. 18, 1951","name":"Scaff et al.","cl":""},{"no":"2,744,970","date":"May 8, 1956","name":"Shockley","cl":""},{"no":"2,754,431","date":"July 10, 1956","name":"Johnson","cl":""},{"no":"2,790,037","date":"Apr. 23, 1957","name":"Shockley","cl":""},{"no":"2,843,516","date":"July 15, 1958","name":"Herlet","cl":""},{"no":"2,870,052","date":"Jan. 20, 1959","name":"Rittmann","cl":""},{"no":"2,890,976","date":"June 16, 1959","name":"Lehovec","cl":""}],"refs_other":["Johnson and McKay: Physical Review, vol. 93, No. 4, February 15, 1954, pages 668 to 672."],"examiners":"","claims_count":7,"drawing_figures":7,"abstract":"","google":"https://patents.google.com/patent/US3033714A/en","col1_page":1,"group":"Chips and microdevices","page_wh":[[2320,3408],[2320,3408],[2320,3408],[2320,3408],[2320,3408]],"entities":{"pn":"3033714","inventors":[{"name":"Reona Ezaki","printed":"Reona Ezaki, Tokyo","city":"Tokyo","region":null,"country":"JP"},{"name":"Yuriko Kurose","printed":"Yuriko Kurose, Kamakura-shi, Japan","city":"Kamakura-shi","region":null,"country":"JP"}],"assignees":[{"name":"Sony Corporation","printed":"Sony Corporation, Tokyo, Japan, a corporation of Japan","org":"Sony","kind":"company","city":"Tokyo","region":null,"country":"JP"}],"source":{"page":1,"where":"column 1 header (inventors, assignors to)"}},"status":{"state":"Expired","term_end":"1979-05-08","basis":"17 years from grant","google_expiration":"1979-05-08","checked":"2026-11-26"},"sections":[{"heading":"","first":0},{"heading":"CERTIFICATE OF CORRECTION","first":49}],"paras":[{"id":0,"sec":0,"col":1,"line":10,"text":"This invention relates to a semiconductor device and more particularly to a diode type semiconductor device.","spans":[]},{"id":1,"sec":0,"col":1,"line":12,"text":"p-n Junctions of germanium, silicon or other semiconductor materials have superior rectification effect so that such a semiconductor device has been used as a rectifier. The rectification characteristics of such a diode has satisfactorily been explained by Shockley’s theory. That is, if the p-type region is maintained positive potential with respect to the n-type region, the minority carriers are injected so that the resistance of the diode becomes low. On the contrary, if the polarity of the electrodes is reversed, the resistance of the diode becomes very high to permit merely to pass the saturated current. Moreover, if the reverse voltage is increased, owing to a strong electric field in the space charge layer, electron multiplication or field emission of electrons occur to cause the so-called break-down, whereby the resistance in the reverse direction is appreciably decreased. The reverse breakdown voltage of the diode is mainly decided by the impurity concentration in the semiconductor. In most cases, diodes which have the impurity concentration of less than 10^{-7} cm.^{-3} in the high resistivity side or the reverse breakdown voltage of at least more than 1 volt have actually been used.","spans":[]},{"id":2,"sec":0,"col":1,"line":34,"text":"In accordance with this invention, the p-n junction contains the impurity concentration from 10^{18} cm.^{-3} to 10^{20} cm.^{-3} in the high resistivity side of which the reverse direction is more conductive than the forward.","spans":[[113,115,"ref","10"]]},{"id":3,"sec":0,"col":1,"line":38,"text":"The impurity aforesaid means doner type impurity in n-type region and accepter type impurity in p-type region. The reverse direction means the direction in which the plus potential is applied to the n-type region with respect to the p-type region. The forward direction, on the contrary, means the direction in which the plus potential is applied to the p-type region with respect to the n-type region.","spans":[]},{"id":4,"sec":0,"col":1,"line":46,"text":"One object of this invention is to provide a diode type semiconductor device in which characteristic in the reverse direction is substantially the same as that in the forward direction so as to be the symmetrical rectification characteristics.","spans":[]},{"id":5,"sec":0,"col":1,"line":51,"text":"Another object of this invention is to provide a diode type semiconductor device which has a negative resistance in the positive voltage of the range from about 0.03 volt to about 0.2 volt.","spans":[]},{"id":6,"sec":0,"col":1,"line":55,"text":"A further object of this invention is to provide a diode type semiconductor device which has no transit and no minority carrier storage time and is independent of ambient gas and light incident and is insensitive to temperature change.","spans":[]},{"id":7,"sec":0,"col":1,"line":60,"text":"A still further object of this invention is to provide a diode type semiconductor device which can be available without depending upon frequencies to be used.","spans":[]},{"id":8,"sec":0,"col":1,"line":63,"text":"Other objects, features and advantages of this invention will be more fully apparent from the following detailed description taken in connection with the accompanying drawings, in which:","spans":[]},{"id":9,"sec":0,"col":1,"line":67,"text":"FIG. 1 is a diagrammatical sectional view of a diode type semiconductor device according to this invention.","spans":[[0,6,"fig","1"]]},{"id":10,"sec":0,"col":1,"line":69,"text":"FIGS. 2 to 4 illustrate various characteristic curves of a diode type semiconductor device according to this invention.","spans":[[0,7,"fig","2"],[11,12,"fig","4"]]},{"id":11,"sec":0,"col":2,"line":1,"text":"FIG. 5 shows curves illustrating the negative resistance characteristic of a diode according to this invention.","spans":[[0,6,"fig","5"]]},{"id":12,"sec":0,"col":2,"line":3,"text":"FIG. 6 shows a connection diagram of an oscillation circuit, by way of example, showing how to utilize a diode according to this invention, and","spans":[[0,6,"fig","6"]]},{"id":13,"sec":0,"col":2,"line":6,"text":"FIG. 7 is the equivalent circuit of the oscillation circuit shown in FIG. 6.","spans":[[0,6,"fig","7"],[69,75,"fig","6"]]},{"id":14,"sec":0,"col":2,"line":8,"text":"A diode type semiconductor device according to this invention is made by the alloying technique so that the construction of the diode can be diagrammatically shown in FIG. 1. That is, the p-n junction of the diode is formed between a recrystalized germanium piece 3 and a p-type base germanium piece 1. 2 is an alloy metal containing a donor impurity and indium containing phosphorus was used as this metal in an experiment. 4 is the base metal; 5 is a lead wire for the p-type side and 6 a lead wire for the n-type side. It can be supposed that the impurity concentration in the n-type recrystalized germanium piece will be 10^{19} cm.^{-3} or more.","spans":[[167,173,"fig","1"],[264,265,"ref","3"],[300,301,"ref","1"],[487,488,"ref","6"],[625,627,"ref","10"]]},{"id":15,"sec":0,"col":2,"line":20,"text":"The heat treating temperature in the alloying techniques is usually 500° C. to 700° C. but the current voltage characteristic of the diode varies appreciably according to the treating temperature.","spans":[]},{"id":16,"sec":0,"col":2,"line":24,"text":"In FIGS. 2 to 5, abscissa shows the plus voltage which is applied to the p-type side with respect to the n-type side. This is corresponding to the so-called forward direction in an ordinary p-n junction.","spans":[[3,10,"fig","2"],[14,15,"fig","5"]]},{"id":17,"sec":0,"col":2,"line":28,"text":"In every specimen, it will be recognized at the voltage more than about 0.3 volt in this direction that the current coincides quantitatively with the ordinary rectification equation","spans":[]},{"id":18,"sec":0,"col":2,"line":33,"text":"I=I_{s}(exp (qV/kT)-1) (1)","spans":[[24,25,"ref","1"]]},{"id":19,"sec":0,"col":2,"line":35,"text":"where","spans":[]},{"id":20,"sec":0,"col":2,"line":36,"text":"q=electronic charge","spans":[]},{"id":21,"sec":0,"col":2,"line":37,"text":"k=Boltzmann’s constant","spans":[]},{"id":22,"sec":0,"col":2,"line":38,"text":"T=temperature","spans":[]},{"id":23,"sec":0,"col":2,"line":40,"text":"According to this invention a rectifier made by using germanium has particular advantages below about 0.2 volt in the forward direction and also in the reverse direction.","spans":[]},{"id":24,"sec":0,"col":2,"line":44,"text":"Some embodiments of germanium diodes according to this invention are as follows:","spans":[]},{"id":25,"sec":0,"col":2,"line":46,"text":"p-Type germanium having the specific resistivity less than 0.01 ohm-cm. or the acceptor concentration more than 10^{18} cm.^{-3} is used and p-n junction is formed thereon by the alloying techniques.","spans":[]},{"id":26,"sec":0,"col":2,"line":50,"text":"The various current voltage characteristics as shown in FIGS. 2, 3 and 4 are obtained according to the impurity concentration.","spans":[[56,63,"fig","2"],[65,66,"fig","3"],[71,72,"fig","4"]]},{"id":27,"sec":0,"col":2,"line":53,"text":"Namely, FIG. 2 shows the characteristic curve of the diode type semiconductor device, the impurity concentration of the p-type region of which is about 1×10^{18} cm.^{-3}.","spans":[[8,14,"fig","2"]]},{"id":28,"sec":0,"col":2,"line":56,"text":"FIG. 3 shows the characteristic curve of the semiconductor device, the impurity concentration of the p-type region of which is about 2×10^{18} cm.^{-3}.","spans":[[0,6,"fig","3"]]},{"id":29,"sec":0,"col":2,"line":59,"text":"FIGS. 4 and 5 respectively show characteristic curve of a semiconductor device, the impurity concentration of the p-type region of which is 10^{19} cm.^{-3}.","spans":[[0,7,"fig","4"],[12,13,"fig","5"],[140,142,"ref","10"]]},{"id":30,"sec":0,"col":2,"line":62,"text":"From the above characteristic curve shown in the drawings the following advantages will be apparent:","spans":[]},{"id":31,"sec":0,"col":2,"line":64,"text":"(1) The specimen shown in FIG. 2 has substantially the same characteristic in the reverse direction as that in the forward.","spans":[[1,2,"ref","1"],[26,32,"fig","2"]]},{"id":32,"sec":0,"col":2,"line":67,"text":"The current in the reverse direction is mainly based upon the internal field emission.","spans":[]},{"id":33,"sec":0,"col":2,"line":69,"text":"(2) The specimen shown in FIG. 3 has lower resistance in the reverse direction than that in the forward.","spans":[[1,2,"ref","2"],[26,32,"fig","3"]]},{"id":34,"sec":0,"col":2,"line":71,"text":"This is because of the fact that the increased impurity concentration is increased to reduce the width of the p-n junction, thereby urging larger amount of the internal field emission current.","spans":[]},{"id":35,"sec":0,"col":3,"line":3,"text":"(3) The specimen shown in FIGS. 4 and 5 has not only lower resistance in the reverse direction than that in the forward but also has the dynatrontype negative resistance, in the forward, over the voltage range from about 0.03 to about 0.2 volt. The curve 1 in FIG. 5 is plotted at the temperature of 25° C. and the curve 11 at the temperature of -75° C. Such a tendency of the negative resistance will be seen in the case that the junction is made by alloying technique using germanium of the impurity concentration of 5×10^{18} cm.^{-3} to 2×10^{18} cm.^{-3}. In this case, the transistion region width of the p-n junction decreases to the order of 2×10^{-6} cm. and it must be supposed that the built-in field will cause the internal field emission even in the case of no applied voltage. Accordingly, the internal field emission current will be seen not only in the reverse direction but also at a low voltage even in the forward.","spans":[[1,2,"ref","3"],[26,33,"fig","4"],[38,39,"fig","5"],[255,256,"ref","1"],[260,266,"fig","5"],[321,323,"ref","11"],[541,542,"ref","2"]]},{"id":36,"sec":0,"col":3,"line":20,"text":"Experiments show that a satisfactory p-n junction can not be obtained by the alloying technique of other techniques in the case of using the impurity concentration of more than 10^{20} cm.^{-3}. The similar semiconductor devices as shown in FIGS. 2 to 5 can be obtained, according to the impurity concentration, by the alloying technique using indium to n-type germanium containing the donor impurity than 10^{18} cm.^{-3}.","spans":[[241,248,"fig","2"],[252,253,"fig","5"]]},{"id":37,"sec":0,"col":3,"line":28,"text":"It will be understood that semiconductor devices having analogous characteristics can be obtained by using other semiconductors than germanium and silicon.","spans":[]},{"id":38,"sec":0,"col":3,"line":31,"text":"The operating mechanism of the diode type semiconductor device according to this invention is not made by diffusion or drift of the minority carrier as known heretofore so that the negative resistance of the diode according to this invention is fundamentarily different from the negative resistance device based upon the transistor action and therefore has various advantages. That is, the diode of this invention has no appreciable change in characteristics by the temperature change and light beam and also shows good frequency response in spite of having a comparatively large capacitance.","spans":[]},{"id":39,"sec":0,"col":3,"line":42,"text":"The diode type semiconductor device according to this invention has the characteristics as referred to in FIGS. 4 and 5 so that it will be understood that the diode can be used as an oscillator by connecting an oscillation circuit thereto and that the diode with an adequate connection can operate as a relaxation oscillator. It is also apparent that the diode of this invetnion is adapted as a switching element owing to the N-shape negative resistance.","spans":[[106,113,"fig","4"],[118,119,"fig","5"]]},{"id":40,"sec":0,"col":3,"line":51,"text":"Especially, it is one of the advantages of this diode that it can operate in the stable condition at a comparatively small electric power.","spans":[]},{"id":41,"sec":0,"col":3,"line":55,"text":"FIG. 6 shows a connection diagram of an oscillator, by way of example, using a diode type semiconductor device according to this invention. That is, parallel to the diode 7 according to this invention is connected a series circuit composing of an inductance coil 8 and a capacitor 9. 10 is a direct current source.","spans":[[0,6,"fig","6"],[171,172,"ref","7"],[263,264,"ref","8"],[281,282,"ref","9"]]},{"id":42,"sec":0,"col":3,"line":61,"text":"FIG. 7 shows an equivalent circuit of the oscillation circuit shown in FIG. 6. The diode 7 according to this invention is illustrated by the circuit in the dotted line. That is, the diode may be considered as a parallel circuit composing of the negative resistance 11 and the capacitor 12 surrounded by the dotted line.","spans":[[0,6,"fig","7"],[71,77,"fig","6"],[89,90,"ref","7"],[265,267,"ref","11"],[286,288,"ref","12"]]},{"id":43,"sec":0,"col":3,"line":67,"text":"The diode type semiconductor device according to this invention is concluded to have the following advantages:","spans":[]},{"id":44,"sec":0,"col":3,"line":70,"text":"(1) The diode will operate at a very small electric power.","spans":[[1,2,"ref","1"]]},{"id":45,"sec":0,"col":3,"line":72,"text":"(2) The diode can be manufactured easily and cheaply.","spans":[[1,2,"ref","2"]]},{"id":46,"sec":0,"col":3,"line":73,"text":"(3) Oscillators using the diodes can easily oscillate at a comparatively higher frequency, for example as 20 mc./s.","spans":[[1,2,"ref","3"]]},{"id":47,"sec":0,"col":4,"line":1,"text":"(4) The diode does not depend upon the temperature in use as the minority carrier is not used.","spans":[[1,2,"ref","4"]]},{"id":48,"sec":0,"col":4,"line":3,"text":"While we have explained a particular embodiment of our invention, it will be understood, of course, that we do not wish to be limited thereto since many modifications may be made and we, therefore, contemplate by the appended claims to cover any such modifications as within the spirit and scope of our invention.","spans":[]},{"id":49,"sec":1,"col":null,"line":null,"page":4,"text":"UNITED STATES PATENT OFFICE","spans":[]},{"id":50,"sec":1,"col":null,"line":null,"page":4,"text":"Patent No. 3,033,714 May 8, 1962","spans":[[25,26,"ref","8"]]},{"id":51,"sec":1,"col":null,"line":null,"page":4,"text":"Reona Ezaki et al.","spans":[]},{"id":52,"sec":1,"col":null,"line":null,"page":4,"text":"It is hereby certified that error appears in the above numbered patent requiring correction and that the said Letters Patent should read as corrected below.","spans":[]},{"id":53,"sec":1,"col":null,"line":null,"page":4,"text":"Column 1, line 38, for \"doner\" read -- donor --; colum 3, line 27, after \"impurity\" insert -- of more --; line 48, for \"invetnion\" read -- invention --.","spans":[[55,56,"ref","3"]]},{"id":54,"sec":1,"col":null,"line":null,"page":4,"text":"Signed and sealed this 2nd day of October 1962.","spans":[]},{"id":55,"sec":1,"col":null,"line":null,"page":4,"text":"(SEAL) Attest:","spans":[]},{"id":56,"sec":1,"col":null,"line":null,"page":4,"text":"ERNEST W. SWIDER, Attesting Officer","spans":[]},{"id":57,"sec":1,"col":null,"line":null,"page":4,"text":"DAVID L. LADD, Commissioner of Patents","spans":[]}],"claims":[{"n":1,"col":4,"line":10,"depends":null,"text":"1. An electronic device including a highly doped p-n junction formed by adjacent portions of semi-conductor materials oppositely doped, one portion of which has an impurity concentration of 2×10^{18} to 10^{20} per cubic centimeter and the other oppositely doped portion of which has an impurity concentration in excess of 10^{19} per cubic centimeter and having a junction width of about 200 angstroms or less.","spans":[[203,205,"ref","10"]]},{"n":2,"col":4,"line":18,"depends":null,"text":"2. An electronic device comprising a p-n junction formed by adjacent semi-conductor portions oppositely doped to respective donor and acceptor type impurity concentrations in which one portion is doped in the range of 2×10^{18} to 10^{20} per cubic centimeter and the other portion is doped to an impurity concentration in excess of said one portion and having a junction width of about 200 angstroms or less.","spans":[[231,233,"ref","10"]]},{"n":3,"col":4,"line":26,"depends":null,"text":"3. An electronic device comprising a p-n junction formed by adjacent semi-conductor portions oppositely doped to respective donor and acceptor type impurity concentrations in which one portion is doped in the range of 10^{19} to 10^{20} per cubic centimeter and the other portion is doped to an impurity concentration at least as great as said one portion and having a junction width of about 200 angstroms or less.","spans":[[229,231,"ref","10"]]},{"n":4,"col":4,"line":34,"depends":null,"text":"4. An electronic device including a highly doped p-n junction formed of semi-conductor type material having one portion thereof of higher resistivity and lower impurity concentration than the remaining portion thereof, said one portion having a resistivity of about .01 ohm centimeter or less with an impurity concentration of 2×10^{18} to 10^{20} per cubic centimeter and having a transition region width of about 200 angstroms or less.","spans":[[340,342,"ref","10"]]},{"n":5,"col":4,"line":42,"depends":null,"text":"5. An alloyed p-n junction in semi-conductor material comprising a first body of semi-conductor material having an impurity concentration of about 2×10^{18} to 10^{20} per cubic centimeter and a second body of semi-conductor material having an impurity concentration in excess of 10^{19} per cubic centimeter with a resistivity lower than the resistivity of the first body and having a transition region width of about 200 angstroms or less.","spans":[[160,162,"ref","10"]]},{"n":6,"col":4,"line":50,"depends":null,"text":"6. An electronic device including a p-n junction having a transition region width of about 200 angstroms or less formed by adjacent semi-conductor portions oppositely doped and in which the semi-conductor portions on opposite sides of said p-n junction are doped to respective donor and acceptor type impurity concentrations in amounts of 2×10^{18} per cubic centimeter or greater.","spans":[]},{"n":7,"col":4,"line":58,"depends":null,"text":"7. An electronic device including a p-n junction having a transition region width of about 200 angstroms or less formed by adjacent semi-conductor portions oppositely doped and in which the side of the junction formed of the semi-conductor portion having the higher resistivity of the two sides has an impurity concentration in an amount in the range of 2×10^{18} to 10^{20} per cubic centimeter and the other side has a greater impurity concentration.","spans":[[367,369,"ref","10"]]}],"figures":[{"id":"1","label":"FIG. 1","sheet":1,"page":0,"front":false,"w":542,"h":506,"img":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAh4AAAH6AQAAAABghXjuAAAQ5UlEQVR42u2dT4gkWV7HP+/Vo1+AbVQogn0IpmJERLzYyoohDFMxMuAc5+ix1xUvIoSLhz60XS9rCqdAdProXnQWvHgTLx4c1pfVo90i7MzeF+ZVd4sDshDV2+xG9UTF8xCZVZWVGZERlbm945hxqarMyG/+/v9+7xe/90p4Vr7OJGu4NiAbkA3IBmQDsgHZgGxANiAbkBVATpVaHeTx2ZlorjmwU5H0BLEXhfL83cXqMikph4OYa8sku4Z2xNVVxtmFPOff0mW/VcaW977Y+5+9EjH3FkFPSgBOtlvojor+6x3Rxnw0QDst5oAf4jtteq+TV+3FruXmKhsA8vFPMp6UZgBIsKrZt9sUHO8MWFxHbd84QCa+xRx48mqj/enWjbabP+4N8nldjYPzEDsWBz1I8VcvNwkqpffeewP6/K1tv/Cq5PIQWy1z4hbB1ovNM+rNTgEI733hvfd+wpv33vt6pzc74YS+k97hZAE7wj/0z87pvHVdL064dW6e2nu1LJwskIn3D7333j/13vtq1/v3p6+XfoCKm6+Op38eXuTiAezY5QFxOUgwY3H+3DpOhoCYC3rKxvCWeLxsjUl3pl+eLEsCi0B8m6N8PMxOLr/dQ7Zysfct5CDoH098tTc1M+8fTR2xI5wsNLbqUt1lr50BzQVUcMk6fDQA5LJ1P2h+PO+MBO0GdB7YnnQFxlYQMWsy6tzgswEgzy8cpU4uybYakDKaQOKPvfe+3G0U+7ArnExV/B9CiNd3 ":"9","name":"capacitor","figs":["6","7"],"mentions":[[41,140,314]]},"10":{"ref":"10","name":"direct current source","figs":["6","7"],"mentions":[[2,0,226],[14,522,650],[29,0,157]]},"11":{"ref":"11","name":"negative resistance","figs":["7"],"mentions":[[35,245,353],[42,169,319]]},"12":{"ref":"12","name":"capacitor","figs":["7"],"mentions":[[42,169,319]]},"I":{"ref":"I","name":"curve","figs":["5"],"mentions":[]},"II":{"ref":"II","name":"curve","figs":["5"],"mentions":[]},"A":{"ref":"A","name":"","figs":["5"],"mentions":[]},"A'":{"ref":"A'","name":"","figs":["5"],"mentions":[]},"B":{"ref":"B","name":"","figs":["5"],"mentions":[]},"B'":{"ref":"B'","name":"","figs":["5"],"mentions":[]}},"notes":{"patent":"Filed 1958-05-08 (Japanese priority 1957-09-28) and issued 1962-05-08 to Leo Esaki, printed here as Reona Ezaki, and Yuriko Kurose, assigned to Sony Corporation. It covers the tunnel diode, also called the Esaki diode: a germanium p-n junction doped so heavily on both sides that the transition region is about 200 angstroms or less, so electrons tunnel through it (the patent's \"internal field emission\"). The result is a reverse direction that conducts better than the forward and, at the highest doping, an N-shaped forward characteristic with negative resistance between about 0.03 and 0.2 V (FIGS. 4-5). Esaki reported the effect in \"New Phenomenon in Narrow Germanium p-n Junctions\", Physical Review 109, 603 (1958), and shared the 1973 Nobel Prize in Physics with Ivar Giaever and Brian Josephson for discoveries on tunneling in solids. The claims define it by doping ranges and junction width, not by structure.","figs":{"1":"Section of the alloyed diode, not to scale. The hatched slab 1 is the heavily doped p-type wafer. The hatched cap 2 is the alloyed pellet, and the thin unhatched layer 3 under it, a shallow flat-bottomed band sunk into the wafer surface, is n-type germanium regrown from the melt; the junction is the lower boundary of 3. Layer 4 on the back of the wafer and leads 5 and 6 are the contacts to the p and n sides.","2":"Current I in mA against voltage V applied to the p side; positive V is the conventional forward direction, negative V the reverse. Forward current stays near zero up to about 0.3 V, while reverse current starts near -0.1 V and reaches -5 mA near -0.4 V, so the curve is close to point-symmetric about the origin.","3":"Same axes as FIG. 2 for a more heavily doped p side. Reverse current now rises at a smaller voltage than in FIG. 2 and reaches -5 mA near -0.3 V, while the forward knee is still near 0.25-0.3 V: the reverse direction is the better conductor.","4":"Same axes with the current scale doubled to 10 mA. The reverse current is steep, about -10 mA at -0.1 V. In the forward direction the current rises to a small hump, falls to a shallow minimum near 0.15-0.2 V and then rises again; FIG. 5 shows this region enlarged.","5":"The forward characteristic of the FIG. 4 diode on an expanded scale (mA against V up to 0.3 V). Solid curve I is at 25 deg C and dashed curve II at -75 deg C; the zigzag leaders from I and II end on the solid and dashed curves. A and A' mark the current peaks (about 1.0 and 1.5 mA, near 0.03 V), B and B' the valleys (near 0.16 and 0.19 V); between peak and valley the slope is negative. As drawn, the curves start on the current axis at about 0.4 mA rather than at the origin.","6":"Oscillator: diode 7, the series branch of coil 8 and capacitor 9, and DC source 10 are all connected across the same two rails. Capacitor 9 blocks DC, so source 10 biases only the diode, which has to sit in the negative-resistance range of FIG. 5 for the circuit to oscillate; coil 8 and capacitor 9 set the frequency.","7":"FIG. 6 with diode 7 replaced by its small-signal model, drawn inside the dotted box: negative resistance 11 in parallel with capacitor 12. With the coil and capacitor outside the box, the circuit is a parallel resonant loop whose losses are cancelled by the negative resistance. Series resistance and lead inductance of a real diode are not drawn."},"parts":{"2":"The text says indium containing phosphorus was used as this metal in an experiment; the phosphorus is the donor.","3":"\"recrystalized\" is the patent's spelling. It is the n side of the junction, with an impurity concentration supposed by the text to be 10^{19} cm^{-3} or more.","I":"Printed in the text as a bold \"1\" (\"the curve 1 in FIG. 5\"); in the drawing it is Roman I. Plotted at 25 deg C.","II":"Printed in the text as a bold \"11\"; in the drawing it is Roman II. Plotted at -75 deg C.","A":"Not named in the text; marks the current peak of curve I.","A'":"Not named in the text; marks the current peak of curve II.","B":"Not named in the text; marks the current minimum (valley) of curve I.","B'":"Not named in the text; marks the current minimum (valley) of curve II.","11":"The negative differential resistance of the diode between peak and valley in FIG. 5.","12":"In a real tunnel diode this is mainly the capacitance of the very thin junction; the text notes the diode has a comparatively large capacitance."},"glossary":[{"term":"tunnel diode (Esaki diode)","def":"A p-n junction with both sides degenerately doped, so thin that carriers cross it by quantum-mechanical tunneling rather than by diffusion over the barrier. Its forward current rises to a peak, falls to a valley and then rises again as in an ordinary diode."},{"term":"internal field emission","def":"The patent's term for tunneling of electrons through the junction's energy barrier under the strong built-in or applied field; the same process as Zener breakdown."},{"term":"negative resistance","def":"A region of a current-voltage curve where current falls as voltage rises (negative slope). Connected to a resonant circuit, it supplies energy and sustains oscillation."},{"term":"dynatron-type negative resistance","def":"Negative resistance that appears as an N-shaped current-voltage curve, stable under voltage bias, named after the dynatron tetrode-tube oscillator, which has such a curve."},{"term":"peak and valley","def":"The current maximum (here A, A') and the following minimum (B, B') that bound the negative-resistance region."},{"term":"backward diode","def":"A diode, like that of FIG. 3, that conducts better in the reverse direction than in the forward at small voltages."},{"term":"alloying technique","def":"Making a junction by melting a metal pellet containing the opposite dopant onto a semiconductor wafer; on cooling, a thin doped layer of the semiconductor regrows from the melt."},{"term":"impurity concentration","def":"Dopant atoms per cubic centimetre: donors on the n side, acceptors on the p side. Germanium has about 4.4 x 10^{22} atoms per cm^{3}, so 10^{19} cm^{-3} is roughly one dopant per few thousand atoms."},{"term":"transition region width","def":"Width of the depletion (space-charge) layer at the junction. The claims set it at about 200 angstroms (2 x 10^{-6} cm, 20 nm) or less."},{"term":"minority carrier storage time","def":"Delay in switching an ordinary diode off while injected minority carriers recombine or are swept out. A tunnel diode's current does not rely on minority carriers, so it has no such delay."},{"term":"Shockley's theory / rectification equation","def":"The ideal-diode law I = I_{s}(exp(qV/kT) - 1) for current carried by diffusion of injected minority carriers."},{"term":"relaxation oscillator","def":"An oscillator that switches abruptly between two states as a capacitor or inductor charges and discharges, rather than ringing sinusoidally."},{"term":"ma, mc./s.","def":"Milliampere; megacycles per second (MHz)."}]},"pages":["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAACRAAAA1QAQAAAAAiSpflAACcCUlEQVR42u39f5Ak6XnfiX3frERXrtjoyiVpskk3pnJBnAhH0GLzTnHXkAbTucs9Eee4sBBxf53jaDZonY4RdlhFhhw3YAym354dA6MwpB1dXMRRFzyhyfMf8n/kHR0HnkDs27NjYuSgyIYsR1A6kvv27Mho2RQ3e9DEZvVm5eM/Mut3VlVWZVZVZtbzRgDb012Vlfmp531+vc/7vILAY/owGAEjYkSMiBExIkbEiHgwIkbEiBgRI2JEjIgR8WBEjIgRM <script>
// Patent figure gallery + viewer. Data: window.PATENTS (pipeline/build.py). Traces: window.TraceRender.
// window.SITE: {links: {pn: file}} on the gallery page (light records), {home: file} on a per-patent page.
// Routes: #/  |  #/<pn>/figures/<fig>[/<ref>]  |  #/<pn>/text[/<pid>]  |  #/<pn>/claims  |  #/<pn>/about
(function () {
  const PATS = window.PATENTS, SITE = window.SITE || {}, byPn = Object.fromEntries(PATS.map(p => [p.pn, p]));
  const NS = 'http://www.w3.org/2000/svg';
  const $ = (s, r = document) => r.querySelector(s);
  const h = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
  const mk = (tag, a = {}) => { const n = document.createElementNS(NS, tag); for (const k in a) n.setAttribute(k, a[k]); return n; };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const subsup = s => esc(s).replace(/_\{([^}]*)\}/g, '<sub>$1</sub>').replace(/\^\{([^}]*)\}/g, '<sup>$1</sup>');
  const cite = (col, line) => col ? `${col}:${line || '?'}` : '';
  const citeOf = p => p.cite || (p.page != null && !p.col ? `p.${p.page + 1}` : cite(p.col, p.line));
  const docLabel = p => p.doc || `US ${p.number}`;
  const fmtDate = d => d || '';
  const figL = s => document.documentElement.dataset.type !== 'plate' ? String(s || '').replace(/\bFIG(S?)\./g, 'Fig$1.').replace(/\bFIGURE\b/g, 'Figure') : (s || '');
  PATS.forEach(p => p.figById = Object.fromEntries(p.figures.map(f => [f.id, f])));

  // ---------- theme ----------
  const themeBtn = $('#themeBtn');
  function curTheme() {
    const t = document.documentElement.dataset.theme;
    if (t) return t;
    return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  function setTheme(t) { document.documentElement.dataset.theme = t; themeBtn.innerHTML = t === 'dark' ? '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6L13 13M3 13l1.4-1.4M11.6 4.4L13 3"/></svg>' : '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7z"/></svg>'; try { localStorage.setItem('cray-theme', t); } catch (e) { } }
  let saved = null; try { saved = localStorage.getItem('cray-theme'); } catch (e) { }
  setTheme((/[?&]theme=(light|dark)/.exec(location.search) || [])[1] || saved || 'dark'); // ?theme= for headless review
  themeBtn.onclick = () => setTheme(curTheme() === 'dark' ? 'light' : 'dark');

  // ---------- type style (html[data-type], set before paint in template.html) ----------
  const typeBtns = [...document.querySelectorAll('#typeSw button')];
  const markType = () => typeBtns.forEach(b => b.classList.toggle('on', b.dataset.t === document.documentElement.dataset.type));
  typeBtns.forEach(b => b.onclick = () => {
    document.documentElement.dataset.type = b.dataset.t; markType();
    try { localStorage.setItem('ipatent-type', b.dataset.t); } catch (e) { }
    if (view && view.cleanup) view.cleanup();
    view = null; main.innerHTML = ''; route(); // figure labels change case between styles
  });
  markType();

  // ---------- tooltip ----------
