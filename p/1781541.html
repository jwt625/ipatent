<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Patents</title>
<script>
// Type style before first paint: ?type=, else the saved choice, else the default (DevLog-005).
(function () {
  var ok = ['plate', 'copperplate', 'specification'], q = (/[?&]type=(\w+)/.exec(location.search) || [])[1], s = null;
  try { s = localStorage.getItem('ipatent-type'); } catch (e) { }
  document.documentElement.dataset.type = ok.indexOf(q) >= 0 ? q : ok.indexOf(s) >= 0 ? s : 'copperplate';
})();
</script>
<style>
/* Fonts (OFL, fonts/OFL-*.txt). ../fonts/ is the fonts folder relative to the page, set by pipeline/build.py.
   Browsers download only the faces a page uses. */
@font-face { font-family: "Playfair Display"; src: url("../fonts/PlayfairDisplay.woff2") format("woff2"); font-weight: 400 900; font-style: normal; font-display: swap; }
@font-face { font-family: "Playfair Display"; src: url("../fonts/PlayfairDisplay-Italic.woff2") format("woff2"); font-weight: 400 900; font-style: italic; font-display: swap; }
@font-face { font-family: "Source Serif 4"; src: url("../fonts/SourceSerif4.woff2") format("woff2"); font-weight: 400 600; font-style: normal; font-display: swap; size-adjust: 96%; }
@font-face { font-family: "Source Serif 4"; src: url("../fonts/SourceSerif4-Italic.woff2") format("woff2"); font-weight: 400 600; font-style: italic; font-display: swap; size-adjust: 96%; }
@font-face { font-family: "Pinyon Script"; src: url("../fonts/PinyonScript.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "IM Fell English"; src: url("../fonts/IMFellEnglish.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "IM Fell English"; src: url("../fonts/IMFellEnglish-Italic.woff2") format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
@font-face { font-family: "Mrs Saint Delafield"; src: url("../fonts/MrsSaintDelafield.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "Old Standard TT"; src: url("../fonts/OldStandardTT.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "Old Standard TT"; src: url("../fonts/OldStandardTT-Italic.woff2") format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
@font-face { font-family: "Old Standard TT"; src: url("../fonts/OldStandardTT-Bold.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }

/* Type styles, html[data-type] (set before paint in template.html):
   plate          Playfair Display heads, Source Serif 4 text; figure labels as printed (FIG. 1)
   copperplate    Pinyon Script brand, group names and figure labels (Fig. 1), IM Fell English titles and heads, Source Serif 4 text
   specification  Mrs Saint Delafield brand and group names, Old Standard TT for the rest, italic figure labels */
:root, :root[data-type="plate"] {
  --f-text: "Source Serif 4", Georgia, serif; --f-num: "Source Serif 4", Georgia, serif; --fs-text: 14px; --fs-read: 15px;
  --f-disp: "Playfair Display", Georgia, serif; --disp-style: italic; --dk: 1;
  --f-title: "Playfair Display", Georgia, serif; --title-ls: .02em; --tk: 1;
  --f-script: "Playfair Display", Georgia, serif; --script-style: italic; --sk: 1; --script-pt: 0px;
  --f-fig: "Playfair Display", Georgia, serif; --fig-style: italic; --fk: 1;
}
:root[data-type="copperplate"] {
  --f-text: "Source Serif 4", Georgia, serif; --f-num: "Source Serif 4", Georgia, serif; --fs-text: 14px; --fs-read: 15px;
  --f-disp: "IM Fell English", Georgia, serif; --disp-style: italic; --dk: 1.08;
  --f-title: "IM Fell English", Georgia, serif; --title-ls: .035em; --tk: 1.06;
  --f-script: "Pinyon Script", "IM Fell English", Georgia, cursive; --script-style: normal; --sk: 1.38; --script-pt: 4px;
  --f-fig: "Pinyon Script", "IM Fell English", Georgia, cursive; --fig-style: normal; --fk: 1.38;
}
:root[data-type="specification"] {
  --f-text: "Old Standard TT", Georgia, serif; --f-num: "Old Standard TT", Georgia, serif; --fs-text: 14.5px; --fs-read: 16px;
  --f-disp: "Old Standard TT", Georgia, serif; --disp-style: italic; --dk: 1.05;
  --f-title: "Old Standard TT", Georgia, serif; --title-ls: .06em; --tk: .94;
  --f-script: "Mrs Saint Delafield", "Old Standard TT", Georgia, cursive; --script-style: normal; --sk: 1.6; --script-pt: 6px;
  --f-fig: "Old Standard TT", Georgia, serif; --fig-style: italic; --fk: 1;
}
:root[data-type="specification"] body { font-synthesis: small-caps; } /* Old Standard TT has no small-caps glyphs */

/* Palette: warm neutrals of the Plate style (dark #0d0d0d / ink #f2f1ec), light theme on #f1f0ec paper.
   Type roles (set per style below): --f-text body and UI, --f-disp display heads, --f-title patent titles (printed in caps),
   --f-script brand, group names and figure labels, --f-num numerals and citations. */
:root {
  --surface-0: #f1f0ec; --surface-1: #fcfcfb; --surface-2: #e9e8e2; --border: rgba(11, 11, 11, .14); --grid: #e1e0d9;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #6f6d68; --rule: #5f5e59;
  --series-1: #2a78d6; --series-2: #b85f08; --context: #b9b7ae; --amber: #b85f08;
  --ink: #2b2b29; --hi: #2a78d6; --hi-fill: rgba(42, 120, 214, .14); --mark: rgba(237, 161, 0, .30);
  --amber-fill: rgba(184, 95, 8, .10); --amber-tag: rgba(184, 95, 8, .16);
  --scan-filter: none;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface-0: #0d0d0d; --surface-1: #1a1a19; --surface-2: #232321; --border: rgba(255, 255, 255, .12); --grid: #2c2c2a;
    --text-primary: #f2f1ec; --text-secondary: #c3c2b7; --text-muted: #a8a69d; --rule: #a8a69d;
    --series-1: #4c9bf0; --series-2: #f7962c; --context: #6b6a63; --amber: #f7962c;
    --ink: #d6d5cc; --hi: #4c9bf0; --hi-fill: rgba(76, 155, 240, .20); --mark: rgba(201, 133, 0, .42);
    --amber-fill: rgba(247, 150, 44, .08); --amber-tag: rgba(247, 150, 44, .18);
    --scan-filter: invert(1) brightness(.86);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --surface-0: #0d0d0d; --surface-1: #1a1a19; --surface-2: #232321; --border: rgba(255, 255, 255, .12); --grid: #2c2c2a;
  --text-primary: #f2f1ec; --text-secondary: #c3c2b7; --text-muted: #a8a69d; --rule: #a8a69d;
  --series-1: #4c9bf0; --series-2: #f7962c; --context: #6b6a63; --amber: #f7962c;
  --ink: #d6d5cc; --hi: #4c9bf0; --hi-fill: rgba(76, 155, 240, .20); --mark: rgba(201, 133, 0, .42);
  --amber-fill: rgba(247, 150, 44, .08); --amber-tag: rgba(247, 150, 44, .18);
  --scan-filter: invert(1) brightness(.86);
  color-scheme: dark;
}
* { box-sizing: border-box; }
button, input, select { border-radius: 0; }
html, body { margin: 0; height: 100%; background: var(--surface-0); color: var(--text-primary);
  font: var(--fs-text, 14px)/1.45 var(--f-text); font-optical-sizing: auto; font-synthesis: none; }
body { overflow: hidden; }
::selection { background: var(--hi-fill); }
a { color: var(--series-1); text-decoration: none; }
button, input, select { font: inherit; color: var(--text-primary); }
button { background: transparent; border: 1px solid var(--border); padding: 2px 9px; cursor: pointer; white-space: nowrap; }
button:hover { background: var(--surface-2); }
button.on { background: var(--hi-fill); border-color: var(--hi); color: var(--text-primary); }
button:disabled { opacity: .4; cursor: default; }
input::placeholder { color: var(--text-muted); font-style: italic; }
.mono, .num { font-family: var(--f-num); font-variant-numeric: lining-nums tabular-nums; }
.lbl { font-family: var(--f-text); font-size: 13px; font-weight: 600; font-variant-caps: all-small-caps; letter-spacing: .07em; color: var(--text-muted); }
.spacer { flex: 1; }
.grp { display: inline-flex; }
.grp button + button { border-left: 0; }
/* scotch rule over major heads: 2px over 1px, neutral */
.ghead, .about h3, .tsec { position: relative; border-top: 2px solid var(--rule); }
.ghead::before, .about h3::before, .tsec::before { content: ''; position: absolute; left: 0; right: 0; top: 2px; border-top: 1px solid var(--rule); }
.tsec, .tsec::before { border-top-color: var(--context); }

#app { display: grid; grid-template-rows: 44px minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); height: 100vh; }
#bar { display: flex; align-items: center; gap: 14px; padding: 0 12px; background: var(--surface-0); border-bottom: 1px solid var(--border); min-width: 0; }
#home { color: var(--text-primary); white-space: nowrap; flex-shrink: 0; font: var(--script-style, normal) 400 calc(21px * var(--sk, 1))/1 var(--f-script); letter-spacing: var(--script-ls, 0); padding-top: var(--script-pt, 0); }
#crumb { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); }
#crumb .num { color: var(--text-primary); margin-right: 10px; }
#crumb .tt { font-family: var(--f-title); letter-spacing: var(--title-ls, .02em); font-size: calc(14px * var(--tk, 1)); }
#tabs { display: flex; height: 100%; padding: 7px 0; gap: 2px; }
#tabs a { display: flex; align-items: center; padding: 0 11px; color: var(--text-secondary); font: var(--disp-style, italic) 400 16px var(--f-disp); }
#tabs a:hover { color: var(--text-primary); background: var(--surface-2); }
#tabs a.on { color: var(--text-primary); background: var(--hi-fill); }
#themeBtn { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 28px; padding: 0; border-color: transparent; color: var(--text-secondary); }
#themeBtn:hover { color: var(--text-primary); border-color: var(--border); }
#themeBtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; }
#typeSw button { width: 30px; height: 28px; padding: 0; border-color: transparent; color: var(--text-secondary); font-size: 17px; line-height: 1; }
#typeSw button:hover { color: var(--text-primary); border-color: var(--border); }
#typeSw button.on { color: var(--text-primary); background: var(--hi-fill); border-color: transparent; }
#typeSw [data-t="plate"] { font: italic 400 17px "Playfair Display", Georgia, serif; }
#typeSw [data-t="copperplate"] { font: 400 22px "Pinyon Script", Georgia, cursive; }
#typeSw [data-t="specification"] { font: 400 24px "Mrs Saint Delafield", Georgia, cursive; }
#main { min-height: 0; overflow: hidden; }
#foot { display: flex; align-items: center; gap: 6px; height: 20px; padding: 0 10px; font-size: 11px; color: var(--text-muted); background: var(--surface-0); border-top: 1px solid var(--border); white-space: nowrap; overflow: hidden; }
#foot .sep { color: var(--context); }

/* gallery */
.gallery { height: 100%; overflow-y: auto; padding: 0 24px 24px; }
.gbar { position: sticky; top: 0; z-index: 3; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; max-width: 1240px; margin: 0 auto; padding: 12px 0 8px; background: var(--surface-0); }
.gbar input { flex: 0 1 420px; min-width: 0; height: 30px; padding: 3px 8px; background: var(--surface-1); border: 1px solid var(--border); }
.gbar select { height: 30px; background: var(--surface-1); border: 1px solid var(--border); padding: 2px 4px; }
.gbar button { height: 30px; }
.gfacets { display: grid; gap: 6px; max-width: 1240px; margin: 0 auto 8px; }
.frow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.frow > .lbl { width: 72px; flex: none; }
.fchip { padding: 1px 8px; font-size: 13px; color: var(--text-secondary); background: var(--surface-1); border-color: transparent; }
.fchip:hover { color: var(--text-primary); }
.fchip .num { color: var(--text-muted); margin-left: 5px; font-size: 12px; }
.fchip.on { background: var(--hi-fill); border-color: transparent; color: var(--hi); }
.fchip.on .num { color: var(--hi); }
.gnone { max-width: 1240px; margin: 24px auto; }
.unk { color: var(--context); }
.gtable .st { white-space: nowrap; }
.pl { color: var(--text-muted); }
/* booktabs: heavy top rule, rule under the head, thin grid rules, no verticals */
.gtable { max-width: 1240px; margin: 16px auto 0; overflow-x: auto; border-top: 2px solid var(--rule); border-bottom: 1px solid var(--rule); }
.gtable table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.gtable th { position: sticky; top: 0; background: var(--surface-0); text-align: left; font-size: 13px; font-weight: 600; font-variant-caps: all-small-caps; letter-spacing: .07em; color: var(--text-muted); padding: 6px 8px; box-shadow: inset 0 -1px 0 var(--rule); cursor: pointer; white-space: nowrap; user-select: none; }
.gtable th.on { color: var(--text-primary); }
.gtable .rz { position: absolute; top: 0; right: 0; bottom: 0; width: 7px; cursor: col-resize; touch-action: none; }
.gtable .rz:hover, .gtable .rz:active { border-right: 2px solid var(--hi); }
.gtable table.sized { table-layout: fixed; }
.gtable table.sized th, .gtable table.sized td { box-sizing: border-box; overflow: hidden; text-overflow: ellipsis; }
.gtable th.r, .gtable td.r { text-align: right; font-family: var(--f-num); font-variant-numeric: lining-nums tabular-nums; }
.gtable td { padding: 4px 8px; border-bottom: 1px solid var(--grid); color: var(--text-secondary); vertical-align: top; }
.gtable td.tt { color: var(--text-primary); min-width: 220px; font-family: var(--f-title); letter-spacing: var(--title-ls, .02em); font-size: calc(13px * var(--tk, 1)); }
.gtable td.num { white-space: nowrap; }
.gtable tbody tr { cursor: pointer; }
.gtable tbody tr:hover td { background: var(--hi-fill); }
#tip .tthumb { display: block; width: 220px; filter: var(--scan-filter); margin-bottom: 4px; }
#tip .tmeta { margin-bottom: 2px; }
#tip .pl { margin-left: 4px; }
.ghead { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 14px; margin-bottom: -6px; padding-top: 12px; color: var(--text-primary);
  font: var(--script-style, normal) 400 calc(30px * var(--sk, 1))/1.15 var(--f-script); letter-spacing: var(--script-ls, 0); }
.ghead .gcnt { margin-left: auto; font: 600 13px var(--f-text); font-style: normal; font-variant-caps: all-small-caps; letter-spacing: .07em; color: var(--text-muted); }
.cards + .cards { margin-top: 40px; }
.gout { padding-bottom: 24px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 520px)); justify-content: center; gap: 24px; max-width: 1240px; margin: 0 auto; }
.card { display: grid; grid-template-rows: 360px auto; background: var(--surface-1); border: 1px solid var(--border); cursor: pointer; color: inherit; }
.card:hover { border-color: var(--text-muted); }
.card .thumb { overflow: hidden; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: center; padding: 12px; background: var(--surface-0); }
.card .thumb svg, .card .thumb img { width: 100%; height: 100%; }
.card .meta { padding: 12px 14px 14px; display: grid; gap: 5px; }
.card .meta > .row:first-child { color: var(--text-muted); font-size: 13px; }
.card .t { font: 400 calc(18px * var(--tk, 1))/1.25 var(--f-title); letter-spacing: var(--title-ls, .02em); }
.card .row { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--text-secondary); font-size: 14px; }
.card .t + .row { font-style: italic; color: var(--text-primary); }
.card .counts { color: var(--text-muted); font-size: 13px; font-family: var(--f-num); font-variant-numeric: lining-nums; }

/* figures tab */
.figs { display: grid; grid-template-columns: 200px minmax(0, 1fr) 360px; height: 100%; }
.flist { overflow-y: auto; border-right: 1px solid var(--border); background: var(--surface-1); }
.fitem { display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: center; padding: 6px 10px; cursor: pointer; border-bottom: 1px solid var(--grid); }
.fitem:hover { background: var(--surface-2); }
.fitem.on { background: var(--hi-fill); }
.fitem img { width: 56px; height: 56px; object-fit: contain; background: #fff; filter: var(--scan-filter); }
.fitem .fl { font: var(--fig-style, normal) 400 calc(17px * var(--fk, 1))/1.1 var(--f-fig); }
.fitem .fs { font-size: 12px; font-style: italic; color: var(--text-muted); }
.center { display: grid; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 6px 10px; border-bottom: 1px solid var(--border); background: var(--surface-1); }
.tools .lbl { margin-right: -6px; }
.tools input[type=range] { width: 160px; accent-color: var(--hi); }
.stepv { min-width: 9ch; color: var(--text-secondary); }
.plotp { position: absolute; top: 8px; right: 8px; z-index: 5; width: min(340px, calc(100% - 16px)); max-height: calc(100% - 16px); overflow: auto;
  display: grid; gap: 7px; padding: 9px 10px 10px; background: var(--surface-1); border: 1px solid var(--rule); }
.plotp[hidden] { display: none; }
.plotp .prw { display: flex; align-items: center; gap: 6px; }
.plotp .prw > .lbl { width: 76px; flex: none; }
.plotp .prw > .lbl + .lbl, .plotp .u + .lbl { width: auto; margin-left: 10px; }
.plotp select, .plotp input { height: 26px; padding: 1px 4px; background: var(--surface-0); border: 1px solid var(--border); min-width: 0; }
.plotp input { width: 62px; }
.plotp .u { color: var(--text-muted); font-size: 13px; }
.plotp .ppv { display: flex; justify-content: center; align-items: center; height: 300px; background: var(--surface-2); }
.plotp .ppv img { max-width: 100%; max-height: 100%; background: #fff; box-shadow: 0 0 0 1px var(--border); }
.plotp .pst { font-size: 12px; color: var(--text-secondary); }
.side { border-left: 1px solid var(--border); background: var(--surface-1); display: grid; grid-template-rows: minmax(0, 1.3fr) minmax(0, 1fr); min-height: 0; }
.info { overflow-y: auto; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.info h2 { margin: 0 0 10px; font: 500 20px/1.2 var(--f-disp); display: flex; align-items: baseline; gap: 10px; }
.info h2 .num { color: var(--hi); font-family: var(--f-num); }
.info h2.fh { font: var(--fig-style, normal) 400 calc(26px * var(--fk, 1))/1.1 var(--f-fig); }
.info .alt { color: var(--text-muted); font-size: 13px; font-style: italic; margin: -6px 0 8px; }
.quote { margin: 0 0 12px; color: var(--text-primary); font-style: italic; }
.cite { font-family: var(--f-num); font-variant-numeric: lining-nums tabular-nums; font-style: normal; font-size: 12px; color: var(--text-muted); cursor: pointer; white-space: nowrap; }
.cite:hover { color: var(--hi); }
.note { margin: 0 0 12px; padding: 7px 10px 8px; background: var(--amber-fill); color: var(--text-secondary); font-size: 14px; }
.note .lbl { display: inline-block; margin: 0 6px 2px 0; padding: 0 6px 1px; color: var(--amber); background: var(--amber-tag); }
.sub { margin: 14px 0 4px; }
.mlist { display: grid; gap: 6px; }
.mitem { font-size: 14px; cursor: pointer; padding: 2px 0; }
.mitem:hover { color: var(--hi); }
.mitem b { color: var(--hi); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
.chip { padding: 0 7px; font-size: 13px; cursor: pointer; background: var(--surface-2); color: var(--text-secondary); }
.chip:hover, .chip.on { background: var(--hi-fill); color: var(--hi); }
.plist { overflow-y: auto; }
.plist .head { position: sticky; top: 0; background: var(--surface-1); padding: 6px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.prow { display: grid; grid-template-columns: 48px 1fr; gap: 10px; padding: 3px 14px; cursor: pointer; font-size: 14px; }
.prow:hover { background: var(--surface-2); }
.prow.on { background: var(--hi-fill); }
.prow .num { color: var(--text-muted); text-align: right; }
.prow.on .num { color: var(--hi); }

/* figure view */
.fv { position: relative; overflow: hidden; min-height: 0; background: var(--surface-0); touch-action: none; }
.fv svg.stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
.fv.panning svg.stage { cursor: grabbing; }
.fv .scan { filter: var(--scan-filter); }
.fv .tr-s { stroke: var(--ink); fill: none; stroke-linecap: round; stroke-linejoin: round; }
.fv .tr-fill-solid { fill: var(--ink); }
.fv .tr-fill-light { fill: var(--ink); fill-opacity: .08; }
.fv .tr-arrow { fill: var(--ink); }
.fv .tr-hatchline { stroke: var(--ink); stroke-width: 2; }
.fv .tr-fill-paper { fill: var(--surface-0); }
.fv .tr-ink-paper.tr-s, .fv .tr-el.on .tr-ink-paper.tr-s { stroke: var(--surface-0); }
.fv .tr-t.tr-ink-paper, .fv .tr-el.on .tr-t.tr-ink-paper { fill: var(--surface-0); }
.fv .tr-t { fill: var(--ink); font-family: Helvetica, Arial, ui-sans-serif, sans-serif; }
.fv .tr-it { font-style: italic; }
.fv .tr-b { font-weight: 700; }
.fv .tr-k-label .tr-t { fill: var(--text-secondary); }
.fv .tr-el { transition: opacity .12s; }
.fv.m-trace .scan { display: none; }
.fv.m-scan .tr-el { opacity: 0; }
.fv.m-overlay .scan { opacity: .55; }
.fv.m-overlay .tr-s, .fv.m-overlay .tr-arrow { stroke: var(--hi); }
.fv.m-overlay .tr-t, .fv.m-overlay .tr-fill-solid, .fv.m-overlay .tr-arrow { fill: var(--hi); }
.fv.sel .tr-el { opacity: .3; }
.fv.m-scan.sel .tr-el { opacity: 0; }
.fv .tr-el.on { opacity: 1 !important; }
.fv .tr-el.on .tr-s { stroke: var(--hi); }
.fv .tr-el.on .tr-t, .fv .tr-el.on .tr-fill-solid, .fv .tr-el.on .tr-arrow { fill: var(--hi); }
.fv .tr-el.on.tr-k-block .tr-s:not(polyline):not(.tr-fill-solid) { fill: var(--hi-fill); }
.fv .tr-el.fut { opacity: .08; }
.fv .tr-el.now .tr-s { stroke: var(--series-2); }
.fv .tr-el.now .tr-t, .fv .tr-el.now .tr-fill-solid { fill: var(--series-2); }
.fv .hit * { fill: transparent; stroke: transparent; }
.fv .hit [data-ref] { cursor: pointer; }
.fv .fvTag { position: absolute; left: 10px; top: 6px; color: var(--text-muted); font: var(--fig-style, normal) 400 calc(16px * var(--fk, 1)) var(--f-fig); pointer-events: none; }
.fv .fvZoom { position: absolute; right: 8px; bottom: 6px; color: var(--text-muted); font: 12px var(--f-num); pointer-events: none; }
.fv .fvFull { position: absolute; right: 8px; top: 6px; }

/* text + claims tab */
.textv { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 44%); height: 100%; }
.tcol { overflow-y: auto; border-right: 1px solid var(--border); }
.tbar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 6px 16px; background: var(--surface-1); border-bottom: 1px solid var(--border); }
.tbar input { width: 260px; padding: 3px 8px; background: var(--surface-0); border: 1px solid var(--border); }
.tbar select { background: var(--surface-0); border: 1px solid var(--border); padding: 2px 4px; max-width: 280px; }
.tbody { max-width: 820px; padding: 8px 16px 64px; font-size: var(--fs-read, 15px); line-height: 1.55; }
.tsec { margin: 30px 0 12px 58px; padding-top: 10px; font: var(--disp-style, italic) 400 calc(19px * var(--dk, 1))/1.2 var(--f-disp); letter-spacing: .01em; color: var(--text-primary); }
.para { display: grid; grid-template-columns: 48px 1fr; gap: 10px; margin: 0 0 10px; }
.para .cite { text-align: right; padding-top: 4px; }
.para.flash { background: var(--mark); }
.para p { margin: 0; }
.para table { border-collapse: collapse; font-size: 13px; border-top: 2px solid var(--rule); border-bottom: 1px solid var(--rule); }
.para td { border-bottom: 1px solid var(--grid); padding: 2px 8px; font-family: var(--f-num); font-variant-numeric: lining-nums tabular-nums; }
a.rf { color: var(--hi); font-family: var(--f-num); font-variant-numeric: lining-nums; font-weight: 600; }
a.rf:hover { background: var(--hi-fill); }
a.rf.on { background: var(--hi-fill); }
a.fg { color: var(--series-1); font-style: italic; }
a.fg:hover { background: var(--hi-fill); }
mark { background: var(--mark); color: inherit; }
.claim { margin: 0 0 14px; }
.claim.dep { margin-left: 24px; }
.claim > .lbl .num { margin-right: 4px; font-size: 15px; color: var(--text-primary); font-variant-caps: normal; }
.claim p { margin: 0; white-space: pre-line; }
.pane { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
.pane .tools { gap: 8px; }
.pane .fv { height: 100%; }

/* about */
.about { height: 100%; overflow-y: auto; padding: 16px 24px 64px; }
.about .wrap { max-width: 900px; }
.about h3 { margin: 30px 0 10px; padding-top: 10px; font: var(--disp-style, italic) 400 calc(21px * var(--dk, 1))/1.2 var(--f-disp); color: var(--text-primary); }
.about table { border-collapse: collapse; width: 100%; font-size: 14px; border-bottom: 1px solid var(--rule); }
.about td, .about th { text-align: left; padding: 3px 10px 3px 0; border-bottom: 1px solid var(--grid); vertical-align: top; }
.about th { font-weight: 600; color: var(--text-muted); width: 150px; font-size: 13px; font-variant-caps: all-small-caps; letter-spacing: .07em; }
.about dl { display: grid; grid-template-columns: 180px 1fr; gap: 6px 14px; margin: 0; font-size: 14px; }
.about dt { font-weight: 600; }
.about dd { margin: 0; color: var(--text-secondary); }
.sources { color: var(--text-muted); font-size: 13px; font-style: italic; margin-top: 24px; }

#tip { position: fixed; pointer-events: none; z-index: 30; display: none; max-width: 340px; padding: 5px 8px;
  background: var(--surface-1); border: 1px solid var(--rule); font-size: 13px; }
#tip .num { color: var(--hi); margin-right: 6px; }
#modal { position: fixed; inset: 24px; z-index: 40; background: var(--surface-1); border: 1px solid var(--rule); display: grid; grid-template-rows: 38px 1fr; }
#modal[hidden] { display: none; }
#modalBar { display: flex; align-items: center; gap: 10px; padding: 0 10px; border-bottom: 1px solid var(--border); }
#modalBody { position: relative; min-height: 0; }
#modalBody .fv { position: absolute; inset: 0; }
.fv .colmark { fill: var(--mark); stroke: none; }

@media (max-width: 1000px) {
  .figs { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) minmax(0, 40vh); }
  .fitem .fl { white-space: nowrap; }
  #bar { overflow-x: auto; }
  #tabs, #themeBtn { flex-shrink: 0; }
  #crumb { flex-shrink: 1; }
  .flist { display: flex; overflow-x: auto; overflow-y: hidden; border-right: 0; border-bottom: 1px solid var(--border); }
  .fitem { grid-template-columns: 40px auto; border-bottom: 0; border-right: 1px solid var(--grid); }
  .fitem img { width: 40px; height: 40px; }
  .side { border-left: 0; border-top: 1px solid var(--border); grid-template-rows: auto; overflow-y: auto; }
  .info { overflow: visible; }
  .plist { overflow: visible; }
  .textv { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 36vh; }
  .para { grid-template-columns: 40px minmax(0, 1fr); gap: 6px; }
  .tsec { margin-left: 46px; }
  .tbody { padding: 8px 10px 48px; }
  .tcol { border-right: 0; border-bottom: 1px solid var(--border); }
  .tbar input { width: auto; flex: 1 1 0; min-width: 0; }
  .tbar select { flex: 1 1 0; min-width: 0; }
  .tbar { padding: 6px 10px; gap: 6px; }
  #bar { gap: 8px; padding: 0 8px; }
  #home { font-size: calc(15px * var(--sk, 1)); }
  #typeSw button { width: 26px; }
  #crumb .tt { display: none; }
  #tabs a { padding: 0 7px; font-size: 15px; }
  .cards { grid-template-columns: minmax(0, 1fr); }
  .card { grid-template-rows: 280px auto; }
  .gallery { padding: 0 16px 16px; }
  .gbar input { flex: 1 1 100%; }
  .frow > .lbl { width: 100%; }
  .ghead { font-size: calc(24px * var(--sk, 1)); }
}

window.PATENTS = [{"pn":"1781541","number":"1,781,541","doc":null,"date_label":null,"cite_scheme":"printed page:line","scan_source":null,"title":"REFRIGERATION","inventors":["Albert Einstein","Leo Szilard"],"assignee":"Electrolux Servel Corporation, of New York, N. Y., a corporation of Delaware","filed":"1927-12-16","issued":"1930-11-11","appl_no":"240,566","int_cl":null,"us_cl":null,"refs_patents":[],"refs_other":[],"examiners":null,"claims_count":5,"drawing_figures":1,"abstract":"","google":"https://patents.google.com/patent/US1781541A/en","col1_page":1,"group":"Forum favorites","page_wh":[[2320,3408],[2320,3408],[2320,3408],[2320,3408]],"entities":{"pn":"1781541","inventors":[{"name":"Albert Einstein","printed":"ALBERT EINSTEIN, OF BERLIN","city":"Berlin","region":null,"country":"DE"},{"name":"Leo Szilard","printed":"LEO SZILARD, OF BERLIN-WILMERSDORF, GERMANY","city":"Berlin-Wilmersdorf","region":null,"country":"DE"}],"assignees":[{"name":"Electrolux Servel Corporation","printed":"ELECTROLUX SERVEL CORPORATION, OF NEW YORK, N. Y., A CORPORATION OF DELAWARE","org":"Electrolux Servel","kind":"company","city":"New York","region":"NY","country":"US"}],"source":{"page":1,"where":"header of the first printed page (inventors, assignors to)"}},"status":{"state":"Expired","term_end":"1947-11-11","basis":"17 years from grant","google_expiration":"1947-11-11","checked":"2026-11-18"},"sections":[{"heading":"","first":0}],"paras":[{"id":0,"sec":0,"col":null,"line":null,"page":1,"cite":"p.1:1","text":"Our invention relates to the art of refrigeration and particularly to an apparatus and method for producing refrigeration wherein the refrigerant evaporates in the presence of an inert gas and more particularly to the type disclosed in Patent No. 1,685,764 granted September 25th, 1928, to Von Platen and Munters and our British Patent No. 282,428.","spans":[]},{"id":1,"sec":0,"col":null,"line":null,"page":1,"cite":"p.1:9","text":"The objects and advantages of our invention will be apparent from the following description considered in connection with the accompanying drawing which shows, more or less diagrammatically, a preferred embodiment of our invention.","spans":[]},{"id":2,"sec":0,"col":null,"line":null,"page":1,"cite":"p.1:15","text":"Referring to the drawing, reference character 1 designates an evaporator, which is ordinarily placed within a chamber to be cooled. A conduit 5 connects the upper part of evaporator 1 with the more intermediate portion of the condenser 6. A conduit 11 communicates with the bottom of evaporator 1 and extends within condenser 6 at a level below the point of communication of conduit 5 with the condenser. A cooling water jacket 12 surrounds the condenser and is adapted for the passage therethrough of water for the purpose of cooling the condenser.","spans":[[46,47,"ref","1"],[142,143,"ref","5"],[182,183,"ref","1"],[236,237,"ref","6"],[249,251,"ref","11"],[295,296,"ref","1"],[326,327,"ref","6"],[383,384,"ref","5"],[428,430,"ref","12"]]},{"id":3,"sec":0,"col":null,"line":null,"page":1,"cite":"p.1:28","text":"A conduit 27 communicates with the bottom of condenser 6 and with the lower part of a heat exchanger jacket 28. The upper part of jacket 28 is connected to the lower part of generator 29. Generator 29 is heated in any suitable manner. A conduit 30 communicates with the upper part of generator 29 and extends within evaporator 1 to a point near the bottom thereof where it terminates in a distributor head 31. Conduit 30 extends within conduit 5 in order that the fluids passing through the respective conduits may be brought into heat exchange relationship with each other.","spans":[[10,12,"ref","27"],[55,56,"ref","6"],[108,110,"ref","28"],[137,139,"ref","28"],[184,186,"ref","29"],[198,200,"ref","29"],[245,247,"ref","30"],[294,296,"ref","29"],[327,328,"ref","1"],[406,408,"ref","31"],[418,420,"ref","30"],[444,445,"ref","5"]]},{"id":4,"sec":0,"col":null,"line":null,"page":1,"cite":"p.1:42","text":"A conduit 32 extends upwardly from within the lower part of generator 29 and communicates with a container 33 placed at a level above that of condenser 6. A source of heat 36 is provided for heating conduit 32 at a point above generator 29. A conduit 37 extends downwardly from container 33 and passes within heat exchanger jacket 28 and thence upwardly to within the upper part of condenser 6 where it terminates in a distributor head 35. Conduit 37 passes within cooling water jacket 12 in order that fluid passing through this conduit may be cooled. A vent conduit 34 connects the upper part of container 33 with the upper part of condenser 6.","spans":[[10,12,"ref","32"],[70,72,"ref","29"],[107,109,"ref","33"],[152,153,"ref","6"],[172,174,"ref","36"],[207,209,"ref","32"],[237,239,"ref","29"],[251,253,"ref","37"],[288,290,"ref","33"],[331,333,"ref","28"],[392,393,"ref","6"],[436,438,"ref","35"],[448,450,"ref","37"],[486,488,"ref","12"],[568,570,"ref","34"],[608,610,"ref","33"],[644,645,"ref","6"]]},{"id":5,"sec":0,"col":null,"line":null,"page":1,"cite":"p.1:57","text":"The operation of the above described apparatus is as follows:","spans":[]},{"id":6,"sec":0,"col":null,"line":null,"page":1,"cite":"p.1:59","text":"A suitable refrigerant; for instance butane, in liquid form is contained within evaporator 1. An inert gas, for instance ammonia, is introduced into evaporator 1 through conduit 30 and distributor head 31. The refrigerant evaporates in the evaporator in the presence of the inert gas due to the fact that the partial pressure of the refrigerant is reduced thereby and the resulting gaseous mixture passes through conduit 5 to within condenser 6. Here the mixture comes in intimate contact with an absorption liquid, for example water, which is introduced into the condenser through conduit 37 and distributor head 35. Inasmuch as the ammonia gas is very soluble in water, while the butane is quite insoluble, the ammonia gas is absorbed by the water, thus freeing the butane from the gaseous mixture. Thus the butane assumes substantially the entire pressure within the condenser, which pressure is sufficient to cause its liquefaction at the temperature maintained therein by the cooling water.","spans":[[91,92,"ref","1"],[160,161,"ref","1"],[178,180,"ref","30"],[202,204,"ref","31"],[421,422,"ref","5"],[443,444,"ref","6"],[590,592,"ref","37"],[614,616,"ref","35"]]},{"id":7,"sec":0,"col":null,"line":null,"page":1,"cite":"p.1:82","text":"The specific gravity of liquid butane is less than that of the solution of ammonia in water and hence stratification of the two liquids occurs, the liquid butane floating upon the ammonia solution. The latter solution is indicated by reference character 26. The liquid butane passes from condenser 6 through conduit 11 and returns to evaporator 1, where it is again evaporated and the cycle repeated.","spans":[[254,256,"ref","26"],[298,299,"ref","6"],[316,318,"ref","11"],[345,346,"ref","1"]]},{"id":8,"sec":0,"col":null,"line":null,"page":1,"cite":"p.1:91","text":"The ammonia solution flows by gravity from condenser 6 through conduit 27 and heat exchanger jacket 28 to within generator 29. Here the application of heat causes the ammonia to be expelled as a gas from the solution and this ammonia gas passes through conduit 30 and distributor head 31 to within evaporator 1, where it reduces the partial pressure of the butane, wherefore the latter evaporates as previously described.","spans":[[53,54,"ref","6"],[71,73,"ref","27"],[100,102,"ref","28"],[123,125,"ref","29"],[261,263,"ref","30"],[285,287,"ref","31"],[309,310,"ref","1"]]},{"id":9,"sec":0,"col":null,"line":null,"page":2,"cite":"p.2:1","text":"Water, containing but little ammonia in solution, passes from generator 29 into conduit 32 where it is further heated by the source of heat 36. This heating causes the formation of vapor in conduit 32 which lifts liquid through this conduit to within container 33. The liquid thus supplied to container 33 may pass by gravity through conduit 37 to condenser 6. The hot weak liquid passing through conduit 37 is brought into heat exchange relationship with the cool strong liquid passing through heat exchanger jacket 28 and an exchange of heat between the two liquids takes place. The weak liquid is further cooled by being brought into heat exchange relation with the cooling water in jacket 12 and is hence in a condition to rapidly absorb ammonia in the condenser.","spans":[[72,74,"ref","29"],[88,90,"ref","32"],[140,142,"ref","36"],[198,200,"ref","32"],[261,263,"ref","33"],[303,305,"ref","33"],[342,344,"ref","37"],[358,359,"ref","6"],[405,407,"ref","37"],[517,519,"ref","28"],[693,695,"ref","12"]]},{"id":10,"sec":0,"col":null,"line":null,"page":2,"cite":"p.2:20","text":"Vapor entering container 33 from conduit 32 passes therefrom through vent conduit 34 to the condenser.","spans":[[25,27,"ref","33"],[41,43,"ref","32"],[82,84,"ref","34"]]},{"id":11,"sec":0,"col":null,"line":null,"page":2,"cite":"p.2:23","text":"During the operation of the hereinbefore described apparatus, the pressure existing in the various members is uniform with the exception of slight pressure differences, sufficient to cause flow of fluids, caused by liquid columns. The pressure existing in generator 29 must be sufficiently greater than that existing in the upper part of evaporator 1 to cause the flow of vapor to take place from distributor head 31, or, in other words, to overcome the liquid head designated by h_{2}. This excess pressure in the generator is balanced by the head exerted by the column of liquid equal to the differences in levels between the liquid in condenser 6 and generator 29, indicated by h_{1}. It is, of course, necessary that the head represented by h_{2} is less than that represented by h_{1} in order that flow shall take place.","spans":[[266,268,"ref","29"],[349,350,"ref","1"],[414,416,"ref","31"],[648,649,"ref","6"],[664,666,"ref","29"]]},{"id":12,"sec":0,"col":null,"line":null,"page":2,"cite":"p.2:42","text":"While we have described a preferred embodiment for carrying out our invention, it is to be understood that modifications thereof fall within the scope of the invention, which is to be limited only by the appended claims viewed in the light of the prior art.","spans":[]},{"id":13,"sec":0,"col":null,"line":null,"page":3,"cite":"p.3:38","text":"In testimony whereof we hereunto affix our signatures.","spans":[]},{"id":14,"sec":0,"col":null,"line":null,"page":3,"cite":"p.3:40","text":"ALBERT EINSTEIN.","spans":[]},{"id":15,"sec":0,"col":null,"line":null,"page":3,"cite":"p.3:41","text":"LEO SZILARD.","spans":[]}],"claims":[{"n":1,"page":2,"cite":"p.2:49","col":null,"line":null,"depends":null,"text":"1. Refrigerating apparatus comprising a generator, a condenser arranged at a higher level than the generator, an evaporator, a container arranged at a higher level than the condenser, said generator containing an inert gas dissolved in absorption liquid and adapted to expel the inert gas from solution, a conduit for conducting the inert gas from the generator to the evaporator, a conduit for conducting liquid refrigerant from the condenser to the evaporator, a conduit for conducting mixed vapor of refrigerant and inert gas from the evaporator to the condenser in heat exchange relation with inert gas passing into the evaporator, a conduit for conducting rich absorption liquid from the condenser to the generator by gravity, a conduit for conducting weak absorption liquid from said container to said condenser by gravity, a conduit extending upwardly from said generator to said container and means to heat the last-mentioned conduit to lift liquid from the generator to the container.","spans":[]},{"n":2,"page":2,"cite":"p.2:72","col":null,"line":null,"depends":null,"text":"2. Refrigerating apparatus comprising a generator, a condenser arranged at a higher level than the generator, an evaporator, a container arranged at a higher level than the condenser, said generator containing an inert gas dissolved in absorption liquid and adapted to expel the inert gas from solution, a conduit for conducting the inert gas from the generator to the evaporator, a conduit for conducting liquid refrigerant from the condenser to the evaporator, a conduit for conducting mixed vapor of refrigerant and inert gas from the evaporator to the condenser in heat exchange relation with inert gas passing into the evaporator, a conduit for conducting rich absorption liquid from the condenser to the generator by gravity, a conduit for conducting weak absorption liquid from said container to said condenser by gravity, a conduit extending upwardly from said generator to said container, means to heat the last-mentioned conduit to lift liquid from the generator to the container and a vent conduit connecting the upper part of said container with said condenser.","spans":[]},{"n":3,"page":2,"cite":"p.2:97","col":null,"line":null,"depends":null,"text":"3. Refrigerating apparatus comprising a generator, a condenser arranged at a higher level than the generator, an evaporator, a container arranged at a higher level than the condenser, said generator containing ammonia dissolved in water and adapted to expel the ammonia from solution, a conduit for conducting the ammonia gas from the generator to the evaporator, a conduit for conducting liquid butane from the condenser to the evaporator, a conduit for conducting mixed vapor of butane and ammonia from the evaporator to the condenser in heat exchange relation with ammonia gas passing into the evaporator, a conduit for conducting strong solution of ammonia in water from the condenser to the generator by gravity, a conduit for conducting weak solution of ammonia in water from said container to said condenser by gravity, a conduit extending upwardly from said generator to said container and means to heat the last-mentioned conduit to lift liquid from the generator to the container.","spans":[]},{"n":4,"page":2,"cite":"p.2:121","col":null,"line":null,"depends":null,"text":"4. Refrigerating apparatus comprising a generator, a condenser arranged at a higher level than the generator, an evaporator, a container arranged at a higher level than the condenser, said generator containing ammonia dissolved in water and adapted to expel the ammonia from solution, a conduit for conducting the ammonia gas from the generator to the evaporator, a conduit for conducting liquid butane from the condenser to the evaporator, a conduit for conducting mixed vapor of butane and ammonia from the evaporator to the condenser in heat exchange relation with ammonia gas passing into the evaporator, a conduit for conducting strong solution of ammonia in water from the condenser to the generator by gravity, a conduit for conducting weak solution of ammonia in water from said container to said condenser by gravity, a conduit extending upwardly from said generator to said container, means to heat the last-mentioned conduit to lift liquid from the generator to the container and a vent conduit connecting the upper part of said container with said condenser.","spans":[]},{"n":5,"page":3,"cite":"p.3:17","col":null,"line":null,"depends":null,"text":"5. Method of refrigerating which comprises evaporating a liquid cooling agent in the presence of an inert gas to absorb heat and thus forming a gaseous mixture of cooling agent and inert gas, conveying the gaseous mixture into the presence of an absorption liquid at such condition that the cooling agent condenses on being deprived of inert gas in gaseous mixture therewith due to the introduction of absorption liquid into the presence of the inert gas, separating the solution of inert gas in absorption medium from the condensed cooling agent, returning the condensed cooling agent to the presence of the inert gas, separating the inert gas and absorption liquid by heat, circulating the absorption liquid by means of a separate ource of heat to the presence of the gaseous mixture of coolin 0-11-11 to Albert Einstein, of Berlin, and Leo Szilard, of Berlin-Wilmersdorf, and assigned to Electrolux Servel Corporation. It is one of a series of refrigerator patents by the two (Dannen, \"The Einstein-Szilard Refrigerators\", Scientific American, January 1997). The machine has no moving parts and runs at essentially one total pressure, driven only by heat. It builds on the von Platen-Munters absorption refrigerator (US 1,685,764), in which hydrogen equalizes the pressure, ammonia is the refrigerant and water the absorbent. Here the roles change: butane is the refrigerant, ammonia is the pressure-equalizing gas, and water absorbs the ammonia. Butane evaporates into ammonia in the evaporator; in the condenser water absorbs the ammonia out of the mixture, leaving the butane at nearly the full system pressure, so it liquefies at cooling-water temperature. Heat at the generator drives the ammonia back out of the water, and a second heat source lifts the weak water back to the top of the circuit.","figs":{"1":"A single schematic of the whole circuit; double lines are pipes, the thin hatched outlines are vessel walls, short dashes mark liquid. In condenser 6 the upper liquid layer is butane and the lower layer is ammonia solution 26; conduit 11 opens into the butane layer and carries it back to the bottom of evaporator 1. Conduit 30 leaves the top of generator 29, loops over the drawing and runs inside conduit 5 to distributor head 31, so the cold outgoing mixture and the incoming ammonia gas exchange heat. Conduit 32, heated by 36, lifts weak liquid from the generator to container 33; conduit 37 returns it down through jacket 28 (counterflow with the strong solution from conduit 27) and up through cooling jacket 12 to spray head 35. Dimension h1 runs from the liquid surface in generator 29 to that in condenser 6; h2 from the liquid surface in evaporator 1 down to head 31. The two short unnumbered stubs on jacket 12 are evidently its water connections; the bracket marked HEAT at the generator stands for its unspecified heating."},"parts":{"30":"Carries the ammonia gas expelled in generator 29; for its run between the condenser and the evaporator it lies inside conduit 5.","32":"Works as a vapor-lift (bubble) pump: heating forms vapor in the tube, and the rising bubbles carry slugs of liquid up to container 33.","34":"Returns the vapor that arrives with the lifted liquid in container 33 to the condenser.","26":"The heavier lower layer in the condenser; liquid butane floats on it.","h1":"Liquid column that balances the generator's excess pressure; the text requires h2 to be less than h1 for flow to take place.","h2":"Depth of distributor head 31 below the liquid surface in the evaporator; the ammonia gas must overcome it to bubble out."},"glossary":[{"term":"absorption refrigeration","def":"A refrigeration cycle driven by heat instead of a mechanical compressor: a refrigerant or carrier gas is absorbed into a liquid at one point and driven out again by heating at another."},{"term":"inert gas","def":"The patent's term for the auxiliary gas the refrigerant evaporates into, lowering the refrigerant's partial pressure while the total pressure stays the same everywhere. Here it is ammonia; it is inert toward the butane, not chemically inert."},{"term":"partial pressure","def":"The share of the total pressure of a gas mixture contributed by one component. A liquid evaporates while its vapor's partial pressure is below its vapor pressure at that temperature."},{"term":"generator","def":"The heated vessel in which the absorbed gas is boiled out of the absorption liquid."},{"term":"strong / weak liquid","def":"Absorption liquid carrying much or little dissolved gas: strong solution flows from the condenser to the generator, weak liquid from the generator back to the condenser."},{"term":"vapor-lift pump","def":"A heated vertical tube in which vapor bubbles push liquid upward; it has no moving parts. Also called a bubble pump or percolator pump."},{"term":"heat exchanger jacket","def":"An outer shell around a pipe; the two fluids flow on either side of the pipe wall and exchange heat without mixing."},{"term":"liquid head","def":"Pressure expressed as the height of a liquid column that produces it."},{"term":"distributor head","def":"A perforated pipe end that breaks a stream of gas or liquid into many small jets or bubbles."},{"term":"stratification","def":"Separation of two immiscible liquids into layers by density."}]},"pages":["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAACRAAAA1QAQAAAAAiSpflAACyCklEQVR42u39e5Ak930fCH5+WTndCaDZnYAAsCUN0AmKPkOk7tiyZalFD9EJChQRF44zqCVA7AYp1NmKC57Psdf0SfKQnsevZ8bC0IKMscPn415YYg3B2MWDS8Ab2liQBDE5A1ga2Y5wS6YoxB5FZA9GVIEAMdnDBpDdnZW/+6PeVfl+VGVmfX8RJHr6kZX5ye/7yQToBB+JICCICCKCiCAiiAgigogOQUQQEUQEEUFEEBFEBBEdgoggIogIIoKIICKICCI6BBFBRBARRAQRQUQQEUR0CCKCiCAiiAgigoggIojoEEQEEUFEEBFEBBFBRIcgIogIIoKIICKICCKCqDzHyvn6jPr0idEIIoKIICKICCKCiE4xIbIKBxGZjsRoBBFBRBARRAQRQUSHICKIygiRIIhCnZ0iAiB0YjRyY0lcxzgGURFREUFEEBX7OCSLiIoIIoKIICKI6BBEBBFBVAiIWgQRndQQSQRRKSPOxGgoUl6l/BAxgogYjSAiiAgiOgQRQUQQTcYQJYhCDVGCCGH1E5RqnElZZBFEYcckiMKORiVYJIsIIoKIICKI6ARB5BIYpPSJ0QgiggiF7RMhWURURBARRAQRQUQQEUR0CCKCqMgQWaBgCFERHYKIICKICCKCiCAiiAgizGZNLEGUsjlLotY8oqIZgogRRERFJIuIikgW0SGICCKCiCBCsXuyiIooj0aMNusQWcRoREUEEUFEhyAiiEoNkUXWNVERQYQKrDQDDechRiOICCKCiCCiQxARRAQRQUQQEUQEEcqzghIULyIqIogIIoKIIKJDEBFEBBFBRBChhC050qyXDIf3m4T4aIIRSUm07pNkEUFEEBFEBFElmogl2jVMjEYQEUQEEUFEEBFEdAgigoggIogIIoKIICKI6BBEBBFBRBARRNWESBBEAKX2idEIIoKIICKICCKCiCAC7YanrsZ8qMghZIiKSBYRRARRmSG6ShDRIY1GVEQQEUQEEUFEEBFEdCoEkUEQERXFOS3u8U2dICIfLc4pxLAJiTphidEIIoKIICKICKLqDL0oG0SMICJGI4gIIjoE0fQhEgTR7LWLEKMRRAQRQUQQEUQEEUE0623D0SCiieDEaAQRQUQQEUQEUayzDyqeISoiiDC7udgiQsQIImI0goggokMQEUQEEUFEEJXUjJ9hiBhBRIxGEBFEBBFBhMlu3abYdVmoyCIsKkVFjkwQkUYjiGYFol0CJwwihcAhcU2yiCAiiAgigoggIojoEEQEEUFEEBUSItodQ24sMRpBRBCh4ElMkkXEaAQRQUQQEUQEEUFEhyAiiAgigoggIogIIoKIDkFEEBFEBBFBRBARRAQRHYKIICogRIIgwsxt/SBGI4jKB5FFhXwVO977oInRQpUPQUTimiAiiAiiUvg6UuUG6BGjzQhEFl <script>
// Patent figure gallery + viewer. Data: window.PATENTS (pipeline/build.py). Traces: window.TraceRender.
// window.SITE: {links: {pn: file}} on the gallery page (light records), {home: file} on a per-patent page.
// Routes: #/  |  #/<pn>/figures/<fig>[/<ref>]  |  #/<pn>/text[/<pid>]  |  #/<pn>/claims  |  #/<pn>/about
(function () {
  const PATS = window.PATENTS, SITE = window.SITE || {}, byPn = Object.fromEntries(PATS.map(p => [p.pn, p]));
  const NS = 'http://www.w3.org/2000/svg';
  const $ = (s, r = document) => r.querySelector(s);
  const h = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
  const mk = (tag, a = {}) => { const n = document.createElementNS(NS, tag); for (const k in a) n.setAttribute(k, a[k]); return n; };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const subsup = s => esc(s).replace(/_\{([^}]*)\}/g, '<sub>$1</sub>').replace(/\^\{([^}]*)\}/g, '<sup>$1</sup>');
  const cite = (col, line) => col ? `${col}:${line || '?'}` : '';
  const citeOf = p => p.cite || (p.page != null && !p.col ? `p.${p.page + 1}` : cite(p.col, p.line));
  const docLabel = p => p.doc || `US ${p.number}`;
  const fmtDate = d => d || '';
  const figL = s => document.documentElement.dataset.type !== 'plate' ? String(s || '').replace(/\bFIG(S?)\./g, 'Fig$1.').replace(/\bFIGURE\b/g, 'Figure') : (s || '');
  PATS.forEach(p => p.figById = Object.fromEntries(p.figures.map(f => [f.id, f])));

  // ---------- theme ----------
  const themeBtn = $('#themeBtn');
  function curTheme() {
    const t = document.documentElement.dataset.theme;
    if (t) return t;
    return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  function setTheme(t) { document.documentElement.dataset.theme = t; themeBtn.innerHTML = t === 'dark' ? '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6L13 13M3 13l1.4-1.4M11.6 4.4L13 3"/></svg>' : '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7z"/></svg>'; try { localStorage.setItem('cray-theme', t); } catch (e) { } }
  let saved = null; try { saved = localStorage.getItem('cray-theme'); } catch (e) { }
  setTheme((/[?&]theme=(light|dark)/.exec(location.search) || [])[1] || saved || 'dark'); // ?theme= for headless review
  themeBtn.onclick = () => setTheme(curTheme() === 'dark' ? 'light' : 'dark');

  // ---------- type style (html[data-type], set before paint in template.html) ----------
  const typeBtns = [...document.querySelectorAll('#typeSw button')];
  const markType = () => typeBtns.forEach(b => b.classList.toggle('on', b.dataset.t === document.documentElement.dataset.type));
  typeBtns.forEach(b => b.onclick = () => {
    document.documentElement.dataset.type = b.dataset.t; markType();
    try { localStorage.setItem('ipatent-type', b.dataset.t); } catch (e) { }
    if (view && view.cleanup) view.cleanup();
    view = null; main.innerHTML = ''; route(); // figure labels change case between styles
  });
  markType();

  // ---------- tooltip ----------
  const tip = $('#tip');
  function showTip(ev, html) { tip.innerHTML = html; tip.style.display = 'block'; moveTip(ev); }
  function moveTip(ev) { const r = tip.getBoundingClientRect(); let x = ev.clientX + 14, y = ev.clientY + 14; if (x + r.width > innerWidth - 4) x = ev.clientX - r.width - 10; if (y + r.height > innerHeight - 4) y = ev.clientY - r.height - 10; tip.style.left = x + 'px'; tip.style.top = y + 'px'; }
  function hideTip() { tip.style.display = 'none'; }
  const partName = (pat, ref) => (pat.parts[ref] && pat.parts[ref].name) || '';
  const UNNAMED = 'no name in the text';
  const partTip = (pat, ref) => `<span class="num">${esc(ref)}</span>${esc(partName(pat, ref) || UNNAMED)}`;

  // ---------- pan / zoom on an <svg> viewBox ----------
  class PanZoom {
    constructor(box, svg, onChange, onClick) {
      this.box = box; this.svg = svg; this.onChange = onChange || (() => { }); this.full = [0, 0, 100, 100]; this.vb = this.full.slice(); this.anim = 0;

      box.addEventListener('mousedown', ev => { if (ev.button === 0 && !ev.target.closest('button')) drag = { x: ev.clientX, y: ev.clientY, vb: this.vb.slice(), moved: false }; });

    bar.append(q, h('span', 'lbl', 'Sort'), sortSel, dirBtn, views, h('span', 'spacer'), count);

    const commit = () => { history.replaceState(null, '', galleryHash(st)); draw(); };
    q.oninput = () => { st.q = q.value.trim(); commit(); };
    sortSel.onchange = () => { st.s = sortSel.value; st.d = 1; commit(); };
    dirBtn.onclick = () => { st.d = -st.d; commit(); };
    Object.entries(vb).forEach(([k, b]) => b.onclick = () => { st.v = k; commit(); });
    const onKey = ev => { if (ev.key === '/' && document.activeElement !== q && view && view.gallery) { ev.preventDefault(); q.focus(); } };
    addEventListener('keydown', onKey);

    function matches(p, skip) {
      const toks = st.q.toLowerCase().split(/\s+/).filter(Boolean);
      if (toks.some(t => !p.hay.includes(t.replace(/,/g, '')) && !p.hay.includes(t))) return false;
      return FACETS.every(([k]) => k === skip || !st.f[k].size || p.facet[k].some(v => st.f[k].has(v)));
    }
    function drawFacets() {
      facets.innerHTML = '';
      FACETS.forEach(([k, name]) => {
        const vals = new Map();
        PATS.forEach(p => p.facet[k].forEach(v => vals.set(v, 0)));
        PATS.filter(p => matches(p, k)).forEach(p => p.facet[k].forEach(v => vals.set(v, vals.get(v) + 1)));
        if (vals.size < 2 && !st.f[k].size) return;
        const order = k === 'group' ? GROUP_ORDER : [...vals.keys()].sort();
        const row = h('div', 'frow'); row.appendChild(h('span', 'lbl', name));
        order.filter(v => vals.has(v)).forEach(v => {
          const b = h('button', 'fchip' + (st.f[k].has(v) ? ' on' : ''), `${esc(v || 'Other')} <span class="num">${vals.get(v)}</span>`);
          b.onclick = () => { st.f[k].has(v) ? st.f[k].delete(v) : st.f[k].add(v); commit(); };
          row.appendChild(b);
        });
        facets.appendChild(row);
      });
      if (FACETS.some(([k]) => st.f[k].size) || st.q) {
        const clr = h('button', 'fchip', 'Clear'); clr.onclick = () => { st.q = q.value = ''; FACETS.forEach(([k]) => st.f[k].clear()); commit(); };
        (facets.lastChild || facets).appendChild(clr);
      }
    }
    function draw() {
      sortSel.value = st.s; dirBtn.textContent = st.d > 0 ? 'Asc' : 'Desc';
      Object.entries(vb).forEach(([k, b]) => b.classList.toggle('on', st.v === k));
      drawFacets();
      const key = SORTS[st.s][1];
      const rows = PATS.filter(p => matches(p)).sort((a, b) => st.d * cmp(key(a), key(b)) || cmp(+a.pn, +b.pn));
      count.textContent = `${rows.length} of ${PATS.length}`;
      out.innerHTML = '';
      if (!rows.length) { out.appendChild(h('div', 'gnone lbl', 'No match')); return; }
      (st.v === 'table' ? drawTable : drawCards)(rows);
    }
    const link = (p, fig) => `${(SITE.links || {})[p.pn] || ''}#/${p.pn}/figures/${encodeURIComponent(fig.id)}`;
    const frontFig = p => p.figures.find(f => f.front) || p.figures[0];

    function drawCards(rows) {
      const io = new IntersectionObserver(es => es.forEach(e => {
        if (!e.isIntersecting) return;
        io.unobserve(e.target); const p = byPn[e.target.dataset.pn], fig = frontFig(p);
        const s = mk('svg', { class: 'fv' }); e.target.appendChild(s);
        e.target.classList.add('fv', 'm-trace');
        TraceRender.renderTrace(s, fig.trace, { uid: 'g' + p.pn });
        s.setAttribute('preserveAspectRatio', 'xMidYMid meet');
      }), { rootMargin: '400px' });
      const grouped = st.s === 'group';
      let cards = null, cur = null;
      rows.forEach(p => {
        if (!cards || (grouped && (p.group || '') !== cur)) {
          cur = p.group || ''; cards = out.appendChild(h('div', 'cards'));
          if (grouped && cur) { const k = rows.filter(r => (r.group || '') === cur).length; cards.appendChild(h('div', 'ghead', `${esc(cur)}<span class="gcnt">${k} patent${k > 1 ? 's' : ''}</span>`)); }
        }
        const fig = frontFig(p);
        const c = h('a', 'card'); c.href = link(p, fig);
        const th = h('div', 'thumb');
        if (fig.trace) { th.dataset.pn = p.pn; io.observe(th); }
        else { const im = h('img'); im.src = fig.img; im.style.filter = 'var(--scan-filter)'; im.style.objectFit = 'contain'; th.appendChild(im); }
        c.appendChild(th);
        const orgs = (p.assignees || []).map(a => `${esc(a.org || a.name)}${a.place ? ` <span class="pl">${esc(a.place)}</span>` : ''}`).join('; ');
        c.appendChild(h('div', 'meta', `
          <div class="row"><span class="num">${esc(docLabel(p))}</span><span class="num">${esc(fmtDate(p.issued))}</span></div>
          <div class="t">${esc(p.title)}</div>
          <div class="row"><span>${(p.inventors || []).map(i => esc(i.name)).join(', ')}</span></div>
          <div class="row"><span>${orgs || '<span class="unk">No assignee</span>'}</span></div>
          <div class="counts num">${p.counts.figures} figures &middot; ${p.counts.claims} claims &middot; ${p.counts.parts} numbered parts &middot; filed ${esc(fmtDate(p.filed))}</div>`));
        cards.appendChild(c);
      });
    }

    let colW = {}; try { colW = JSON.parse(localStorage.getItem('ipatent-col-widths')) || {}; } catch (e) { }
    function drawTable(rows) {
      const wrap = h('div', 'gtable'), t = h('table');
      const cols = [
        ['number', 'Patent', p => `<span class="num">${esc(p.number)}</span>`, 'num'],
        ['issued', 'Issued', p => esc(p.issued || ''), 'num'],
        ['filed', 'Filed', p => esc(p.filed || ''), 'num'],
        ['title', 'Title', p => esc(p.title), 'tt'],
        ['inventor', 'Inventors', p => (p.inventors || []).map(i => esc(i.name)).join(', ')],
        ['assignee', 'Assignee', p => esc(firstOrg(p)) || '<span class="unk">none</span>'],
        ['place', 'Location', p => esc(where(p)) || '<span class="unk">unknown</span>'],
        ['group', 'Group', p => esc(p.group || '')],
        ['term', 'Status', p => p.status ? `<span class="st" title="${statusTip(p.status)}">${esc(p.status.state)} <span class="num">${esc(p.status.term_end)}</span></span>` : '<span class="unk">unknown</span>'],
        ['figures', 'Figs', p => p.counts.figures, 'r'],
        ['traced', 'Traced', p => `${pct(p.counts.traced, p.counts.figures)} %`, 'r'],
        ['claims', 'Claims', p => p.counts.claims, 'r'],
        ['parts', 'Parts', p => p.counts.parts, 'r'],
      ];
      t.innerHTML = `<thead><tr>${cols.map(([k, n, , c]) => `<th data-k="${k}" class="${c === 'r' ? 'r' : ''}${st.s === k ? ' on' : ''}">${n}${st.s === k ? (st.d > 0 ? ' &#9650;' : ' &#9660;') : ''}<span class="rz" title="Drag to resize; double-click to reset all columns"></span></th>`).join('')}</tr></thead>`;
      const tb = h('tbody'); t.appendChild(tb);
      const ths = [...t.querySelectorAll('th')];
      // Widths are all set or all automatic: a drag freezes every column at its measured width, so only the dragged one moves.
      const applyW = () => {
        if (!ths.every(th => colW[th.dataset.k])) return;
        t.classList.add('sized');
        ths.forEach(th => { th.style.width = `${colW[th.dataset.k]}px`; });
        t.style.width = `${ths.reduce((s, th) => s + colW[th.dataset.k], 0)}px`;
      };
      applyW();
      let resizing = false;
      t.querySelector('thead').onpointerdown = ev => {
        const rz = ev.target; if (!rz.classList.contains('rz')) return;
        ev.preventDefault();
        const k = rz.parentNode.dataset.k, x0 = ev.clientX;
        const base = Object.fromEntries(ths.map(th => [th.dataset.k, th.getBoundingClientRect().width]));
        resizing = true; rz.setPointerCapture(ev.pointerId);
        rz.onpointermove = e => { colW = { ...base, [k]: Math.max(40, base[k] + e.clientX - x0) }; applyW(); };
        rz.onlostpointercapture = () => {
          rz.onpointermove = rz.onlostpointercapture = null;
          setTimeout(() => { resizing = false; });
          try { localStorage.setItem('ipatent-col-widths', JSON.stringify(colW)); } catch (e) { }
        };
      };
      t.querySelector('thead').ondblclick = ev => {
        if (!ev.target.classList.contains('rz')) return;
        colW = {}; try { localStorage.removeItem('ipatent-col-widths'); } catch (e) { }
        draw();
      };
      rows.forEach(p => {
        const tr = h('tr'); tr.dataset.pn = p.pn;
        tr.innerHTML = cols.map(([k, , fn, c]) => `<td class="${c || ''}">${fn(p)}</td>`).join('');
        tb.appendChild(tr);
      });
      t.querySelector('thead').onclick = ev => {
        const th = ev.target.closest('th'); if (!th || resizing || ev.target.classList.contains('rz')) return;
        if (st.s === th.dataset.k) st.d = -st.d; else { st.s = th.dataset.k; st.d = 1; }
        commit();
      };
      tb.onclick = ev => { const tr = ev.target.closest('tr'); if (tr) { const p = byPn[tr.dataset.pn]; location.href = link(p, frontFig(p)); } };
      tb.onmouseover = ev => {
        const tr = ev.target.closest('tr'); if (!tr) return;
        const p = byPn[tr.dataset.pn], fig = frontFig(p);
        const ppl = (p.inventors || []).map(i => `<div>${esc(i.name)}${i.place ? ` <span class="pl">${esc(i.place)}</span>` : ''}</div>`).join('');
        showTip(ev, `<img class="tthumb" src="${fig.img}" alt=""><div class="tmeta"><span class="num">${esc(docLabel(p))}</span> ${esc(figL(fig.label))}</div>${ppl}`);
      };
      tb.onmousemove = ev => { if (tip.style.display === 'block') moveTip(ev); };
      tb.onmouseleave = hideTip;
      wrap.appendChild(t); out.appendChild(wrap);
    }

    draw();
    view = { gallery: true, update(hash) { const s2 = galleryState(hash); Object.assign(st, s2); if (document.activeElement !== q) q.value = st.q; draw(); }, cleanup() { removeEventListener('keydown', onKey); } };
  }

  // ---------- figures tab ----------
  function FiguresTab(pat) {
    const root = h('div', 'figs'); main.appendChild(root);
    const list = h('div', 'flist'), center = h('div', 'center'), side = h('div', 'side');

    const fv = new FigureView(stageBox, {
      onHover: ref => { st.hover = ref; paint(); },

      const it = h('div', 'fitem', `<img src="${f.thumb}" alt=""><div><div class="fl">${esc(figL(f.label))}</div><div class="fs">Sheet ${esc(f.sheet || '')}${nSheets ? ` of ${nSheets}` : ''}${f.trace ? '' : ' &middot; scan only'}</div></div>`);
      it.dataset.fig = f.id; it.onclick = () => go(pat, 'figures', f.id); list.appendChild(it);
    });

    function pin(ref, fly = true) {

    }
    function paint() {
      const ref = st.hover || st.pin;
      fv.highlight(ref);
      plist.querySelectorAll('.prow').forEach(r => r.classList.toggle('on', r.dataset.ref === ref));
      renderInfo(ref);
    }
    function renderInfo(ref) {
      const f = st.fig;
      if (!ref) {
        const note = pat.notes && pat.notes.figs && pat.notes.figs[f.id];
        const paras = f.paras.map(pid => pat.paras[pid]);
        info.innerHTML = `<h2 class="fh">${esc(figL(f.label))}</h2>
          ${f.brief.text ? `<p class="quote">${subsup(f.brief.text)} <span class="cite" data-col="${f.brief.col || ''}" data-page="${f.brief.page != null ? f.brief.page : ''}">${citeOf(f.brief)}</span></p>` : ''}
          ${note ? `<div class="note"><span class="lbl">Note</span>${subsup(note)}</div>` : ''}
          ${paras.length ? `<div class="lbl sub">Referenced in ${paras.length} paragraph${paras.length > 1 ? 's' : ''}</div><div class="mlist">${paras.map(p =>
            `<div class="mitem" data-pid="${p.id}"><span class="cite">${citeOf(p)}</span> ${subsup(p.text.slice(0, 150))}${p.text.length > 150 ? '...' : ''}</div>`).join('')}</div>` : ''}`;
      } else {
        const p = pat.parts[ref] || { name: '', mentions: [], figs: [] };
        const note = pat.notes && pat.notes.parts && pat.notes.parts[ref];
        const figs = pat.figures.filter(x => (p.figs || []).includes(x.id) || (x.trace && x.trace.elements.some(e => e.ref === ref)));
        info.innerHTML = `<h2><span class="num">${esc(ref)}</span>${esc(p.name || UNNAMED)}</h2>
          ${p.alt && p.alt.length ? `<div class="alt">also: ${p.alt.map(esc).join('; ')}</div>` : ''}
          <div class="chips">${figs.map(x => `<span class="chip${x === f ? ' on' : ''}" data-fig="${x.id}">${esc(figL(x.label))}</span>`).join('')}</div>
          ${note ? `<div class="note"><span class="lbl">Note</span>${subsup(note)}</div>` : ''}
          <div class="lbl sub">${p.mentions.length} mention${p.mentions.length === 1 ? '' : 's'} in the description</div>
          <div class="mlist">${p.mentions.map(m => `<div class="mitem" data-pid="${m[0]}"><span class="cite">${citeOf(pat.paras[m[0]])}</span> ${mentionHtml(pat, m, ref)}</div>`).join('')}</div>`;
      }
      info.querySelectorAll('.mitem').forEach(n => n.onclick = () => go(pat, 'text', n.dataset.pid));
      info.querySelectorAll('.chip[data-fig]').forEach(n => n.onclick = () => go(pat, 'figures', n.dataset.fig, ref));
      info.querySelectorAll('.quote .cite').forEach(n => n.onclick = () => openScan(pat, +n.dataset.col, n.textContent, n.dataset.page));
    }
    function buildParts() {
      const f = st.fig;
      plist.innerHTML = `<div class="head"><span class="lbl">Parts</span><span class="lbl num">${f.refs.length}</span></div>`;
      f.refs.forEach(ref => {
        const r = h('div', 'prow', `<span class="num">${esc(ref)}</span><span>${esc(partName(pat, ref) || UNNAMED)}</span>`);
        r.dataset.ref = ref;
        r.onmouseenter = () => { st.hover = ref; paint(); };
        r.onmouseleave = () => { st.hover = null; paint(); };
        r.onclick = () => { stopTour(); pin(ref === st.pin ? null : ref); };
        if (!fv.has(ref)) r.style.color = 'var(--text-muted)';
        plist.appendChild(r);
      });
    }
    // tour through parts in order of first mention; step through timing figures
    function tourRefs() { return st.fig.refs.filter(r => fv.has(r)); }
    function tourStep(d) {
      const rs = tourRefs(); if (!rs.length) return;
      let i = rs.indexOf(st.pin); i = i < 0 ? (d > 0 ? 0 : rs.length - 1) : (i + d + rs.length) % rs.length;
      pin(rs[i]);
      const row = plist.querySelector(`.prow[data-ref="${CSS.escape(rs[i])}"]`); if (row) row.scrollIntoView({ block: 'nearest' });
    }
    function stopTour() { if (st.tour) { clearInterval(st.tour); st.tour = null; drawTools(); } }
    function stopStep() { if (st.stepTimer) { clearInterval(st.stepTimer); st.stepTimer = null; } }
    function drawTools() {
      const f = st.fig, has = !!f.trace;
      tools.innerHTML = '';
      const modes = h('span', 'grp');
      [['trace', 'Redraw'], ['scan', 'Scan'], ['overlay', 'Overlay']].forEach(([m, n]) => {
        const b = h('button', fv.mode === m ? 'on' : '', n); b.disabled = !has && m !== 'scan';
        b.onclick = () => { fv.setMode(m); drawTools(); }; modes.appendChild(b);
      });
      tools.append(h('span', 'lbl', 'View'), modes);
      const tg = h('span', 'grp');
      const bp = h('button', '', '&lt;'), bplay = h('button', st.tour ? 'on' : '', st.tour ? 'Pause' : 'Play'), bn = h('button', '', '&gt;');
      bp.title = 'Previous part (Left)'; bn.title = 'Next part (Right)'; bplay.title = 'Step through parts in order of first mention';
      bp.onclick = () => { stopTour(); tourStep(-1); }; bn.onclick = () => { stopTour(); tourStep(1); };
      bplay.onclick = () => { if (st.tour) return stopTour(); tourStep(1); st.tour = setInterval(() => tourStep(1), 2200); drawTools(); };
      [bp, bplay, bn].forEach(b => { b.disabled = !has; tg.appendChild(b); });
      tools.append(h('span', 'lbl', 'Parts tour'), tg);
      if (fv.maxStep >= 0) {
        const steps = (f.trace.steps && f.trace.steps.names) || [];
        const lbl = (f.trace.steps && f.trace.steps.label) || 'Step';
        const sl = h('input'); sl.type = 'range'; sl.min = -1; sl.max = fv.maxStep; sl.step = 1; sl.value = fv.step == null ? fv.maxStep : fv.step;
        const v = h('span', 'stepv num');
        const upd = () => { const n = +sl.value; fv.setStep(n === fv.maxStep && !st.stepTimer && sl.dataset.touched !== '1' ? null : n); v.innerHTML = n < 0 ? 'start' : subsup(steps[n] || `${n}`); };
        sl.oninput = () => { sl.dataset.touched = '1'; stopStep(); upd(); };
        const sp = h('button', '', 'Play'); sp.onclick = () => {
          if (st.stepTimer) { stopStep(); sp.textContent = 'Play'; return; }
          sl.dataset.touched = '1'; if (+sl.value >= fv.maxStep) sl.value = -1; upd(); sp.textContent = 'Pause';
          st.stepTimer = setInterval(() => { if (+sl.value >= fv.maxStep) { stopStep(); sp.textContent = 'Play'; return; } sl.value = +sl.value + 1; upd(); }, 650);
        };
        tools.append(h('span', 'lbl', esc(lbl)), sp, sl, v);
        const qs = /[?&]step=(\d+)/.exec(location.search); // headless review hook
        if (qs) { sl.value = qs[1]; sl.dataset.touched = '1'; }
        upd();
      }
      const fit = h('button', '', 'Fit'); fit.title = 'Fit (F)'; fit.onclick = () => fv.pz.fit();
      const pb = h('button', plot.open ? 'on' : '', 'Plot SVG'); pb.disabled = !has || !window.PlotExport;
      pb.title = 'Export this redraw for a pen plotter: lines only, fitted to paper, lettering in a single-stroke font';
      pb.onclick = () => plot.toggle();
      tools.append(h('span', 'spacer'), pb, fit);
      if (!has && plot.open) plot.toggle();
    }
    // pen-plotter export panel (viewer/plot-export.js, DevLog-006)
    const plot = (() => {
      const P = { paper: 'A4', orient: 'auto', margin: 15, pen: 0.3, weight: 'drawn', text: 'merge' };
      try { Object.assign(P, JSON.parse(localStorage.getItem('ipatent-plot') || '{}')); } catch (e) { }
      const el = h('div', 'plotp'); el.hidden = true; stageBox.appendChild(el);
      const opt = (k, vals, tip) => `<select data-k="${k}" title="${tip}">${vals.map(([v, n]) => `<option value="${v}"${String(P[k]) === v ? ' selected' : ''}>${n}</option>`).join('')}</select>`;
      const num = (k, step, min, max, tip) => `<input type="number" data-k="${k}" value="${P[k]}" step="${step}" min="${min}" max="${max}" title="${tip}">`;
      el.innerHTML = `<div class="prw"><span class="lbl">Paper</span>${opt('paper', Object.keys(window.PlotExport ? PlotExport.PAPERS : {}).map(k => [k, k]), 'Paper size; the drawing is fitted inside the margin and centred')}${opt('orient', [['auto', 'Auto'], ['portrait', 'Portrait'], ['landscape', 'Landscape']], 'Orientation; Auto picks the one that prints the drawing larger')}</div>
        <div class="prw"><span class="lbl">Margin</span>${num('margin', 1, 0, 80, 'Margin, mm')}<span class="u">mm</span><span class="lbl">Pen</span>${num('pen', 0.05, 0.05, 3, 'Pen width, mm: sets the fill spacing of solid areas and the passes for heavy lines')}<span class="u">mm</span></div>
        <div class="prw"><span class="lbl">Lines</span>${opt('weight', [['drawn', 'Weight as drawn'], ['single', 'Single stroke']], 'Weight as drawn: lines wider than the pen get parallel passes. Single stroke: every line once')}</div>
        <div class="prw"><span class="lbl">Lettering</span>${opt('text', [['merge', 'Same pen'], ['layer', 'Own layer'], ['off', 'Off']], 'Text and numerals in a single-stroke Hershey font. Own layer: a second Inkscape layer for a second pen')}</div>
        <div class="ppv"><img alt=""></div>
        <div class="pst num"></div>
        <div class="prw"><span class="spacer"></span><button class="pdl on">Download SVG</button></div>`;
      const img = el.querySelector('img'), stx = el.querySelector('.pst');
      let url = null, out = null, timer = null;
      const dl = el.querySelector('.pdl');
      function dispose() { if (url) URL.revokeObjectURL(url); url = null; out = null; img.removeAttribute('src'); }
      function render() {
        clearTimeout(timer); timer = null;
        const f = st.fig; if (!f || !f.trace || el.hidden) return;
        dispose();
        try {
          out = PlotExport.toPlotSVG(f.trace, { ...P, title: `${docLabel(pat)} ${f.label}`, desc: `${pat.title}. Redrawn from the ${pat.scan_source || 'USPTO'} drawing sheet; outside5sigma.com/ipatent` });
        } catch (e) { out = null; stx.textContent = 'Export failed: ' + e.message; stx.title = ''; dl.disabled = true; return; }
        if (out.stats.empty) { out = null; stx.textContent = 'Nothing to draw with these settings'; stx.title = ''; dl.disabled = true; return; }
        url = URL.createObjectURL(new Blob([out.svg], { type: 'image/svg+xml' })); img.src = url; dl.disabled = false;
        const s = out.stats, n = v => v.toLocaleString('en-US');
        stx.textContent = `${n(Math.round(s.wMm))} x ${n(Math.round(s.hMm))} mm, ${n(s.paths)} paths, ${s.downM.toFixed(1)} m pen down, ${s.travelM.toFixed(1)} m travel, ${n(Math.round(s.bytes / 1e3))} kB${s.bytes > 5e6 ? ' (over 5 MB)' : ''}`;
        stx.title = `Drawing ${s.drawW.toFixed(0)} x ${s.drawH.toFixed(0)} mm; ${s.layers} layer${s.layers > 1 ? 's' : ''}; travel = pen-up moves in this path order`;

      el.addEventListener('input', ev => {
        const k = ev.target.dataset.k; if (!k) return;
