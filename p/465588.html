<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Patents</title>
<script>
// Type style before first paint: ?type=, else the saved choice, else the default (DevLog-005).
(function () {
  var ok = ['plate', 'copperplate', 'specification'], q = (/[?&]type=(\w+)/.exec(location.search) || [])[1], s = null;
  try { s = localStorage.getItem('ipatent-type'); } catch (e) { }
  document.documentElement.dataset.type = ok.indexOf(q) >= 0 ? q : ok.indexOf(s) >= 0 ? s : 'copperplate';
})();
</script>
<style>
/* Fonts (OFL, fonts/OFL-*.txt). ../fonts/ is the fonts folder relative to the page, set by pipeline/build.py.
   Browsers download only the faces a page uses. */
@font-face { font-family: "Playfair Display"; src: url("../fonts/PlayfairDisplay.woff2") format("woff2"); font-weight: 400 900; font-style: normal; font-display: swap; }
@font-face { font-family: "Playfair Display"; src: url("../fonts/PlayfairDisplay-Italic.woff2") format("woff2"); font-weight: 400 900; font-style: italic; font-display: swap; }
@font-face { font-family: "Source Serif 4"; src: url("../fonts/SourceSerif4.woff2") format("woff2"); font-weight: 400 600; font-style: normal; font-display: swap; size-adjust: 96%; }
@font-face { font-family: "Source Serif 4"; src: url("../fonts/SourceSerif4-Italic.woff2") format("woff2"); font-weight: 400 600; font-style: italic; font-display: swap; size-adjust: 96%; }
@font-face { font-family: "Pinyon Script"; src: url("../fonts/PinyonScript.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "IM Fell English"; src: url("../fonts/IMFellEnglish.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "IM Fell English"; src: url("../fonts/IMFellEnglish-Italic.woff2") format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
@font-face { font-family: "Mrs Saint Delafield"; src: url("../fonts/MrsSaintDelafield.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "Old Standard TT"; src: url("../fonts/OldStandardTT.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "Old Standard TT"; src: url("../fonts/OldStandardTT-Italic.woff2") format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
@font-face { font-family: "Old Standard TT"; src: url("../fonts/OldStandardTT-Bold.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }

/* Type styles, html[data-type] (set before paint in template.html):
   plate          Playfair Display heads, Source Serif 4 text; figure labels as printed (FIG. 1)
   copperplate    Pinyon Script brand, group names and figure labels (Fig. 1), IM Fell English titles and heads, Source Serif 4 text
   specification  Mrs Saint Delafield brand and group names, Old Standard TT for the rest, italic figure labels */
:root, :root[data-type="plate"] {
  --f-text: "Source Serif 4", Georgia, serif; --f-num: "Source Serif 4", Georgia, serif; --fs-text: 14px; --fs-read: 15px;
  --f-disp: "Playfair Display", Georgia, serif; --disp-style: italic; --dk: 1;
  --f-title: "Playfair Display", Georgia, serif; --title-ls: .02em; --tk: 1;
  --f-script: "Playfair Display", Georgia, serif; --script-style: italic; --sk: 1; --script-pt: 0px;
  --f-fig: "Playfair Display", Georgia, serif; --fig-style: italic; --fk: 1;
}
:root[data-type="copperplate"] {
  --f-text: "Source Serif 4", Georgia, serif; --f-num: "Source Serif 4", Georgia, serif; --fs-text: 14px; --fs-read: 15px;
  --f-disp: "IM Fell English", Georgia, serif; --disp-style: italic; --dk: 1.08;
  --f-title: "IM Fell English", Georgia, serif; --title-ls: .035em; --tk: 1.06;
  --f-script: "Pinyon Script", "IM Fell English", Georgia, cursive; --script-style: normal; --sk: 1.38; --script-pt: 4px;
  --f-fig: "Pinyon Script", "IM Fell English", Georgia, cursive; --fig-style: normal; --fk: 1.38;
}
:root[data-type="specification"] {
  --f-text: "Old Standard TT", Georgia, serif; --f-num: "Old Standard TT", Georgia, serif; --fs-text: 14.5px; --fs-read: 16px;
  --f-disp: "Old Standard TT", Georgia, serif; --disp-style: italic; --dk: 1.05;
  --f-title: "Old Standard TT", Georgia, serif; --title-ls: .06em; --tk: .94;
  --f-script: "Mrs Saint Delafield", "Old Standard TT", Georgia, cursive; --script-style: normal; --sk: 1.6; --script-pt: 6px;
  --f-fig: "Old Standard TT", Georgia, serif; --fig-style: italic; --fk: 1;
}
:root[data-type="specification"] body { font-synthesis: small-caps; } /* Old Standard TT has no small-caps glyphs */

/* Palette: warm neutrals of the Plate style (dark #0d0d0d / ink #f2f1ec), light theme on #f1f0ec paper.
   Type roles (set per style below): --f-text body and UI, --f-disp display heads, --f-title patent titles (printed in caps),
   --f-script brand, group names and figure labels, --f-num numerals and citations. */
:root {
  --surface-0: #f1f0ec; --surface-1: #fcfcfb; --surface-2: #e9e8e2; --border: rgba(11, 11, 11, .14); --grid: #e1e0d9;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #6f6d68; --rule: #5f5e59;
  --series-1: #2a78d6; --series-2: #b85f08; --context: #b9b7ae; --amber: #b85f08;
  --ink: #2b2b29; --hi: #2a78d6; --hi-fill: rgba(42, 120, 214, .14); --mark: rgba(237, 161, 0, .30);
  --amber-fill: rgba(184, 95, 8, .10); --amber-tag: rgba(184, 95, 8, .16);
  --scan-filter: none;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface-0: #0d0d0d; --surface-1: #1a1a19; --surface-2: #232321; --border: rgba(255, 255, 255, .12); --grid: #2c2c2a;
    --text-primary: #f2f1ec; --text-secondary: #c3c2b7; --text-muted: #a8a69d; --rule: #a8a69d;
    --series-1: #4c9bf0; --series-2: #f7962c; --context: #6b6a63; --amber: #f7962c;
    --ink: #d6d5cc; --hi: #4c9bf0; --hi-fill: rgba(76, 155, 240, .20); --mark: rgba(201, 133, 0, .42);
    --amber-fill: rgba(247, 150, 44, .08); --amber-tag: rgba(247, 150, 44, .18);
    --scan-filter: invert(1) brightness(.86);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --surface-0: #0d0d0d; --surface-1: #1a1a19; --surface-2: #232321; --border: rgba(255, 255, 255, .12); --grid: #2c2c2a;
  --text-primary: #f2f1ec; --text-secondary: #c3c2b7; --text-muted: #a8a69d; --rule: #a8a69d;
  --series-1: #4c9bf0; --series-2: #f7962c; --context: #6b6a63; --amber: #f7962c;
  --ink: #d6d5cc; --hi: #4c9bf0; --hi-fill: rgba(76, 155, 240, .20); --mark: rgba(201, 133, 0, .42);
  --amber-fill: rgba(247, 150, 44, .08); --amber-tag: rgba(247, 150, 44, .18);
  --scan-filter: invert(1) brightness(.86);
  color-scheme: dark;
}
* { box-sizing: border-box; }
button, input, select { border-radius: 0; }
html, body { margin: 0; height: 100%; background: var(--surface-0); color: var(--text-primary);
  font: var(--fs-text, 14px)/1.45 var(--f-text); font-optical-sizing: auto; font-synthesis: none; }
body { overflow: hidden; }
::selection { background: var(--hi-fill); }
a { color: var(--series-1); text-decoration: none; }
button, input, select { font: inherit; color: var(--text-primary); }
button { background: transparent; border: 1px solid var(--border); padding: 2px 9px; cursor: pointer; white-space: nowrap; }
button:hover { background: var(--surface-2); }
button.on { background: var(--hi-fill); border-color: var(--hi); color: var(--text-primary); }
button:disabled { opacity: .4; cursor: default; }
input::placeholder { color: var(--text-muted); font-style: italic; }
.mono, .num { font-family: var(--f-num); font-variant-numeric: lining-nums tabular-nums; }
.lbl { font-family: var(--f-text); font-size: 13px; font-weight: 600; font-variant-caps: all-small-caps; letter-spacing: .07em; color: var(--text-muted); }
.spacer { flex: 1; }
.grp { display: inline-flex; }
.grp button + button { border-left: 0; }
/* scotch rule over major heads: 2px over 1px, neutral */
.ghead, .about h3, .tsec { position: relative; border-top: 2px solid var(--rule); }
.ghead::before, .about h3::before, .tsec::before { content: ''; position: absolute; left: 0; right: 0; top: 2px; border-top: 1px solid var(--rule); }
.tsec, .tsec::before { border-top-color: var(--context); }

#app { display: grid; grid-template-rows: 44px minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); height: 100vh; }
#bar { display: flex; align-items: center; gap: 14px; padding: 0 12px; background: var(--surface-0); border-bottom: 1px solid var(--border); min-width: 0; }
#home { color: var(--text-primary); white-space: nowrap; flex-shrink: 0; font: var(--script-style, normal) 400 calc(21px * var(--sk, 1))/1 var(--f-script); letter-spacing: var(--script-ls, 0); padding-top: var(--script-pt, 0); }
#crumb { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); }
#crumb .num { color: var(--text-primary); margin-right: 10px; }
#crumb .tt { font-family: var(--f-title); letter-spacing: var(--title-ls, .02em); font-size: calc(14px * var(--tk, 1)); }
#tabs { display: flex; height: 100%; padding: 7px 0; gap: 2px; }
#tabs a { display: flex; align-items: center; padding: 0 11px; color: var(--text-secondary); font: var(--disp-style, italic) 400 16px var(--f-disp); }
#tabs a:hover { color: var(--text-primary); background: var(--surface-2); }
#tabs a.on { color: var(--text-primary); background: var(--hi-fill); }
#themeBtn { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 28px; padding: 0; border-color: transparent; color: var(--text-secondary); }
#themeBtn:hover { color: var(--text-primary); border-color: var(--border); }
#themeBtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; }
#typeSw button { width: 30px; height: 28px; padding: 0; border-color: transparent; color: var(--text-secondary); font-size: 17px; line-height: 1; }
#typeSw button:hover { color: var(--text-primary); border-color: var(--border); }
#typeSw button.on { color: var(--text-primary); background: var(--hi-fill); border-color: transparent; }
#typeSw [data-t="plate"] { font: italic 400 17px "Playfair Display", Georgia, serif; }
#typeSw [data-t="copperplate"] { font: 400 22px "Pinyon Script", Georgia, cursive; }
#typeSw [data-t="specification"] { font: 400 24px "Mrs Saint Delafield", Georgia, cursive; }
#main { min-height: 0; overflow: hidden; }
#foot { display: flex; align-items: center; gap: 6px; height: 20px; padding: 0 10px; font-size: 11px; color: var(--text-muted); background: var(--surface-0); border-top: 1px solid var(--border); white-space: nowrap; overflow: hidden; }
#foot .sep { color: var(--context); }

/* gallery */
.gallery { height: 100%; overflow-y: auto; padding: 0 24px 24px; }
.gbar { position: sticky; top: 0; z-index: 3; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; max-width: 1240px; margin: 0 auto; padding: 12px 0 8px; background: var(--surface-0); }
.gbar input { flex: 0 1 420px; min-width: 0; height: 30px; padding: 3px 8px; background: var(--surface-1); border: 1px solid var(--border); }
.gbar select { height: 30px; background: var(--surface-1); border: 1px solid var(--border); padding: 2px 4px; }
.gbar button { height: 30px; }
.gfacets { display: grid; gap: 6px; max-width: 1240px; margin: 0 auto 8px; }
.frow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.frow > .lbl { width: 72px; flex: none; }
.fchip { padding: 1px 8px; font-size: 13px; color: var(--text-secondary); background: var(--surface-1); border-color: transparent; }
.fchip:hover { color: var(--text-primary); }
.fchip .num { color: var(--text-muted); margin-left: 5px; font-size: 12px; }
.fchip.on { background: var(--hi-fill); border-color: transparent; color: var(--hi); }
.fchip.on .num { color: var(--hi); }
.gnone { max-width: 1240px; margin: 24px auto; }
.unk { color: var(--context); }
.gtable .st { white-space: nowrap; }
.pl { color: var(--text-muted); }
/* booktabs: heavy top rule, rule under the head, thin grid rules, no verticals */
.gtable { max-width: 1240px; margin: 16px auto 0; overflow-x: auto; border-top: 2px solid var(--rule); border-bottom: 1px solid var(--rule); }
.gtable table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.gtable th { position: sticky; top: 0; background: var(--surface-0); text-align: left; font-size: 13px; font-weight: 600; font-variant-caps: all-small-caps; letter-spacing: .07em; color: var(--text-muted); padding: 6px 8px; box-shadow: inset 0 -1px 0 var(--rule); cursor: pointer; white-space: nowrap; user-select: none; }
.gtable th.on { color: var(--text-primary); }
.gtable .rz { position: absolute; top: 0; right: 0; bottom: 0; width: 7px; cursor: col-resize; touch-action: none; }
.gtable .rz:hover, .gtable .rz:active { border-right: 2px solid var(--hi); }
.gtable table.sized { table-layout: fixed; }
.gtable table.sized th, .gtable table.sized td { box-sizing: border-box; overflow: hidden; text-overflow: ellipsis; }
.gtable th.r, .gtable td.r { text-align: right; font-family: var(--f-num); font-variant-numeric: lining-nums tabular-nums; }
.gtable td { padding: 4px 8px; border-bottom: 1px solid var(--grid); color: var(--text-secondary); vertical-align: top; }
.gtable td.tt { color: var(--text-primary); min-width: 220px; font-family: var(--f-title); letter-spacing: var(--title-ls, .02em); font-size: calc(13px * var(--tk, 1)); }
.gtable td.num { white-space: nowrap; }
.gtable tbody tr { cursor: pointer; }
.gtable tbody tr:hover td { background: var(--hi-fill); }
#tip .tthumb { display: block; width: 220px; filter: var(--scan-filter); margin-bottom: 4px; }
#tip .tmeta { margin-bottom: 2px; }
#tip .pl { margin-left: 4px; }
.ghead { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 14px; margin-bottom: -6px; padding-top: 12px; color: var(--text-primary);
  font: var(--script-style, normal) 400 calc(30px * var(--sk, 1))/1.15 var(--f-script); letter-spacing: var(--script-ls, 0); }
.ghead .gcnt { margin-left: auto; font: 600 13px var(--f-text); font-style: normal; font-variant-caps: all-small-caps; letter-spacing: .07em; color: var(--text-muted); }
.cards + .cards { margin-top: 40px; }
.gout { padding-bottom: 24px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 520px)); justify-content: center; gap: 24px; max-width: 1240px; margin: 0 auto; }
.card { display: grid; grid-template-rows: 360px auto; background: var(--surface-1); border: 1px solid var(--border); cursor: pointer; color: inherit; }
.card:hover { border-color: var(--text-muted); }
.card .thumb { overflow: hidden; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: center; padding: 12px; background: var(--surface-0); }
.card .thumb svg, .card .thumb img { width: 100%; height: 100%; }
.card .meta { padding: 12px 14px 14px; display: grid; gap: 5px; }
.card .meta > .row:first-child { color: var(--text-muted); font-size: 13px; }
.card .t { font: 400 calc(18px * var(--tk, 1))/1.25 var(--f-title); letter-spacing: var(--title-ls, .02em); }
.card .row { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--text-secondary); font-size: 14px; }
.card .t + .row { font-style: italic; color: var(--text-primary); }
.card .counts { color: var(--text-muted); font-size: 13px; font-family: var(--f-num); font-variant-numeric: lining-nums; }

/* figures tab */
.figs { display: grid; grid-template-columns: 200px minmax(0, 1fr) 360px; height: 100%; }
.flist { overflow-y: auto; border-right: 1px solid var(--border); background: var(--surface-1); }
.fitem { display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: center; padding: 6px 10px; cursor: pointer; border-bottom: 1px solid var(--grid); }
.fitem:hover { background: var(--surface-2); }
.fitem.on { background: var(--hi-fill); }
.fitem img { width: 56px; height: 56px; object-fit: contain; background: #fff; filter: var(--scan-filter); }
.fitem .fl { font: var(--fig-style, normal) 400 calc(17px * var(--fk, 1))/1.1 var(--f-fig); }
.fitem .fs { font-size: 12px; font-style: italic; color: var(--text-muted); }
.center { display: grid; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 6px 10px; border-bottom: 1px solid var(--border); background: var(--surface-1); }
.tools .lbl { margin-right: -6px; }
.tools input[type=range] { width: 160px; accent-color: var(--hi); }
.stepv { min-width: 9ch; color: var(--text-secondary); }
.plotp { position: absolute; top: 8px; right: 8px; z-index: 5; width: min(340px, calc(100% - 16px)); max-height: calc(100% - 16px); overflow: auto;
  display: grid; gap: 7px; padding: 9px 10px 10px; background: var(--surface-1); border: 1px solid var(--rule); }
.plotp[hidden] { display: none; }
.plotp .prw { display: flex; align-items: center; gap: 6px; }
.plotp .prw > .lbl { width: 76px; flex: none; }
.plotp .prw > .lbl + .lbl, .plotp .u + .lbl { width: auto; margin-left: 10px; }
.plotp select, .plotp input { height: 26px; padding: 1px 4px; background: var(--surface-0); border: 1px solid var(--border); min-width: 0; }
.plotp input { width: 62px; }
.plotp .u { color: var(--text-muted); font-size: 13px; }
.plotp .ppv { display: flex; justify-content: center; align-items: center; height: 300px; background: var(--surface-2); }
.plotp .ppv img { max-width: 100%; max-height: 100%; background: #fff; box-shadow: 0 0 0 1px var(--border); }
.plotp .pst { font-size: 12px; color: var(--text-secondary); }
.side { border-left: 1px solid var(--border); background: var(--surface-1); display: grid; grid-template-rows: minmax(0, 1.3fr) minmax(0, 1fr); min-height: 0; }
.info { overflow-y: auto; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.info h2 { margin: 0 0 10px; font: 500 20px/1.2 var(--f-disp); display: flex; align-items: baseline; gap: 10px; }
.info h2 .num { color: var(--hi); font-family: var(--f-num); }
.info h2.fh { font: var(--fig-style, normal) 400 calc(26px * var(--fk, 1))/1.1 var(--f-fig); }
.info .alt { color: var(--text-muted); font-size: 13px; font-style: italic; margin: -6px 0 8px; }
.quote { margin: 0 0 12px; color: var(--text-primary); font-style: italic; }
.cite { font-family: var(--f-num); font-variant-numeric: lining-nums tabular-nums; font-style: normal; font-size: 12px; color: var(--text-muted); cursor: pointer; white-space: nowrap; }
.cite:hover { color: var(--hi); }
.note { margin: 0 0 12px; padding: 7px 10px 8px; background: var(--amber-fill); color: var(--text-secondary); font-size: 14px; }
.note .lbl { display: inline-block; margin: 0 6px 2px 0; padding: 0 6px 1px; color: var(--amber); background: var(--amber-tag); }
.sub { margin: 14px 0 4px; }
.mlist { display: grid; gap: 6px; }
.mitem { font-size: 14px; cursor: pointer; padding: 2px 0; }
.mitem:hover { color: var(--hi); }
.mitem b { color: var(--hi); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
.chip { padding: 0 7px; font-size: 13px; cursor: pointer; background: var(--surface-2); color: var(--text-secondary); }
.chip:hover, .chip.on { background: var(--hi-fill); color: var(--hi); }
.plist { overflow-y: auto; }
.plist .head { position: sticky; top: 0; background: var(--surface-1); padding: 6px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.prow { display: grid; grid-template-columns: 48px 1fr; gap: 10px; padding: 3px 14px; cursor: pointer; font-size: 14px; }
.prow:hover { background: var(--surface-2); }
.prow.on { background: var(--hi-fill); }
.prow .num { color: var(--text-muted); text-align: right; }
.prow.on .num { color: var(--hi); }

/* figure view */
.fv { position: relative; overflow: hidden; min-height: 0; background: var(--surface-0); touch-action: none; }
.fv svg.stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
.fv.panning svg.stage { cursor: grabbing; }
.fv .scan { filter: var(--scan-filter); }
.fv .tr-s { stroke: var(--ink); fill: none; stroke-linecap: round; stroke-linejoin: round; }
.fv .tr-fill-solid { fill: var(--ink); }
.fv .tr-fill-light { fill: var(--ink); fill-opacity: .08; }
.fv .tr-arrow { fill: var(--ink); }
.fv .tr-hatchline { stroke: var(--ink); stroke-width: 2; }
.fv .tr-fill-paper { fill: var(--surface-0); }
.fv .tr-ink-paper.tr-s, .fv .tr-el.on .tr-ink-paper.tr-s { stroke: var(--surface-0); }
.fv .tr-t.tr-ink-paper, .fv .tr-el.on .tr-t.tr-ink-paper { fill: var(--surface-0); }
.fv .tr-t { fill: var(--ink); font-family: Helvetica, Arial, ui-sans-serif, sans-serif; }
.fv .tr-it { font-style: italic; }
.fv .tr-b { font-weight: 700; }
.fv .tr-k-label .tr-t { fill: var(--text-secondary); }
.fv .tr-el { transition: opacity .12s; }
.fv.m-trace .scan { display: none; }
.fv.m-scan .tr-el { opacity: 0; }
.fv.m-overlay .scan { opacity: .55; }
.fv.m-overlay .tr-s, .fv.m-overlay .tr-arrow { stroke: var(--hi); }
.fv.m-overlay .tr-t, .fv.m-overlay .tr-fill-solid, .fv.m-overlay .tr-arrow { fill: var(--hi); }
.fv.sel .tr-el { opacity: .3; }
.fv.m-scan.sel .tr-el { opacity: 0; }
.fv .tr-el.on { opacity: 1 !important; }
.fv .tr-el.on .tr-s { stroke: var(--hi); }
.fv .tr-el.on .tr-t, .fv .tr-el.on .tr-fill-solid, .fv .tr-el.on .tr-arrow { fill: var(--hi); }
.fv .tr-el.on.tr-k-block .tr-s:not(polyline):not(.tr-fill-solid) { fill: var(--hi-fill); }
.fv .tr-el.fut { opacity: .08; }
.fv .tr-el.now .tr-s { stroke: var(--series-2); }
.fv .tr-el.now .tr-t, .fv .tr-el.now .tr-fill-solid { fill: var(--series-2); }
.fv .hit * { fill: transparent; stroke: transparent; }
.fv .hit [data-ref] { cursor: pointer; }
.fv .fvTag { position: absolute; left: 10px; top: 6px; color: var(--text-muted); font: var(--fig-style, normal) 400 calc(16px * var(--fk, 1)) var(--f-fig); pointer-events: none; }
.fv .fvZoom { position: absolute; right: 8px; bottom: 6px; color: var(--text-muted); font: 12px var(--f-num); pointer-events: none; }
.fv .fvFull { position: absolute; right: 8px; top: 6px; }

/* text + claims tab */
.textv { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 44%); height: 100%; }
.tcol { overflow-y: auto; border-right: 1px solid var(--border); }
.tbar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 6px 16px; background: var(--surface-1); border-bottom: 1px solid var(--border); }
.tbar input { width: 260px; padding: 3px 8px; background: var(--surface-0); border: 1px solid var(--border); }
.tbar select { background: var(--surface-0); border: 1px solid var(--border); padding: 2px 4px; max-width: 280px; }
.tbody { max-width: 820px; padding: 8px 16px 64px; font-size: var(--fs-read, 15px); line-height: 1.55; }
.tsec { margin: 30px 0 12px 58px; padding-top: 10px; font: var(--disp-style, italic) 400 calc(19px * var(--dk, 1))/1.2 var(--f-disp); letter-spacing: .01em; color: var(--text-primary); }
.para { display: grid; grid-template-columns: 48px 1fr; gap: 10px; margin: 0 0 10px; }
.para .cite { text-align: right; padding-top: 4px; }
.para.flash { background: var(--mark); }
.para p { margin: 0; }
.para table { border-collapse: collapse; font-size: 13px; border-top: 2px solid var(--rule); border-bottom: 1px solid var(--rule); }
.para td { border-bottom: 1px solid var(--grid); padding: 2px 8px; font-family: var(--f-num); font-variant-numeric: lining-nums tabular-nums; }
a.rf { color: var(--hi); font-family: var(--f-num); font-variant-numeric: lining-nums; font-weight: 600; }
a.rf:hover { background: var(--hi-fill); }
a.rf.on { background: var(--hi-fill); }
a.fg { color: var(--series-1); font-style: italic; }
a.fg:hover { background: var(--hi-fill); }
mark { background: var(--mark); color: inherit; }
.claim { margin: 0 0 14px; }
.claim.dep { margin-left: 24px; }
.claim > .lbl .num { margin-right: 4px; font-size: 15px; color: var(--text-primary); font-variant-caps: normal; }
.claim p { margin: 0; white-space: pre-line; }
.pane { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
.pane .tools { gap: 8px; }
.pane .fv { height: 100%; }

/* about */
.about { height: 100%; overflow-y: auto; padding: 16px 24px 64px; }
.about .wrap { max-width: 900px; }
.about h3 { margin: 30px 0 10px; padding-top: 10px; font: var(--disp-style, italic) 400 calc(21px * var(--dk, 1))/1.2 var(--f-disp); color: var(--text-primary); }
.about table { border-collapse: collapse; width: 100%; font-size: 14px; border-bottom: 1px solid var(--rule); }
.about td, .about th { text-align: left; padding: 3px 10px 3px 0; border-bottom: 1px solid var(--grid); vertical-align: top; }
.about th { font-weight: 600; color: var(--text-muted); width: 150px; font-size: 13px; font-variant-caps: all-small-caps; letter-spacing: .07em; }
.about dl { display: grid; grid-template-columns: 180px 1fr; gap: 6px 14px; margin: 0; font-size: 14px; }
.about dt { font-weight: 600; }
.about dd { margin: 0; color: var(--text-secondary); }
.sources { color: var(--text-muted); font-size: 13px; font-style: italic; margin-top: 24px; }

#tip { position: fixed; pointer-events: none; z-index: 30; display: none; max-width: 340px; padding: 5px 8px;
  background: var(--surface-1); border: 1px solid var(--rule); font-size: 13px; }
#tip .num { color: var(--hi); margin-right: 6px; }
#modal { position: fixed; inset: 24px; z-index: 40; background: var(--surface-1); border: 1px solid var(--rule); display: grid; grid-template-rows: 38px 1fr; }
#modal[hidden] { display: none; }
#modalBar { display: flex; align-items: center; gap: 10px; padding: 0 10px; border-bottom: 1px solid var(--border); }
#modalBody { position: relative; min-height: 0; }
#modalBody .fv { position: absolute; inset: 0; }
.fv .colmark { fill: var(--mark); stroke: none; }

@media (max-width: 1000px) {
  .figs { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) minmax(0, 40vh); }
  .fitem .fl { white-space: nowrap; }
  #bar { overflow-x: auto; }
  #tabs, #themeBtn { flex-shrink: 0; }
  #crumb { flex-shrink: 1; }
  .flist { display: flex; overflow-x: auto; overflow-y: hidden; border-right: 0; border-bottom: 1px solid var(--border); }
  .fitem { grid-template-columns: 40px auto; border-bottom: 0; border-right: 1px solid var(--grid); }
  .fitem img { width: 40px; height: 40px; }
  .side { border-left: 0; border-top: 1px solid var(--border); grid-template-rows: auto; overflow-y: auto; }
  .info { overflow: visible; }
  .plist { overflow: visible; }
  .textv { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 36vh; }
  .para { grid-template-columns: 40px minmax(0, 1fr); gap: 6px; }
  .tsec { margin-left: 46px; }
  .tbody { padding: 8px 10px 48px; }
  .tcol { border-right: 0; border-bottom: 1px solid var(--border); }
  .tbar input { width: auto; flex: 1 1 0; min-width: 0; }
  .tbar select { flex: 1 1 0; min-width: 0; }
  .tbar { padding: 6px 10px; gap: 6px; }
  #bar { gap: 8px; padding: 0 8px; }
  #home { font-size: calc(15px * var(--sk, 1)); }
  #typeSw button { width: 26px; }
  #crumb .tt { display: none; }
  #tabs a { padding: 0 7px; font-size: 15px; }
  .cards { grid-template-columns: minmax(0, 1fr); }
  .card { grid-template-rows: 280px auto; }
  .gallery { padding: 0 16px 16px; }
  .gbar input { flex: 1 1 100%; }
  .frow > .lbl { width: 100%; }
  .ghead { font-size: calc(24px * var(--sk, 1)); }
}

window.PATENTS = [{"pn":"465588","number":"465,588","doc":null,"date_label":null,"cite_scheme":"printed page:line","scan_source":null,"title":"TOILET-PAPER ROLL","inventors":["Seth Wheeler"],"assignee":null,"filed":"1891-06-08","issued":"1891-12-22","appl_no":"395,473","int_cl":null,"us_cl":null,"refs_patents":[],"refs_other":[],"examiners":null,"claims_count":1,"drawing_figures":2,"abstract":"","google":"https://patents.google.com/patent/US465588A/en","col1_page":1,"group":"Forum favorites","page_wh":[[2320,3408],[2320,3408]],"entities":{"pn":"465588","inventors":[{"name":"Seth Wheeler","printed":"SETH WHEELER, OF ALBANY, NEW YORK","city":"Albany","region":"NY","country":"US"}],"assignees":[],"source":{"page":1,"where":"header of the first printed page"}},"status":{"state":"Expired","term_end":"1908-12-22","basis":"17 years from grant; for grants before 1898 an earlier-expiring foreign patent on the same invention ended the U.S. term with it (Revised Statutes sec. 4887), not checked here","google_expiration":null,"checked":"2026-11-25"},"sections":[{"heading":"","first":0}],"paras":[{"id":0,"sec":0,"col":null,"line":null,"page":1,"cite":"p.1:1","text":"To all whom it may concern:","spans":[]},{"id":1,"sec":0,"col":null,"line":null,"page":1,"cite":"p.1:2","text":"Be it known that I, SETH WHEELER, of the city and county of Albany, and State of New York, have invented certain new and useful Improvements in Toilet-Paper Rolls; and I do hereby declare that the following is a full, clear, and exact description thereof, reference being had to the accompanying drawings, forming a part of this specification.","spans":[]},{"id":2,"sec":0,"col":null,"line":null,"page":1,"cite":"p.1:10","text":"My invention consists of a roll of connected sheets of paper for toilet use, said roll having incisions at intervals extending from the side of the web toward the center, but not meeting, and terminating in an angular cut, whereby the slight connection left may be separated without injury to the connected sheets. A difficulty with rolls of this character as heretofore manufactured has been due to the width of the bond uniting the sheets, which it has been necessary to make of considerable strength to withstand the tension of winding, but which it is desirable should be as frail as may be when the roll is unwound, otherwise the sheets do not separate with certainty and many of them are torn. Attempts have been made to remedy this by incisions in the bond that should not weaken it longitudinally; but such incisions avail little unless the sheets are pulled in a certain direction—a condition the user seldom considers or is aware of. In my improved roll I overcome this wholly by reducing the bond and terminating the lateral incisions in an angular cut, removing all liability of injury to the sheets in separating them. With this construction one sheet may be separated from the next without liability of the incisions turning in a direction parallel with the web and tearing off a considerable part of the contiguous sheet. At the same time I wind rolls containing any desired number of sheets.","spans":[]},{"id":3,"sec":0,"col":null,"line":null,"page":1,"cite":"p.1:42","text":"In the drawings, Figure 1 is a view of my roll of paper having arched and serrated incisions with a sheet hanging therefrom. Fig. 2 represents a detached sheet of paper.","spans":[[17,25,"fig","1"],[125,131,"fig","2"]]},{"id":4,"sec":0,"col":null,"line":null,"page":1,"cite":"p.1:46","text":"The roll a is composed of many sheets like b, Fig. 2, of soft paper suitable for toilet use. These sheets are produced by arched serrated incisions, as shown at c c′ c″ c‴ in Fig. 1, which extend from the edge of each sheet almost to the center, where the incisions terminate in an angular cut in the direction of the roll and the center line of the series of sheets, leaving a slight connection d, which serves to hold the sheets together. The purpose of this angular cut is to give the final tear, when the sheet is separated, a direction toward the center line of the series of sheets and prevent it taking a course parallel with it. The incisions are made sufficiently far apart to give a suitable sheet of paper for use. Such sheet is shown in Fig. 2.","spans":[[43,44,"ref","b"],[46,52,"fig","2"],[161,162,"ref","c"],[163,164,"ref","c"],[166,167,"ref","c"],[169,170,"ref","c"],[175,181,"fig","1"],[396,397,"ref","d"],[749,755,"fig","2"]]},{"id":5,"sec":0,"col":null,"line":null,"page":1,"cite":"p.1:63","text":"The connection d, as shown in Fig. 1, permits of the easy severance of a sheet of paper from a roll, which will be intact and no litter is occasioned by such severance. The curved mode of dividing the sheets permits the end of a sheet to be found more readily, and the serrations aid materially in grasping the end of a sheet when not hanging from a roll; but I do not confine myself to this construction, as it is obvious that an angular termination may be given to incisions that are neither curved nor serrated.","spans":[[15,16,"ref","d"],[30,36,"fig","1"]]},{"id":6,"sec":0,"col":null,"line":null,"page":1,"cite":"p.1:81","text":"SETH WHEELER.","spans":[]},{"id":7,"sec":0,"col":null,"line":null,"page":1,"cite":"p.1:82","text":"Witnesses: E. J. WHEELER, WM. A. WHEELER.","spans":[]}],"claims":[{"n":1,"page":1,"cite":"p.1:76","col":null,"line":null,"depends":null,"text":"A roll of paper partially divided into sheets by lateral incisions extending from the sides of the web toward the center of the sheets, each sheet being connected to the next one by a Λ-shaped tongue, substantially as described.","spans":[]}],"figures":[{"id":"1","label":"Fig. 1","sheet":1,"page":0,"front":false,"w":1070,"h":1540,"img":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABC4AAAYEAQAAAAAK/HZyAACE0ElEQVR42u39f5Qd133YCX5uvUJ3iWz2K2kosWPD6KLotRnFsdoOnWlKMLpIcWVmjk8WdpSM1muJbUdnouysZ1paxYZsEH0bwJCwzSPA8SZRMppRU+SJaclHYmZ0ZqhfxAWJJeFdHavlJA5zVjYLQFts/ohZAFtU9UP1vftHVb1XVa/qvdfd9UjtBu8ciej3o+pb3/ ],[850.0,136.0]],"w":3.4}]},{"id":"label-c1-bottom","kind":"label","ref":"c'","shapes":[{"t":"t","s":"c","x":302.8,"y":790.0,"size":46.0,"italic":true,"len":28.1,"bold":true},{"t":"l","d":[[346.0,771.0],[357.0,752.0]],"w":3.4}]},{"id":"label-c2","kind":"label","ref":"c''","shapes":[{"t":"t","s":"c","x":831.5,"y":790.8,"size":40.8,"italic":true,"len":27.7,"bold":true},{"t":"l","d":[[868.0,780.0],[879.0,761.0]],"w":3.4},{"t":"l","d":[[880.0,778.0],[891.0,760.0]],"w":3.4}]},{"id":"fig-label","kind":"text","shapes":[{"t":"t","s":"Fig.","x":32.1,"y":202.5,"size":52.0,"italic":true,"len":131.6},{"t":"t","s":"2.","x":169.6,"y":203.4,"size":61.8,"italic":true,"len":59.1}]}]},"paras":[3,4],"refs":["b","d","c'","c''","c'''"]}],"parts":{"a":{"ref":"a","name":"roll","figs":["1"],"mentions":[]},"b":{"ref":"b","name":"sheets","figs":["1","2"],"mentions":[[4,0,92]]},"c":{"ref":"c","name":"arched serrated incisions","figs":["1"],"mentions":[[4,93,440]]},"c'":{"ref":"c'","name":"arched serrated incisions","figs":["1","2"],"mentions":[]},"c''":{"ref":"c''","name":"arched serrated incisions","figs":["1","2"],"mentions":[]},"c'''":{"ref":"c'''","name":"arched serrated incisions","figs":["1","2"],"mentions":[]},"d":{"ref":"d","name":"slight connection","figs":["1","2"],"alt":["connection"],"mentions":[[4,93,440],[5,0,168]]},"e":{"ref":"e","name":"","figs":["1"],"mentions":[]},"f":{"ref":"f","name":"","figs":["1"],"mentions":[]}},"notes":{"patent":"Filed June 8, 1891 and issued December 22, 1891 to Seth Wheeler of Albany, New York. It covers a roll of toilet paper divided into sheets by cuts across the web that stop short of the center line, so that each sheet hangs from the next by a small tongue that tears easily without ripping into the sheets on either side. The single claim calls this a Λ-shaped tongue; the text also credits the arched, serrated form of the cuts with making the free end easier to find and grip, but does not limit the claim to it. Fig. 1 draws the free end coming over the top of the roll and hanging down in front, and the drawing is widely cited in discussions of which way a roll should hang.","figs":{"1":"Perspective of the roll a with sheets b hanging over the top and down the front. Each zigzag line across the web is one row of cuts: c and c' are lettered on the cuts at the left, c'' and c''' on those at the right, and d at the uncut connection where the cuts rise to a point at the middle. Three such rows are visible: at the top of the roll, partway down the hanging web, and at its torn lower end. e and f are lettered at the center of the roll end and its central hole but are not mentioned in the text.","2":"One sheet b after tearing off. The upper edge peaks at d, where the tongue was; the lower edge is notched up at the middle where the tongue of the next sheet tore away. Both left corners are lettered c'; the right corners c''' (upper) and c'' (lower)."},"parts":{"d":"The claim's Λ-shaped tongue: the narrow strip of paper left between the ends of the cuts, the only bond between sheets."},"glossary":[{"term":"web","def":"The continuous strip of paper as it comes off the roll, before it is torn into sheets."},{"term":"incision","def":"A cut through the paper; here a row of cuts runs in from each side edge but stops short of the center."},{"term":"serrated","def":"Toothed like a saw; the cuts are zigzag, leaving a notched edge on each sheet."},{"term":"substantially as described","def":"A closing phrase common in claims of this period, tying the claim to the construction set out in the description."}]},"pages":["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAACRAAAA1QAQAAAAAiSpflAADkj0lEQVR42uz9a3wk533fC36f6hqgRIFAUaZERAEHRcknoWXZRHK0NiyPiBqKcri7WofxR3Zkry7w5eQoV0OKHI/k4eABZiLCNkPCOZsTvUgkUNQqsqSPxGR9dmlZ4jwznIiTE8UCFcWh85GlwhCRwEs0BQiiCphCPfuiqrqrr2gMerq70PW8IDHdQHfVr/73q9AUp/UxCggKiAqICogKiAqICogKiIpTQFRAVEBUQFRAVEBUQFRAVJwCogKiAqICogKiAqICogKi4hQQFRAVEBUQFRAVEBUQFRAVp4CogKiAqICogKiAqICogKg4BUQFRAVEBUQFRAVEBUTFKSAqIOoHiHQB0X   // ---------- gallery: search, facets, sort, cards / table ----------

  const country = p => { const a = (p.assignees || []).find(a => a.country) || (p.inventors || []).find(i => i.country); return a ? a.country : ''; };
  const surname = n => (n || '').replace(/,?\s+(Jr|Sr|II|III|IV)\.?$/i, '').trim().split(/\s+/).pop() || '';
  const year = d => (d || '').slice(0, 4);

    number: ['Patent number', p => +p.pn.replace(/\D/g, '')], title: ['Title', p => (p.title || '').toLowerCase()],

        ths.forEach(th => { th.style.width = `${colW[th.dataset.k]}px`; });
        t.style.width = `${ths.reduce((s, th) => s + colW[th.dataset.k], 0)}px`;
      };
      applyW();
      let resizing = false;
      t.querySelector('thead').onpointerdown = ev => {
        const rz = ev.target; if (!rz.classList.contains('rz')) return;
        ev.preventDefault();
        const k = rz.parentNode.dataset.k, x0 = ev.clientX;
        const base = Object.fromEntries(ths.map(th => [th.dataset.k, th.getBoundingClientRect().width]));
        resizing = true; rz.setPointerCapture(ev.pointerId);
        rz.onpointermove = e => { colW = { ...base, [k]: Math.max(40, base[k] + e.clientX - x0) }; applyW(); };
        rz.onlostpointercapture = () => {
          rz.onpointermove = rz.onlostpointercapture = null;
          setTimeout(() => { resizing = false; });
          try { localStorage.setItem('ipatent-col-widths', JSON.stringify(colW)); } catch (e) { }
        };
      };
      t.querySelector('thead').ondblclick = ev => {
        if (!ev.target.classList.contains('rz')) return;
        colW = {}; try { localStorage.removeItem('ipatent-col-widths'); } catch (e) { }
        draw();
      };
      rows.forEach(p => {
        const tr = h('tr'); tr.dataset.pn = p.pn;
        tr.innerHTML = cols.map(([k, , fn, c]) => `<td class="${c || ''}">${fn(p)}</td>`).join('');
        tb.appendChild(tr);
      });
      t.querySelector('thead').onclick = ev => {
        const th = ev.target.closest('th'); if (!th || resizing || ev.target.classList.contains('rz')) return;
        if (st.s === th.dataset.k) st.d = -st.d; else { st.s = th.dataset.k; st.d = 1; }
        commit();
      };
      tb.onclick = ev => { const tr = ev.target.closest('tr'); if (tr) { const p = byPn[tr.dataset.pn]; location.href = link(p, frontFig(p)); } };
      tb.onmouseover = ev => {
        const tr = ev.target.closest('tr'); if (!tr) return;
        const p = byPn[tr.dataset.pn], fig = frontFig(p);
        const ppl = (p.inventors || []).map(i => `<div>${esc(i.name)}${i.place ? ` <span class="pl">${esc(i.place)}</span>` : ''}</div>`).join('');
        showTip(ev, `<img class="tthumb" src="${fig.img}" alt=""><div class="tmeta"><span class="num">${esc(docLabel(p))}</span> ${esc(figL(fig.label))}</div>${ppl}`);
      };
      tb.onmousemove = ev => { if (tip.style.display === 'block') moveTip(ev); };
      tb.onmouseleave = hideTip;
      wrap.appendChild(t); out.appendChild(wrap);
    }

    draw();
    view = { gallery: true, update(hash) { const s2 = galleryState(hash); Object.assign(st, s2); if (document.activeElement !== q) q.value = st.q; draw(); }, cleanup() { removeEventListener('keydown', onKey); } };
  }

    // tour through parts in order of first mention; step through timing figures

    function tourStep(d) {

      const row = plist.querySelector(`.prow[data-ref="${CSS.escape(rs[i])}"]`); if (row) row.scrollIntoView({ block: 'nearest' });

    function drawTools() {

      bp.onclick = () => { stopTour(); tourStep(-1); }; bn.onclick = () => { stopTour(); tourStep(1); };
      bplay.onclick = () => { if (st.tour) return stopTour(); tourStep(1); st.tour = setInterval(() => tourStep(1), 2200); drawTools(); };
      [bp, bplay, bn].forEach(b => { b.disabled = !has; tg.appendChild(b); });
      tools.append(h('span', 'lbl', 'Parts tour'), tg);
      if (fv.maxStep >= 0) {
        const steps = (f.trace.steps && f.trace.steps.names) || [];
        const lbl = (f.trace.steps && f.trace.steps.label) || 'Step';
        const sl = h('input'); sl.type = 'range'; sl.min = -1; sl.max = fv.maxStep; sl.step = 1; sl.value = fv.step == null ? fv.maxStep : fv.step;
        const v = h('span', 'stepv num');

        sl.oninput = () => { sl.dataset.touched = '1'; stopStep(); upd(); };
        const sp = h('button', '', 'Play'); sp.onclick = () => {
          if (st.stepTimer) { stopStep(); sp.textContent = 'Play'; return; }

          st.stepTimer = setInterval(() => { if (+sl.value >= fv.maxStep) { stopStep(); sp.textContent = 'Play'; return; } sl.value = +sl.value + 1; upd(); }, 650);
        };
        tools.append(h('span', 'lbl', esc(lbl)), sp, sl, v);
        const qs = /[?&]step=(\d+)/.exec(location.search); // headless review hook
        if (qs) { sl.value = qs[1]; sl.dataset.touched = '1'; }

      }
      const fit = h('button', '', 'Fit'); fit.title = 'Fit (F)'; fit.onclick = () => fv.pz.fit();

      pb.title = 'Export this redraw for a pen plotter: lines only, fitted to paper, lettering in a single-stroke font';
      pb.onclick = () => plot.toggle();
      tools.append(h('span', 'spacer'), pb, fit);
      if (!has && plot.open) plot.toggle();
    }
    // pen-plotter export panel (viewer/plot-export.js, DevLog-006)
    const plot = (() => {
      const P = { paper: 'A4', orient: 'auto', margin: 15, pen: 0.3, weight: 'drawn', text: 'merge' };
      try { Object.assign(P, JSON.parse(localStorage.getItem('ipatent-plot') || '{}')); } catch (e) { }
      const el = h('div', 'plotp'); el.hidden = true; stageBox.appendChild(el);
      const opt = (k, vals, tip) => `<select data-k="${k}" title="${tip}">${vals.map(([v, n]) => `<option value="${v}"${String(P[k]) === v ? ' selected' : ''}>${n}</option>`).join('')}</select>`;

        <div class="prw"><span class="lbl">Margin</span>${num('margin', 1, 0, 80, 'Margin, mm')}<span class="u">mm</span><span class="lbl">Pen</span>${num('pen', 0.05, 0.05, 3, 'Pen width, mm: sets the fill spacing of solid areas and the passes for heavy lines')}<span class="u">mm</span></div>
        <div class="prw"><span class="lbl">Lines</span>${opt('weight', [['drawn', 'Weight as drawn'], ['single', 'Single stroke']], 'Weight as drawn: lines wider than the pen get parallel passes. Single stroke: every line once')}</div>
        <div class="prw"><span class="lbl">Lettering</span>${opt('text', [['merge', 'Same pen'], ['layer', 'Own layer'], ['off', 'Off']], 'Text and numerals in a single-stroke Hershey font. Own layer: a second Inkscape layer for a second pen')}</div>
        <div class="ppv"><img alt=""></div>
        <div class="pst num"></div>
        <div class="prw"><span class="spacer"></span><button class="pdl on">Download SVG</button></div>`;
      const img = el.querySelector('img'), stx = el.querySelector('.pst');
      let url = null, out = null, timer = null;
      const dl = el.querySelector('.pdl');
      function dispose() { if (url) URL.revokeObjectURL(url); url = null; out = null; img.removeAttribute('src'); }
      function render() {
        clearTimeout(timer); timer = null;
        const f = st.fig; if (!f || !f.trace || el.hidden) return;
        dispose();
        try {
          out = PlotExport.toPlotSVG(f.trace, { ...P, title: `${docLabel(pat)} ${f.label}`, desc: `${pat.title}. Redrawn from the ${pat.scan_source || 'USPTO'} drawing sheet; outside5sigma.com/ipatent` });
        } catch (e) { out = null; stx.textContent = 'Export failed: ' + e.message; stx.title = ''; dl.disabled = true; return; }
        if (out.stats.empty) { out = null; stx.textContent = 'Nothing to draw with these settings'; stx.title = ''; dl.disabled = true; return; }
        url = URL.createObjectURL(new Blob([out.svg], { type: 'image/svg+xml' })); img.src = url; dl.disabled = false;
        const s = out.stats, n = v => v.toLocaleString('en-US');
        stx.textContent = `${n(Math.round(s.wMm))} x ${n(Math.round(s.hMm))} mm, ${n(s.paths)} paths, ${s.downM.toFixed(1)} m pen down, ${s.travelM.toFixed(1)} m travel, ${n(Math.round(s.bytes / 1e3))} kB${s.bytes > 5e6 ? ' (over 5 MB)' : ''}`;
        stx.title = `Drawing ${s.drawW.toFixed(0)} x ${s.drawH.toFixed(0)} mm; ${s.layers} layer${s.layers > 1 ? 's' : ''}; travel = pen-up moves in this path order`;
      }
      el.addEventListener('input', ev => {
        const k = ev.target.dataset.k; if (!k) return;
        const v = ev.target.type === 'number' ? +ev.target.value : ev.target.value;
        if (ev.target.type === 'number' && (ev.target.value.trim() === '' || !(v >= +ev.target.min && v <= +ev.target.max))) return;
        P[k] = v; try { localStorage.setItem('ipatent-plot', JSON.stringify(P)); } catch (e) { }
        clearTimeout(timer); timer = setTimeout(render, 150);

      };
      return {
        get open() { return !el.hidden; },
        toggle() { el.hidden = !el.hidden; if (!el.hidden) render(); drawTools(); },
        refresh: render,
        dispose,
      };
    })();
    const key = ev => {
      if (ev.key === 'Escape' && plot.open && ev.target.closest('.plotp')) { plot.toggle(); return; }
      if (ev.target.closest('input,select,textarea') || !$('#modal').hidden) return;
      if (ev.key === 'ArrowRight') { stopTour(); tourStep(1); ev.preventDefault(); }
      else if (ev.key === 'ArrowLeft') { stopTour(); tourStep(-1); ev.preventDefault(); }
      else if (ev.key === 'f' || ev.key === 'F') fv.pz.fit();
      else if (ev.key === 'Escape') { if (plot.open) return plot.toggle(); stopTour(); pin(null, false); fv.pz.fit(); }
      else if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
        const i = pat.figures.indexOf(st.fig) + (ev.key === 'ArrowDown' ? 1 : -1);
        if (pat.figures[i]) { go(pat, 'figures', pat.figures[i].id); ev.preventDefault(); }
      }
    };

    obs.observe(main, { childList: true });

      update(r) {
        const f = pat.figById[r.a] || pat.figures[0];

        else paint();
      }
    };
  }

  // ---------- description / claims with a linked figure pane ----------
  function linkedPane(pat, host) {
    const pane = h('div', 'pane'); host.appendChild(pane);
    const tools = h('div', 'tools'); pane.appendChild(tools);
    const box = h('div', ''); box.style.cssText = 'position:relative;min-height:0'; pane.appendChild(box);
    const st = { fig: null, ref: null, lock: null };
    const fv = new FigureView(box, { onClick: ref => { if (ref) go(pat, 'figures', st.fig.id, ref); }, tag: f => figL(f.label) });
    fv.el.style.cssText = 'position:absolute;inset:0';
    const sel = h('select'); pat.figures.forEach(f => sel.appendChild(new Option(figL(f.label), f.id)));
    sel.onchange = () => { st.lock = sel.value; show(pat.figById[sel.value]); };
    const open = h('button', '', 'Open in Figures'); open.onclick = () => go(pat, 'figures', st.fig.id, st.ref || undefined);
    const modes = h('span', 'grp');
    const drawModes = () => { modes.innerHTML = ''; [['trace', 'Redraw'], ['scan', 'Scan']].forEach(([m, n]) => { const b = h('button', fv.mode === m ? 'on' : '', n); b.disabled = !st.fig.trace && m !== 'scan'; b.onclick = () => { fv.setMode(m); drawModes(); }; modes.appendChild(b); }); };
    tools.append(sel, modes, h('span', 'spacer'), open);
    function show(f) { if (!f) return; if (f !== st.fig) { st.fig = f; fv.show(pat, f); sel.value = f.id; drawModes(); } }
    function figFor(ref) {
      if (st.fig && fv.has(ref)) return st.fig;
      const p = pat.parts[ref];
      const ids = (p && p.figs) || [];
      return pat.figures.find(f => ids.includes(f.id) && f.trace) || pat.figures.find(f => ids.includes(f.id)) || null;
    }
    show(pat.figures[0]);
    return {
      hoverRef(ref) {
        if (ref) { const f = figFor(ref); if (f) show(f); }
        st.ref = ref; fv.highlight(ref); if (ref && fv.has(ref)) fv.flyTo(ref); else if (!ref) fv.pz.fit();
      },
      showFig(id) { st.lock = null; show(pat.figById[id]); },
      follow(id) { if (!st.lock && !st.ref) show(pat.figById[id]); },
    };
  }

  function bindRich(container, pat, pane) {

  function TextTab(pat) {
    const root = h('div', 'textv'); main.appendChild(root);
    const col = h('div', 'tcol'); root.appendChild(col);
    const pane = linkedPane(pat, root);
    const bar = h('div', 'tbar'); col.appendChild(bar);

    bar.append(q, secSel, count);
    const body = h('div', 'tbody'); col.appendChild(body);
    const abs = h('div', ''); body.appendChild(abs);
    abs.innerHTML = `<div class="tsec">Abstract</div><div class="para"><span class="cite" data-col="">front</span><p>${subsup(pat.abstract || '')}</p></div>`;
    const nodes = [];
    pat.sections.forEach((s, si) => {
      const hd = h('div', 'tsec', esc(s.heading)); hd.dataset.sec = si; if (!s.heading) hd.style.margin = '12px 0 0'; body.appendChild(hd);
      pat.paras.filter(p => p.sec === si).forEach(p => {
        const n = h('div', 'para'); n.dataset.pid = p.id;
        const c = `<span class="cite" data-col="${p.col || ''}" data-page="${p.page != null ? p.page : ''}" title="Show on the scanned page">${citeOf(p)}</span>`;
        n.innerHTML = c + (p.table ? `<div><table>${p.table.map(r => `<tr>${r.map(x => `<td>${subsup(x)}</td>`).join('')}</tr>`).join('')}</table></div>` : `<p>${rich(p.text, p.spans)}</p>`);
        body.appendChild(n); nodes.push([p, n]);
      });
    });
    bindRich(body, pat, pane);
    secSel.onchange = () => { const hd = body.querySelector(`.tsec[data-sec="${secSel.value}"]`); if (hd) hd.scrollIntoView({ block: 'start' }); };
    let qt = 0;
    q.oninput = () => {
      clearTimeout(qt); qt = setTimeout(() => {
        const s = q.value.trim(); let hit = 0;
        const re = s ? new RegExp(s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi') : null;
        nodes.forEach(([p, n]) => {
          if (p.table) { n.style.display = re ? 'none' : ''; return; }
          const ok = !re || re.test(p.text); if (re) re.lastIndex = 0;
          n.style.display = ok ? '' : 'none'; if (ok && re) hit++;
          const pp = n.querySelector('p'); if (pp) pp.innerHTML = rich(p.text, p.spans, ok ? re : null);
        });
        body.querySelectorAll('.tsec').forEach(x => x.style.display = re ? 'none' : '');
        abs.style.display = re ? 'none' : '';
        count.textContent = re ? `${hit} paragraphs` : '';
      }, 120);
    };
    // the pane follows the figure referenced by the topmost paragraph in view
    const io = new IntersectionObserver(es => {
      const vis = es.filter(e => e.isIntersecting).map(e => e.target).sort((a, b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top);
      for (const n of vis) { const p = pat.paras[+n.dataset.pid]; const fs = p && p.spans.find(s => s[2] === 'fig'); if (fs) { pane.follow(fs[3]); break; } }
    }, { root: col, rootMargin: '0px 0px -60% 0px' });
    nodes.forEach(([, n]) => io.observe(n));
    return {
      update(r) {
        if (r.a != null && r.a !== '') {
          const n = body.querySelector(`.para[data-pid="${CSS.escape(r.a)}"]`);
          if (n) { n.scrollIntoView({ block: 'center' }); n.classList.add('flash'); setTimeout(() => n.classList.remove('flash'), 1600); }
        }
      }
    };
  }

  function ClaimsTab(pat) {
    const root = h('div', 'textv'); main.appendChild(root);
    const col = h('div', 'tcol'); root.appendChild(col);
    const pane = linkedPane(pat, root);
    const bar = h('div', 'tbar'); col.appendChild(bar);
    const q = h('input'); q.type = 'search'; q.placeholder = 'Search claims';
    const ind = h('button', 'on', 'Independent + dependent'); const only = h('button', '', 'Independent only');
    const grp = h('span', 'grp'); grp.append(ind, only);
    const count = h('span', 'lbl num'); bar.append(q, grp, count);
    const body = h('div', 'tbody'); col.appendChild(body);
    const nodes = pat.claims.map(c => {
      const n = h('div', 'claim' + (c.depends ? ' dep' : ''));
      n.innerHTML = `<div class="lbl"><span class="num">${c.n}</span>${c.depends ? ` &middot; depends on ${c.depends}` : ' &middot; independent'} <span class="cite" data-col="${c.col || ''}" data-page="${c.page != null ? c.page : ''}">${citeOf(c)}</span></div><p>${rich(c.text, c.spans)}</p>`;
      body.appendChild(n); return [c, n];
    });
    bindRich(body, pat, pane);
    let indOnly = false;
    const apply = () => {
      const s = q.value.trim(), re = s ? new RegExp(s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi') : null; let k = 0;
      nodes.forEach(([c, n]) => {
        const ok = (!indOnly || !c.depends) && (!re || re.test(c.text)); if (re) re.lastIndex = 0;
        n.style.display = ok ? '' : 'none'; if (ok) k++;
        n.querySelector('p').innerHTML = rich(c.text, c.spans, ok ? re : null);
      });
      count.textContent = `${k} of ${nodes.length}`;
    };
    q.oninput = apply;
    ind.onclick = () => { indOnly = false; ind.className = 'on'; only.className = ''; apply(); };
    only.onclick = () => { indOnly = true; only.className = 'on'; ind.className = ''; apply(); };
    apply();
    return { update() { } };
  }

  function AboutTab(pat) {
    const ent = pat.entities || {};
    const personHtml = e => `${esc(e.name)}${[e.city, e.region, e.country !== 'US' ? e.country : null].filter(Boolean).length ? ` <span class="pl">${esc([e.city, e.region, e.country !== 'US' ? e.country : null].filter(Boolean).join(', '))}</span>` : ''}${e.kind ? ` <span class="lbl">${esc(e.kind)}</span>` : ''}`;
    const root = h('div', 'about'); main.appendChild(root);
    const n = pat.notes || {};
    const row = (k, v) => v ? `<tr><th>${k}</th><td>${v}</td></tr>` : '';
    root.innerHTML = `<div class="wrap">
      ${n.patent ? `<div class="note"><span class="lbl">Note</span>${subsup(n.patent)}</div>` : ''}
      <h3>Bibliographic data</h3>
      <table>
        ${row(pat.doc ? 'Document' : 'Patent', `<span class="num">${esc(docLabel(pat))}</span>`)}
        ${row('Title', esc(pat.title))}
        ${row('Inventors', ent.inventors ? ent.inventors.map(personHtml).join('<br>') : esc((pat.inventors || []).join('; ')))}
        ${row('Term', pat.status ? `${esc(pat.status.state)} <span class="num">${esc(pat.status.term_end)}</span> <span class="pl">${esc(pat.status.basis)}${pat.status.google_expiration && pat.status.google_expiration !== pat.status.term_end ? `; Google Patents lists ${esc(pat.status.google_expiration)}` : ''}; checked ${esc(pat.status.checked)}</span>` : '<span class="unk">unknown</span>')}
        ${row('Assignee', ent.assignees ? (ent.assignees.map(personHtml).join('<br>') || '<span class="unk">none printed</span>') : esc(pat.assignee))}
        ${row('Application no.', `<span class="num">${esc(pat.appl_no)}</span>`)}
        ${row('Filed', `<span class="num">${esc(pat.filed)}</span>`)}
        ${row(pat.date_label || 'Issued', `<span class="num">${esc(pat.issued)}</span>`)}
        ${row('Int. Cl.', esc(pat.int_cl))}
        ${row('U.S. Cl.', esc(pat.us_cl))}
        ${row('Examiners', esc(pat.examiners))}
        ${row('Claims / figures', `<span class="num">${pat.claims.length} / ${pat.figures.length}</span>`)}
      </table>
      ${n.glossary && n.glossary.length ? `<h3>Glossary</h3><dl>${n.glossary.map(g => `<dt>${esc(g.term)}</dt><dd>${subsup(g.def)}</dd>`).join('')}</dl>` : ''}
      <h3>Parts index</h3>
      <table>${Object.values(pat.parts).sort((a, b) => parseInt(a.ref) - parseInt(b.ref) || a.ref.localeCompare(b.ref)).map(p =>
        `<tr><th class="num"><a href="#/${pat.pn}/figures/${esc((p.figs || [])[0] || pat.figures[0].id)}/${esc(p.ref)}">${esc(p.ref)}</a></th><td>${esc(p.name)}${p.alt && p.alt.length ? ` <span class="lbl">also</span> ${p.alt.map(esc).join('; ')}` : ''}</td><td class="num">${(p.figs || []).join(', ')}</td></tr>`).join('')}</table>
      ${pat.refs_patents && pat.refs_patents.length ? `<h3>U.S. patent documents cited</h3><table>${pat.refs_patents.map(r =>
        `<tr><td class="num">${esc(r.no)}</td><td class="num">${esc(r.date)}</td><td>${esc(r.name)}</td><td class="num">${esc(r.cl)}</td></tr>`).join('')}</table>` : ''}
      ${pat.refs_other && pat.refs_other.length ? `<h3>Other publications</h3><table>${pat.refs_other.map(r => `<tr><td>${esc(r)}</td></tr>`).join('')}</table>` : ''}
      <div class="sources">Text: OCR of the ${esc(pat.scan_source || 'USPTO')} scan, checked against the scan and ${pat.google ? `<a href="${esc(pat.google)}" target="_blank" rel="noopener">Google Patents</a>` : 'Google Patents'}; ${pat.ocr_fixes} OCR corrections; spelling kept as printed. Citations ${esc(pat.cite_scheme || 'column:line')}. Redraws traced from the drawing sheets; Scan view shows the original. Notes are added context, not patent text.</div>
    </div>`;
    return { update() { } };
  }

  if (SITE.home) $('#home').href = SITE.home;
  route();

  // ?selftest: drive every route, figure, part and hover; report into the #selftest block (read with --dump-dom)
  if (/selftest/.test(location.search)) {
    const errs = [], log = [];
    addEventListener('error', e => errs.push(`${e.message} @${e.lineno}`));
    addEventListener('unhandledrejection', e => errs.push(`rejection: ${e.reason && e.reason.stack || e.reason}`));
    const wait = ms => new Promise(r => setTimeout(r, ms));
    (async () => {
      if (SITE.links) {  // gallery page: cards only
        route('#/'); await wait(100);
        const cards = document.querySelectorAll('.card'), bad = [...cards].filter(c => !/^p\/\w+\.html#\//.test(c.getAttribute('href')));
        if (bad.length || cards.length !== PATS.length) errs.push(`gallery: ${cards.length} cards for ${PATS.length} patents, ${bad.length} bad links`);
        log.push(`gallery: ${cards.length} cards, ${document.querySelectorAll('.card svg .tr-el, .card svg [data-ref]').length} trace elements`);
        const n = () => document.querySelectorAll('.card, .gtable tbody tr').length;
        for (const v of ['cards', 'table']) for (const k of Object.keys(SORTS)) for (const d of ['', '&d=desc']) {
          route(`#/?v=${v}&s=${k}${d}`); await wait(5);
          if (n() !== PATS.length) errs.push(`${v} sort ${k}${d}: ${n()} rows`);
        }
        const probe = PATS[0], term = ((probe.inventors || [])[0] || {}).name || probe.title;
        route(`#/?v=table&q=${encodeURIComponent(term)}`); await wait(5);
        if (!document.querySelector(`.gtable tr[data-pn="${probe.pn}"]`)) errs.push(`search "${term}" misses ${probe.pn}`);
        route(`#/?q=zzzz-no-match`); await wait(5);
        if (!document.querySelector('.gnone')) errs.push('no-match state missing');
        for (const [k] of FACETS) for (const v of new Set(PATS.flatMap(p => p.facet[k]))) {
          route(`#/?v=table&${k}=${encodeURIComponent(v)}`); await wait(5);
          const want = PATS.filter(p => p.facet[k].includes(v)).length;
          if (n() !== want) errs.push(`facet ${k}=${v}: ${n()} rows, want ${want}`);
        }
        log.push(`gallery: ${Object.keys(SORTS).length} sorts x 2 views x 2 dirs, search, facets checked`);
      } else for (const p of PATS) {
        for (const f of p.figures) {
          route(`#/${p.pn}/figures/${f.id}`); await wait(30);
          const refs = f.refs.slice(0, 40);
          for (const r of refs) { route(`#/${p.pn}/figures/${f.id}/${r}`); await wait(5); }
          const hits = document.querySelectorAll('.fv .hit [data-ref]').length, on = document.querySelectorAll('.fv .tr-el.on').length;
          log.push(`${p.pn} fig ${f.id}: trace=${!!f.trace} hit=${hits} lastSelOn=${on} refs=${f.refs.length} missingInTrace=${f.trace ? f.refs.filter(r => !f.trace.elements.some(e => e.ref === r)).join(',') : '-'}`);
        }
        // plotter export: every traced figure, then the panel once
        if (!window.PlotExport) errs.push(`${p.pn}: PlotExport missing`);
        else {
          let np = 0;
          for (const f of p.figures) if (f.trace) {
            try { if (PlotExport.toPlotSVG(f.trace).stats.paths > 0) np++; else errs.push(`${p.pn} fig ${f.id}: plot export empty`); }
            catch (e) { errs.push(`${p.pn} fig ${f.id}: plot export ${e.message}`); }
          }
          const tf = p.figures.find(f => f.trace), pbtn = () => [...document.querySelectorAll('.tools button')].find(x => x.textContent === 'Plot SVG');
          if (tf) {
            route(`#/${p.pn}/figures/${tf.id}`); await wait(30); pbtn().click(); await wait(60);
            const ps = document.querySelector('.plotp:not([hidden]) .pst');
            if (!ps || !/paths/.test(ps.textContent)) errs.push(`${p.pn}: plot panel did not render`);
            log.push(`${p.pn} plot: ${np} figures exported; panel: ${ps && ps.textContent}`);
            pbtn().click();
          }
        }
        for (const t of ['text', 'claims', 'about']) {
          route(`#/${p.pn}/${t}`); await wait(120);
          const a = document.querySelector('a.rf');
          if (a) { a.dispatchEvent(new MouseEvent('mouseover', { bubbles: true, clientX: 10, clientY: 10 })); await wait(20); a.dispatchEvent(new MouseEvent('mouseout', { bubbles: true })); }
          log.push(`${p.pn} ${t}: view=${view && view.pat.pn}/${view && view.tab} rf=${document.querySelectorAll('a.rf').length} fg=${document.querySelectorAll('a.fg').length}`);
        }
      }
      const pre = document.createElement('pre'); pre.id = 'selftest';
      pre.textContent = `SELFTEST ${errs.length ? 'FAIL' : 'PASS'}\n` + errs.join('\n') + '\n' + log.join('\n');
      document.body.appendChild(pre);
    })();
  }
})();

</script>
</body>
</html>
